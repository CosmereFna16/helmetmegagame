# ARCHIVE — the Cult of Bacchus, retired from the live game on 2026-09-02.
#
# Nothing reads this file. No sync, no script, no route. It is a verbatim dump
# of every entry the Cult owned in the YAML masters and docs/threats.md, each
# block copied exactly as it sat there (comments included), so putting them
# back is a paste: each top-level key below names the master section it came
# from (`categories` and `tags` -> docs/tags.yaml, `taggroups` ->
# docs/taggroups.yaml `groups:`, `documents` -> docs/documents.yaml,
# `familyGroups` / `families` / `desires` -> docs/desires.yaml, `threats` ->
# the two briefs under "## Town" in docs/threats.md).
#
# Six statuses the Cult's rites inflicted on OTHER people (silence, rage,
# lunatic, nailed, shirtless, monster-possession) are here too: nothing else
# ever applied them. `instant-camera`, `bliss`, `euphoric` and the folk belief
# `old-ways-bacchus` stayed live — they are general content the Cult merely
# used.
#
# Code that went with the Cult (see git history around this date):
#   - db/lib/partySize.js and the whole {partysize:N} token: the barrel line
#     in db/index.js, web/lib/referenceData.js#getPartySizes,
#     web/app/components/PartySizeProvider.js + PartySizeChip.js, and the
#     `partysize` branch in RichText.js / DocumentMarkdown.js / ChipText.js.
#     docs/systemdocs/PARTY-SIZE.md described it. The thresholds were 4, 8,
#     12 and 16 players per 100, floored, never below 1.
#   - The `mindlink` entry in db/lib/specialChannels.js (the #mindlink
#     channel: `mindlink` holders could talk, `cultist` holders could read).
#     GameConfig.mindlinkChannelId is still in the schema, unused.
#   - RAGE_SLUG in db/lib/constants.js and `ragingBlind` in
#     db/lib/inspectVision.js (a raging character could not inspect).
#   - The `cultist` seat in db/lib/antagonists.js.
#   - "bacchus" in db/lib/syncTags.js#HIDDEN_CATEGORIES (the category-prefixed
#     slug allowance for hidden categories).

categories:
  bacchus:
    name: Bacchus

tags:
  # --- Cult ---------------------------------------------------------------
  # The Cult of Bacchus's own progression, kept out of the hidden `bacchus`
  # category on purpose: `cultist` (General) is the gate that
  # OPENS that category, and these track how far the cult has got rather than
  # being powers it grants. They sit in the `meta-cult` group so /api/tags
  # withholds them from anyone who isn't already a Cultist — see the note on
  # that group in docs/taggroups.yaml.
  #
  # Ripening -> Bountiful is a replacing tier chain, so a cult holds at most
  # one rung at a time. There is no base rung: a young cult simply holds no
  # tier tag (the old Cult: Seedling granted nothing and was removed).
  # `cultist` is deliberately NOT part of the chain — a Cultist
  # keeps it while climbing, since it is what keeps the Bacchus category
  # unlocked.
  cult-leader:
    name: Cult Leader
    category: meta
    group: meta-cult
    description: "You understand Bacchus's plan."
    pointCost: 0
    purchasable: false

  cult-ripening:
    name: "Cult: Ripening"
    category: meta
    group: meta-cult
    description: "Your cult is maturing. Unlocks the Ripening tags."
    pointCost: 0
    purchasable: false

  cult-bountiful:
    name: "Cult: Bountiful"
    category: meta
    group: meta-cult
    description: "Your cult is at its prime. Unlocks the Bountiful cultist tags. Fulfill your mission!"
    pointCost: 0
    parentTag: cult-ripening
    purchasable: false
    # A cult that reaches its prime can no longer hide: this is the tag whose
    # rung makes a bystander's 🔍 read "Cult: Bountiful".
    # Seedling and Ripening stay concealed.
    visible: true

  # --- General --------------------------------------------------------------

  # Slug kept deliberately: renaming means changing `name`, not `slug` (see
  # this file's header). This is the gate on the hidden Bacchus category.
  cultist:
    name: Cultist
    category: general
    description: "We are free, so free! Unlocks the Bacchus tags."
    pointCost: 0
    purchasable: false
    # Two-clause lock (2026-08-31, Desires rework): closed to everything but
    # cult-bacchus at tier 1, but alcohol/drugs/food/romance stay open from
    # tier 2 up — the "replaces the old +5-per-Desire compensation" carve-out.
    desires:
      locks:
        - tiers: [1]
          exceptFamilies: [cult-bacchus]
        - tiers: [2, 3, 4, 5, 7]
          exceptFamilies: [cult-bacchus, alcohol, drugs, food, romance]

  # --- Bacchus --------------------------------------------------------------
  # The Cult's own powers. Gated by group, not by tag: `bacchus` requires
  # `cultist`, `bacchus-ripening` requires `cult-ripening`,
  # `bacchus-bountiful` requires `cult-bountiful` (docs/taggroups.yaml), so
  # none of the tags below repeat a requiredTag for that gate — same posture
  # as the `demoness` group above.
  #
  # Spell/Rite naming: the display name carries the "Spell:"/"Rite:" prefix so
  # it can never collide with the status it inflicts on someone else (Rite:
  # Rage vs. the Rage status a victim ends up holding) — documents.yaml
  # assigns by tag NAME, and two rows sharing one is a coin toss.
  #
  # Cooldown markers: a spell with a stated cooldown lists ITSELF plus a
  # `<name>-expired` marker in consumesInto. dropCharacterTag runs before
  # grantTagSlugs in consumeTagRequestImpl, so the caster keeps the spell and
  # picks up the marker in the same transaction — same idiom as the potion at
  # requestEffects.js. Markers carry no description (optional field) and sit
  # outside the Spell:/Rite: naming, since nobody reads them as a chip.
  #
  # A status a spell inflicts on someone ELSE — who is usually not a cultist —
  # is NOT gated: a gated group would render as literal `{tag:slug}` text to
  # its own holder and inspect would withhold it. Same for the Bacchus
  # craftables, which get traded to non-cultists.
  spell-nourishment:
    name: "Spell: Nourishment"
    category: bacchus
    group: bacchus
    description: "Once every 2 turns, touch someone else. Grant them {tag:ate-meal}. | vory ysm lechem, wa oryy"
    pointCost: 5
    purchasable: true
    purchasableAfterStart: true
    removable: true
    consumable: true
    consumesInto: [spell-nourishment, nourishment-expired]

  nourishment-expired:
    name: Nourishment (Expired)
    category: bacchus
    group: bacchus
    pointCost: 0
    purchasable: false
    removable: true
    durationTurns: 2

  rite-transmutation:
    name: "Rite: Transmutation"
    category: bacchus
    group: bacchus
    description: "Takes 1 turn. Turn up to 3 {tag:fine-meal}s into 1 {tag:ravenheart-red} each. | xe qorvym lys ymadv rechem"
    pointCost: 7
    purchasable: true
    purchasableAfterStart: true
