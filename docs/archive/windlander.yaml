# ARCHIVE — the Windlander faction, retired from the live game on 2026-09-02.
#
# Nothing reads this file. No sync, no script, no route. It is a verbatim dump
# of every entry the Bastard's Camp and its two clans owned in the YAML
# masters, each block copied exactly as it sat there (comments included), so
# putting them back is a paste: each top-level key below names the master
# section it came from (`tags` -> docs/tags.yaml `tags:`, `taggroups` ->
# docs/taggroups.yaml `groups:`, `roles` -> the `zones:` sequence in
# docs/roles.yaml, `documents` -> docs/documents.yaml `documents:`).
#
# The Windlands ZONE itself (docs/zones.yaml, its channels and roles) was kept:
# it is geography. Only the people who lived there left.
#
# Code that went with them (see git history around this date):
#   - db/lib/roleCapacity.js#PERMANENT_SEAT_ROLE_SLUGS lost its "Windlands"
#     block: bastard, champion, mother, follower,
#     lieutenant-broken-spears-clan, master-of-parties,
#     clansman-broken-spears-clan, lieutenant-windrider-clan, ranger,
#     clansman-windrider-clan.
#   - docs/desires.yaml `see-the-windlands` stayed live but dropped its
#     `requires.notTags: [windlander]` gate. Under `desires` below:
#     `sign-language-talk` (gated on sign-language) and the thirteen desires
#     that only exist because of the camp — the ones gated on its ten role
#     slugs, plus the Baron's and the Captain's wish to slay the Bastard.

tags:
  windlander:
    name: Windlander
    category: skills
    description: "You know the ways of the Windlands. You may move about freely there, and you are less affected by its dangerous weather."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true

  #Windlanders only
  the-wind:
    name: The Wind
    category: general
    group: general-beliefs
    description: "Hardship has made you supreme. One day, God will provide you a kingdom."
    pointCost: 0
    requiredTag: windlander
    purchasable: true
    purchasableAfterStart: true
    removable: true
    exclusive: true

  # --- The Windlands ----------------------------------------------------
  mountaineer:
    name: Mountaineer
    category: general
    group: general-windlands
    description: "You can lead a group through the mountains instead of through the plains. You fight better there too, can track people, can hide. Interestingly, you can also climb walls perfectly well."
    pointCost: 7
    purchasable: true
    purchasableAfterStart: true

  hardy:
    name: Hardy
    category: general
    group: general-windlands
    description: "You grew up in hell. Hunger, the elements, and thirst — these don't bother you."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true

  honorbound:
    name: Honorbound
    category: general
    group: general-windlands
    description: "Your clan is your foremost concern in life. Feuds must be settled before anything else can happen. You must act accordingly."
    pointCost: -2
    visible: false
    # Retired 2026-08-31 — Desires rework; absorbed into blood-feud
    # (general-restrictions). Free removal where held alone.
    purchasable: false
    purchasableAfterStart: false

  siege-engineer:
    name: Siege Engineer
    category: general
    group: general-windlands
    description: "You can make simple siege engines, build ladders, and such. Useful for getting past walls."
    pointCost: 5
    purchasable: true
    purchasableAfterStart: true

  detonation-charge:
    name: Detonation Charge
    category: general
    group: general-windlands
    description: "A great keg of dynamite hauled from one of the old gunpowder clans. Can blow a hole in a wall."
    pointCost: 14
    tradeable: true
    stackable: true
    visible: true
    purchasable: true
    purchasableAfterStart: true
    removable: true

  blood-debt:
    name: Blood Debt
    category: general
    group: general-windlands
    description: "Take only if you're a Windrider. The murdered clansman was family or your best friend. Take revenge!"
    pointCost: -7
    visible: false
    # Retired 2026-08-31 — Desires rework; superseded by blood-feud
    # (general-restrictions), which absorbs it and honorbound at par.
    purchasable: false
    purchasableAfterStart: false

  sign-language:
    name: Sign Language
    category: skills
    description: "You know sign language, the ancestral language of the Windlanders. To speak with others in sign language when others are around, use a private thread."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true

  # Breaking a horse is Windlander knowledge, and only a Windlander can buy
  # it. `wild-horse-trainer` is the only trainer on sale; the open
  # `horse-trainer` below it is retired. That makes the Windlands camp the
  # single source of every new horse in the game — everyone else has to trade
  # for one, which is the Merchant's whole reason to cross the map.
  #
  # The horse it makes is the ungated {tag:horse}, not `wild-horse`, so
  # what a Windlander produces is freely tradeable to a townsman. Owning a
  # horse was never the gated part; making one is.
  wild-horse-trainer:
    name: Wild Horse Trainer
    category: skills
    group: skills-labor
    description: "You grew up around horses, wild ones included — the trick every outsider stableman never learned. For 21 ⬢ and 1 turn, you can produce a {tag:horse} and give it to anyone else."
    pointCost: 5
    requiredTag: windlander
    purchasable: true
    purchasableAfterStart: true
    requirement:
      resourceCost: 21
      turnsCost: 1

  # Retired: horse breeding went Windlander-only. The row stays in this file
  # on purpose rather than being deleted. syncTagsFromYaml is upsert-only, so
  # dropping the entry would leave the DB row alive AND still purchasable,
  # and db:prune-tags refuses to delete a tag anyone holds — either way it
  # would keep appearing in /store. Kept here, the sync pins both flags to
  # false on every run, the characters who already bought it keep it, and a
  # GM can still assign it by hand.
  horse-trainer:
    name: Horse Trainer
    category: skills
    group: skills-labor
    description: "You can break and raise horses for others. For 21 ⬢ and 1 turn, you can produce a {tag:horse} and give it to anyone else."
    pointCost: 7
    purchasable: false
    purchasableAfterStart: false
    requirement:
      resourceCost: 21
      turnsCost: 1

  #Windlander only
  cavalry:
    name: Cavalry
    category: skills
    group: skills-fighting
    description: "You fire bows and wield spears effortlessly from the back of a horse. While mounted, your fighting skill (whether melee or ranged) counts as 2 tiers higher."
    pointCost: 10
    requiredTag: windlander
    visible: false
    purchasable: true
    purchasableAfterStart: true

  wild-horse:
    name: Wild Horse
    category: assets
    group: assets-companions
    description: "You have a horse and you know how to ride it. Once per day, you may enter an adjacent zone without spending a turn, but you'll be easily visible. Do not use through caves. Can carry 2 people."
    pointCost: 6
    requiredTag: windlander
    tradeable: true
    purchasable: true
    visible: true
    purchasableAfterStart: false
    removable: true

taggroups:
  # Fourth body-membership group, same shape as the three above. The key is
  # `windlander` — a purchasable Skills tag every Windlands role gets free
