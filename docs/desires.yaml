  # --- Personality: Pacifist ------------------------------------------------
  # Personality rework (2026-09-01). Pacifist used to cost 2 points and give
  # nothing back — it locks [violence, feud] and opened nothing. These two are
  # what a Pacifist is FOR, and neither may carry `violence` or `feud`: the
  # union rule means a tag's own lock would otherwise close its own Desires.
  # Same shape as Kleptomaniac's fix (Ruling R7, DESIRES.md §3).
