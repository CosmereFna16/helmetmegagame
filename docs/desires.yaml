  - key: vanity
    name: Vanity
    group: heart
    color: "#eab0c8"
    # Being admired, complimented, adorned, or unmistakably better-looking
    # than the room.
  - key: violence
    name: Violence
    group: blood
    color: "#e07868"
    # Deliberate physical harm — fights, brawls, duels, battles, killings.
  - key: cruelty
    name: Cruelty
