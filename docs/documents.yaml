explanation:
  tag: Anyone with this tag gets this Document.
  public: If assigned, this will appear in a player's document folder. However, using the search function, anyone can browse and find this document.
documents:
  - name: Courtier
    key: courtier
    public: false
    tags: []
    description: As a member of the Baron’s retinue, you may take food from the faction Silo whenever you please—within reason (Treasurer and Leader roles can see their Silo’s transaction history, so don’t steal. If you’d like to steal, arrange it with a GM).
  - name: Church
    key: church
    public: false
    tags: []
    description: As a member of the Church, you may take food from the faction Silo whenever you please—within reason (Treasurer and Leader roles can see their Silo’s transaction history, so don’t steal. If you’d like to steal, arrange it with a GM).
  - name: Independent
    key: independent
    public: false
    tags: []
    description: As an independent townsman, you aren't on anyone's payroll. The Headman isn't expected to pay you. You should therefore ply a trade so you don't starve to death.
  - name: Ravenheart's Economy
    key: ravenhearteconomy
    public: true
    tags: []
    description: |-
      You are welcome to change things, but this is how things have been done for years:

      The town farms, fishes, and hunts. Most of that is taxed by the Headman, who sends a fraction of his tithe to the Bishop and the bulk to the Baron (through the Meister, his tax-man). What little he has left is paid to those on the town's payroll, mostly the Sheriff.

      So, the Fortress survives off of the town's taxes, and provides protection in turn.
      The Church survives off of of the town's taxes, and provides religious services in turn.
  - name: Diplomat
    key: diplomat
    public: false
    tags: []
    description: |-
      You are from the Culture, a post-scarcity interstellar empire of hedonists ruled by benevolent AI. You want the best for the people of Ravenheart—and that would mean convincing the Baron to join the Culture—but Contact (the Culture's diplomatic wing) operates in the scale of centuries, not human generations. They don't think it's the right time, although they haven't told you why. In general, Contact is very non-interventionist. Therefore, do the best you can to quietly help people and further the Culture's mission: help push for a leader likely to cooperate, ensure the Order of the Iron Cross doesn't grow out of control, and above all, do not blow your cover! The *last* thing the Culture wants is for the people of Ravenheart to know you're here...

      They would appreciate it if you collected any interesting gear, took some photos with your drone, and sent logs to the mothership. The caves supposedly have a lot of interesting things going on, but it's probably dangerous.

      Also, you probably had a good reason to come here (boredom?) and your friends thought you were cr*aaa*zy! Coming here? Where you could die?! Back home, almost no one dies, ever. Everything is just very safe.

      You have one (!) gadget—an autonomous, sentient flying drone with a supercomputer for a brain. It's disguised as a bird and has a strong personality. It likes to fly and look around the forest. It's harmless.

      If anything goes wrong, the General Contact Vessel *Helpless Is The Face Of Your Beauty* will teleport you on board. It'll take your message three minutes to reach them.
  - name: Treasurer
    key: treasurer
    public: true
    tags:
      - Treasurer
      - Leader
    description: |-
      As Treasurer or Leader, you can control your faction's Silo.

      You can see every deposit and withdrawal, in addition to each member's Resource amounts.

      ## Where the Silo is

      A Silo is a warehouse, not a promise. It sits in your faction's home zone, and Resources only move in or out of it if the person moving them is standing in that zone. Nothing is wired anywhere. A tax owed to another faction has to be carried to them, by someone, along a road—and a road is a place where things happen to people.

      You and your Leader are the exception. Wherever either of you stands, anyone sharing your zone can reach your Silo from there. Ride out to meet a debtor and you have spared them the journey; sit behind your walls and every payment to you becomes a trip worth ambushing.

      Handing Resources or an item directly to another person is closer work: you must be in the same location, not merely the same zone.
  - name: Medical
    key: medical
    public: true
    tags:
      - medical-basic
      - medical-skilled
      - medical-expert
    description: |-
      Health and injuries are simulated through the tag system. Most health tags can be removed, usually for a cost. The cost includes: Resources, number of routine moves (bandaging someone doesn't have a turn cost; surgery does), the skill requirement, and whether or not it requires a Gambit. Anyone can try to heal a wound without the required skill (just DM the Bascinet bot), but it'll require a Gambit.

      ## Skills

      {tag:medical-basic} handles first aid routinely.
      {tag:medical-skilled} handles **moderate** and **severe** cases routinely, but rolls Gambits on surgery.
      {tag:medical-expert} handles almost everything routinely.

      ## Expiry

      Some wounds, like infections, get worse.

      ## Tonics

      Tonics (see the Brewing document) can instantly cure wounds and help recovery, but require unique ingredients. Similarly, a few afflictions—like {tag:blinded}—require unique ingredients.
  - name: Producing Resources
    key: production
    public: true
    tags:
      - Laborer
      - Laborer (Farming)
      - Laborer (Fishing)
      - Laborer (Herding)
      - Laborer (Hunting)
    description: |-
      Everyone can use Routine Moves to produce resources, but only people with the {tag:laborer} set of tags will produce an actually good amount.

      Use the `/hunt`, `/fish`, `/farm` and `/herd` commands in #turns to automatically generate a turn (or `/labor <type>`) but you have to be in the right location.

      | Activity | Base | Laborer | Specialist | Where |
      |---|---|---|---|---|
      | Herding | {resource:herding:base} | {resource:herding:laborer} | {resource:herding:specialist} | Anywhere but the Caves |
      | Farming | {resource:farming:base} | {resource:farming:laborer} | {resource:farming:specialist} | Town |
      | Fishing | {resource:fishing:base} | {resource:fishing:laborer} | {resource:fishing:specialist} | Fortress or Town |
      | Hunting | {resource:hunting:base} | {resource:hunting:laborer} | {resource:hunting:specialist} | The Forest |

      Laborer is a general-purpose 2-point tag that makes producing resources more viable than just as a survival method, while the specialist tags (you can buy them for 2 points on top of Laborer) make that specific trade a lot more valuable.

      To automatically add Resources on a Move, type +(resources) anywhere in your message — for example `I sell my wares. +3`. Write a range like `5-12` to roll for it instead, or just write `/hunt` and let your tags decide. All of this works on default moves too.
  - name: Combat
    key: combat
    public: true
    tags: []
    description: |-
      The theory and nitty-gritty of combat—like, the realistic physics—is as important as the skill. Even a master fencer won't be able to do much against a random guy in plate armor, and just a few horse archers can take out a whole squad of footpads. Different weapons excel in different circumstances, like: how much space you have, whether you’re alone or in formation, and whether your opponent is armored.

      **Melee**
      - Polearms are ubiquitous. Their reach means you can keep the opponent away and decide when the battle starts. They come in stabby, crushy, and pokey varieties.
      - Blunt weapons are useful even against armored targets, but won’t help find weakspots.
      - Precision weapons, like swords held by the blade (halfswording) or daggers, are useful against armored opponents if you can wrestle them down to the ground.
      - Hidden weapons are useful in social environments.
      - Cutting and stabbing weapons really hurt unarmored people.
      - Axes can break shields or drag them out of position.

      **Ranged**
      - Bows and slingshots are quiet and really hurt unarmored targets. Very big bows can crack or penetrate armor.
      - Crossbows take time to reload but are better against armored opponents.
      - Firearms beat everything.

      Shields are very useful. For armor, there’s a few important traits: material, concealability, weight, and donning time. Some items can be worn under regular clothes. Certain items, like plate, will make a long trek through the forest difficult—you’ll get very hot under all that metal—but make you a veritable tank in combat. Seriously, almost nothing can get through plate. However, it also has the downside of being hard to equip, so if you’re, say, at a feast and someone pulls out a dagger, you’d better have a padded jack or brigandine underneath.

      **Energy Shields**
      - Stop projectiles.
      - Reduce, but don't stop, melee damage.
      - Do nothing against needles or syringes.
      - Worn on the belt or the wrist.
  - name: Town Starting Packet
    key: townstarting
    public: false
    tags: []
    description: |-
      The Headman received a raven saying he didn't receive the last tax wagon. It was probably ambushed by bandits. The Meister won't be happy about this... prepare to have the Silo drained.

      Last week, Thomas Ciobanu—a respectable tradesman—was found milky-eyed, giggly, with a profoundly satisfied look. He wandered around aimlessly, going hungry—when people tried to help him, he just called them fools. The Esculap's medicine couldn't do anything for him, so the Inquisitor had him hanged. He fought all the way to the gallows, like a rabid dog.
  - name: Fortress Starting Packet
    key: fortressstarting
    public: false
    tags: []
    description: |-
      The last tithe didn't arrive and it shows. Banquets are paused, and the food is being rationed. The Silos will run dry until the next tax wagon arrives. It is up to the Baron's men to resolve this.

      To make things worse, a letter from the Bastard declaring his intents was found on the table. Since the Guards didn't see anyone come in to deliver it, it must've been someone on the inside—someone who favored the Bastard—that brought it in. There must be a traitor.
  - name: Camp Starting Packet
    key: campstarting
    public: false
    tags: []
    description: |-
      The word for wind in the Windlands is the same word as train, because that's how hard it blows.

      While most of humanity today lives underground—or in those rare fertile oases like Ravenheart—your people refused to cower in the darkness like animals. You lived among brambles, lizards, and oxen. To protect yourself, you wore wind goggles, masks, and gloves. Often being unable to hear your comrades, you were taught sign language as a child and learned to recognize people by their gait.

      The air is still here near Ravenheart. This could be a home. What will life be without having to move to find food? What will life be without wind? What will it be like to see your friend's face, and not just their mask?

      The Bastard has united the clans. The Windriders and the Broken Spears are the two that survived the long march to Ravenheart. You are ready to fight. However, there was an incident: a man from the Broken Spears killed one of the Windriders during an argument on whether to raid the town. Additionally, food stores are running low.
  - name: Broken Spear Clan
    key: brokenspear
    public: false
    tags: []
    description: |-
      You are lightning on the plains—a hundred horses galloping! Behold the people of Ravenheart, like sheep ready for the rending. After you take it, Ravenheart will become a place of strength and honor.

      The Bastard showed strength when he defeated your Lieutenant, but not honor: he spared his life, humiliating him even further. You will follow him gladly.

      However, the fire in his eyes has died. The man ponders and calculates like an old toothless woman. Ravenheart knows you are here—every day wasted is a day they grow stronger. The birds watch you as if you were a corpse ready for the picking.

      In the meantime, you have a threat close at hand: the scheming, snakelike Windriders. During an argument about whether or not to raid the village for food, one of your men killed one of theirs. They are not happy. Perhaps they are scared of your strength.

      Celebrations of life are as common as honor killings in the Broken Spears clan. Drug use—or "riding the horse"—is common and approved. Methamphetamine is a favorite. Addiction, however, is weakness; what, did you fall off the horse?
  - name: Windrider Clan
    key: windrider
    public: false
    tags: []
    description: |-
      The Windrider Clan was the last to bend the knee to the Bastard. An impenetrable sense of family, centuries of prestige: Ereglas the Conqueror, Oliver Horserider, The Ranger Chief, all were Windriders.

      Fate has already decided your course. You were forged upon the face of a dead planet. You are the ideal human, intelligent, capable, and unyielding. They cannot stop you.

      The Bastard understands an all-out attack would be suicide. Support of the people, logistics, careful planning; these are what kept the Windriders alive while clans like the Broken Spears formed and disbanded, year by year. So your fealty was lightly given. You trust his plan will net you a home, but you will not accept a king.

      One of the Broken Spears brats murdered one of your men during an argument. These things happen; but such a childish deed cannot go unpunished, can it? Either the Bastard makes amends—prioritization of resources, independence after taking Ravenheart, or some other promise—or the Broken Spears get put down like the brushlizards they are.
  - name: The Lifeweb
    key: lifewebbasic
    public: true
    tags: []
    description: |-
      The Lifeweb is a profoundly unintelligible piece of machinery within the Fortress's walls—a tower that, at its peak, spews the Life Fire. Although it also produces electricity, it is mainly prized for the Fire, which is said to be what keeps Ravenheart arable, breathable, and livable. One only needs to follow the river a few miles southeast before seeing, far in the distance, the wind-scorched lands of the rest of the world, humid, scarred, and inhospitable.

      The tower has a door leading downwards.
  - name: Lifeweb (Mortus)
    key: lifeweb
    public: false
    tags: []
    description: |-
      The Lifeweb is a profoundly unintelligible piece of machinery within the Fortress's walls—a tower that, at its peak, spews the Life Fire. Although it also produces electricity, it is mainly prized for the Fire, which is said to be what keeps Ravenheart arable, breathable, and livable. One only needs to follow the river a few miles south east before seeing, far in the distance, the wind-scorched lands of the rest of the world, humid, scarred, and inhospitable.

      The tower has a door leading downwards. Inside, levers control what parts of Ravenheart receive power. It also has a door which can be opened to reveal pistons, firing madly, witchfire green. There's a chair on a platform with complex implements. You can hook someone in, strap them down, align the machinery, cue the machine to speculate the vitrii, select the injection point, and decide whether you want some blood drawn—granting {tag:drained} and feeding the Lifeweb 20 points—or all the person's blood, feeding the Lifeweb 100 points but killing the donor.
  - name: Respawning
    key: respawning
    public: true
    tags:
      - Chaplain
      - Mortus
      - Dead
    description: |-
      When you die, you can rejoin at any time—but you'll be Cursed, meaning you can only start as a Bum or Migrant and you'll suffer a -3 penalty to your starting points.

      To rejoin as any other role, wait until your body is buried or your name is engraved. It is the Church and Mortii's jobs to do so.
  - name: Court Structure
    key: courtstructure
    public: false
    tags: []
    description: |-
      The Baron rules. His Hand is his spymaster and voice—loyal, proactive, and the one who actually keeps the court organized. The Meister is the Keep's circulatory system: he collects the Town's taxes through the Headman and watches the Silo so nobody bleeds it dry.

      The Captain commands the Watch. The Bishop leads the Church and, with the Priests, tends to people's souls. The Esculap runs the Sanctuary and everyone's health. The Inquisitor answers to no one but God, and would very much like the Bishop to remember that.

      Below them all, Courtiers gossip, scheme, and try not to get caught doing either.
  - name: Guard Duty
    key: watchman
    public: false
    tags: []
    description: ""
  - name: Post-Christianity
    key: postchristianity
    public: true
    tags: []
    description: |-
      In the darkness, there are sacred things. And what is most sacred? That which remembers. What is darkness but ignorance?

      Can you blame them, the writhing monsters, suckling beneath the surface? They are less than animal. They have proven that that essence of purity which God imbued us with is not immutable; to the contrary, people have lost it, spat on it, cursed it.

      ... And some people mock it, but what do they know of the stability, the openness of an ennobled mind, the very peace they seek through their perversions? It is good—it is the ultimate good—to love oneself, and through oneself, God.

      It is regrettable, but not reproachable, that God smote the Earth. At the very least, those of us who remained faithful were given this sliver of Paradise.

      The problem with the Heretic is just that: they crawl out from their holes, seeking to turn us against the Truth. But they cannot. Even if they were to murder and devour all of us, we would not forget God—as long as we chose not to. Nothing can take away faith, charity, and virtue, except our own malfeasance.

      In any case, the Afterlife is around the corner, as it always was and it always will be. Only by forgetting that could we prioritize the gratification of the moment.
  - name: Messenger Ravens
    key: ravens
    public: public
    tags:
      - Ravenkeeper
    description: |-
      Anyone with the Ravenkeeper tag can, assuming they're near their rookery, send a message to up to one person a turn. To do so, simply message the GMs asking.
  - name: Smithing Price List
    key: smithinglist
    public: false
    tags: []
    description: ""
  - name: Merchant Price List
    key: merchantlist
    public: false
    tags: []
    description: ""
  # The Cult of Bacchus's three briefs, replacing the old empty `cult` stub.
  # Assigned by tag, the same way the Demoness threat's brief is — a GM hands
  # the seat out and the paper arrives with the powers. The Leader holds
  # Cultist too, so they get all three.
  #
  # The party thresholds are {partysize:N} tokens rather than literals: they
  # scale with GameConfig.playerCount (4/8/12/16 per 100, floored, minimum 1)
  # via db/lib/partySize.js, so turning the player-count dial on /gm/dev
  # retargets every goal without an edit here.
  - name: Cult Leader
    key: cultistleader
    public: false
    secret: true
    tags:
      - Cult Leader
    description: |-
      You are a very old being, a wielder of supreme arcane magics, a true master of pleasure-seeking.

      As a Leader, you must be proactive, coordinated, and active. Your word is final, but you must organize your Cultists if they have a chance to succeed. *You must set the plan.* To help you, every two days, you can send a telepathic message to every cultist in Ravenheart with orders (DM the GM's).

      There is a Demoness in the area. She hates you. If you manage to convert her, she'll lose all her powers, but you would gain 10 Tag Points.

      Bacchus has told you about Eternal Bliss. It is not what you expected, but it is, in a strange way, the greatest thing there is. You are very happy with your choice. Unlike other Cultists, you are far too deep in, and you can never lose your faith. They can either imprison you or kill you; they can't break you.
  - name: Cultist
    key: cultist
    public: false
    secret: true
    tags:
      - Cultist
    description: |-
      - After enough time living quietly, your cult leader has made the call: it is time to seek Eternal Bliss.
      - This will be difficult. You will have to find a strategy, coordinate, and execute. You can start a front—a guild, a charity, a troupe of entertainers—or you can declare war and lose the cover. Either way, listen to your Leader; he has the final word.
      - Your Desires must be more pleasurable, slothful, outlandish, cruel, or otherwise indulgent than the average person's.
      - To achieve Eternal Bliss, Bacchus has asked you to host parties. When a party is hosted that contains {partysize:1}, {partysize:2}, and {partysize:3} people, you will unlock access to new, more powerful Bacchus tags. The Final Party requires {partysize:4} people and blood of someone with the {tag:nobility} tag: the Baron, his family, or the Bastard. Something very fun happens at the Final Party.
      - Your parties must be well supplied. Anyone that participates in your party, whether or not they're a cultist, counts towards the number. You may hide the true nature of your parties. People with the {tag:nobility} tag count as 3 people.
      - You can leave the Cult at any point, but you must confess everything you've ever done to a preacher, lose -10 Tag Points (yes, you can go into negative), and suffer through life-changing, excruciating withdrawal.
      - You can either initiate people willingly or forcibly. Either way, you must perform a ritual (1 Move, Routine) that involves (1) one of the following: alcohol or another recreational drug / music / beautiful, scantily dressed women / lavish food, and (2) your cult's secret chant. To perform it forcibly, they must be immobilized. Characters with the {tag:pious} tag cannot be converted.
  - name: Bacchus
    key: bacchuslore
    public: false
    secret: true
    tags:
      - Cultist
    description: |-
      You have no idea what you have gotten into, do you? Ah…

      As a Cultist of Bacchus, you have implicitly gone against ancient wisdom—which declares that Pleasure is Painful—to declare that Pleasure is Pleasurable. Bacchus, Parent of Parents, is the Lustful God, Creator of Illusions, the Eternal One. Bacchus is honest. Bacchus is life. Bacchus is pleasure. Bacchus is a zealot of hedonism. They rejoice over the fulfillment of desires and the euphoric suicide of their followers. Bacchus is often depicted as a stemless apple, two deers enjoined in a circle, or, in some sects, as a gigantic dead sea creature.

      Bacchus doesn't have a specific demand on his followers except that they focus on nothing more than indulging their own particular desires—in other words, being happy and free. Because of their individualistic streak, Bacchus Cultists don't have a unified doctrine and tend to operate in scattered chapters with their own rules and systems. Some cults are violent, forceful, and warlike, while some eke out an existence on the edge of society.

      In exchange for their service, Bacchus rewards his followers with exquisite sensual pleasure and magical powers. Those who truly dedicate themselves to his cause, however, earn something else: Eternal Bliss. How nervewracking, how tantalizing!

      **Chant**

      | English | Demonic |
      | --- | --- |
      | We are free, so free — | Wy vory oryy, wa oryy — |
      | Behold as I reach new heights | bymadv iw xe ryitm lys rechem |
      | My progenitor, I am everlasting | mh eraqyluzar, xe vechem |
  - name: The Charon
    key: charon
    public: false
    tags: []
    description: |-
      The Charon is a spaceship. It'll take its passengers out into space, where an enormous passenger liner is allegedly waiting for refugees. The Charon's hatch can be accessed through the catacombs.
  - name: Meals & Kitchens
    key: meals
    public: true
    tags:
      - Cooking (Basic)
      - Cooking (Skilled)
      - Nobility
    description: |-
      Fine meals make average people happy, but Nobility have them as a baseline. They need to eat them every once in a while or they'll be unhappy. Lavish meals make everyone happy and are valid objects of a Desire.

      **Fine meals:** cost 2 ⬢ per meal. You can make up to 4 Fine meals in one Routine move.
      **Lavish meals:** cost 3 ⬢ per meal and one hard to get exotic ingredient. You can make up to 3 Lavish meals in one Routine move.
  - name: Alcohol & Drugs
    key: alcoholdrugs
    public: true
    tags:
      - Brewing (Basic)
      - Brewing (Skilled)
      - Alcoholic
    description: |-
      Nobody down here is sober because they chose to be. Drink and Bliss are how Ravenheart gets through the dark, and the trade in both is one of the few honest ways a poor man makes his money. Past that sits the apothecary — tonics that mend, blind, strengthen and kill.

      Brewing is a Routine Move like cooking: say what you're making, and if you have the skill and the ingredients, you've made it. Two things are Gambits, and both say so below.

      **Brewing (Basic)** covers {tag:alcohol}, {tag:bliss} and the basic tonics.
      **Brewing (Skilled)** covers all of that, plus {tag:ravenheart-red} and the advanced tonics.

      ## Tonics need something you have to go and get

      This is the part worth reading twice. **Nearly every tonic costs Resources *and* an ingredient**, and the ingredient is the real price. Miasma has to be bottled beside a rotting corpse. Graga Sweat needs a sac cut out of a dead Graga in the caves. White Honey wants the heart of a rainbow trout, and somebody has to have caught one.

      None of that is counted by the app. There is no ingredient slot on your sheet and no button that checks. It is handled in the fiction, by describing how you got the thing, and by a GM deciding whether you plausibly did. Write the trip into your Move. "I brew Graga Sweat" is not a Move; going down to the Caverns for the sac is.

      That is also why the ⬢ prices are low — mostly 2 to 4. A tonic is cheap in coin and expensive in trouble.

      ## The base of it all

      {tag:cave-fungus} grows wherever the lamps don't reach and costs nothing but the walk. Eat it raw and you'll be {tag:high} for two turns with no pleasure in it at all. Refined, it becomes something else entirely — {tag:bliss}, and {tag:mercy} after that.

      ## Drink

      **{tag:alcohol}** — 2 ⬢, Basic. Beer, ale, and other fine drinks. Up to **3 in one Routine Move**. It won't fill anyone's stomach, but it lifts anyone's mood — a noble's as readily as a peasant's, which is more than a Fine Meal manages. Leaves you {tag:tipsy} and {tag:happy}.

      **{tag:ravenheart-red}** — 4 ⬢, Skilled. The one genuinely exquisite thing this barony makes, and a fair object of a Desire.

      **{tag:bliss}** — free but for the fungus, Basic. The best thing at any party in Ravenheart, and no morning after.

      Nothing here hands you a {tag:hungover} automatically. But if you spend the evening the way the evening deserves, expect a GM to write you the invoice.

      ## Basic tonics

      **{tag:miasma}** — 2 ⬢. Bottled beside a corpse. Opened in a closed room, everyone breathing gets {tag:vomiting}.
      **{tag:feces}** — 2 ⬢. Worked onto a blade so a wound goes {tag:infected} instead of healing. Nobody has ever been respected for it.
      **{tag:cleaning-powder}** — 2 ⬢, 1 turn makes **three**. Cures a minor infection outright, and gives a doctor a real chance against {tag:festering}.
      **{tag:cat}** — 3 ⬢. Distilled with alcohol. {tag:night-vision} for two turns.
      **{tag:poppy}** — 2 ⬢. The answer to pain and the start of a different problem. A farmer must spend a turn growing the crop first. Leaves an {tag:opium-high}.
      **{tag:molotov-cocktail}** — 2 ⬢. A bottle and a rag. It does not care what you were aiming at.

      ## Advanced tonics

      **{tag:gunpowder-grenade}** — 6 ⬢. A bomb, priced like one. Needs ore or nitrite out of the caverns.
      **{tag:nightshade}** — 3 ⬢. Forest-picked and cheap. Inflicts {tag:choking}: the victim dies frothing where everyone can watch.
      **{tag:phrygian-tears}** — 4 ⬢, **2 turns and a Gambit**. Silent and invisible. Inflicts {tag:phrygian-toxin}, which shows nothing until it is far too late.
      **{tag:advanced-poppy}** — 4 ⬢. Needs Poppy first. {tag:pain-immunity} with your head still your own.
      **{tag:graga-sweat}** — 4 ⬢. From a {tag:graga-sac}. {tag:brutish-strength}.
      **{tag:purifier}** — 4 ⬢. Clears {tag:infected}, {tag:festering} and {tag:feverish} without a doctor, and gives {tag:sepsis} a chance it didn't have.
      **{tag:white-honey}** — 4 ⬢. Dispels a poisoning. Heart of a rainbow trout.
      **{tag:deadeye-drops}** — 4 ⬢. {tag:increased-accuracy}. Fermented from horse dung; worth the indignity.
      **{tag:mercy}** — 4 ⬢. From cave fungus. {tag:increased-recovery}.
      **{tag:distilled-coca}** — 4 ⬢. Wild in the forest. {tag:stimulant-high}.
      **{tag:mindbreaker-toxin}** — 4 ⬢. Forest mushrooms. Leaves the taker {tag:hallucinating}.
      **{tag:invisibility-potion}** — 4 ⬢. From a {tag:graga-sac}. Two turns {tag:invisible}.
      **{tag:nekker-pheromones}** — 4 ⬢. From a dead nekker. They leave you alone while it lasts.
      **{tag:succubus-draught}** — 4 ⬢. Needs the blood of a willing lover, freely given. Grants {tag:mindreading}.
      **{tag:raven-draught}** — 4 ⬢. The eye of a raven. Send one message to any player anywhere — DM the GMs.
      **{tag:pure-luck}** — 4 ⬢. The heart of an Aberrant. Three turns where every Gambit is a six.

      ## A note on medicine

      {tag:purifier}, {tag:cleaning-powder} and {tag:white-honey} do a doctor's work without a doctor, and they are cheaper than the cure ladder in the Medical document. That is deliberate — but somebody still had to go and get the ingredient, and no amount of ⬢ substitutes for that.

      ## Drinking too much of it

      None of this is tracked. Nobody counts your bottles. But a character who drinks like that is a character who drinks like that, and a GM may decide {tag:alcoholic} has stopped being a description and started being a fact.
  # GM-only. The `gamemaster` flag is not a property of any Character — the
  # documents page resolves it against the Discord GM role at request time,
  # the same check that gates /gm. Filtered server-side, so a player's browser
  # never receives this text at all.
  - name: Caving Monsters
    key: cavingmonsters
    public: false
    tags: []
    flags:
      - gamemaster
    description: |-
      What lives down there, and what it drops. Adjudicate encounters from this — the players have no document that lists any of it.

      ## Gragas

      Dangerous, strong, hulking cave dwellers. Extremely slow, in part due to their overburdened leg muscles, which barely support them.

      Found on **all three cave levels**. Genuinely dangerous in a fight, but easily escaped — a party that decides to leave should almost always be allowed to.

      Killing one drops a {tag:graga-sac}, which is the ingredient behind {tag:graga-sweat} and the {tag:invisibility-potion}, and the Company's merchant will buy them. This is the main reason a player has to go down at all.

      ## Skinless

      Explorers and citizens of the caves, flayed into immortality. They travel alone or in packs, eventually returning to their communities in the **Aberrant Pits**.

      They were people, and some of them still remember being people. A Skinless is not automatically a fight.

      ## Nekkers

      Small, quick, and they hunt in numbers. Referenced by {tag:nekker-pheromones}, which is wrung out of a dead one and makes the rest of them ignore whoever wears it.

  # The Demoness threat's own brief (docs/threats.md). Assigned by the
  # Demoness tag, which is also what unlocks the hidden Demoness tag
  # category — so the paper and the powers arrive together.
  - name: Demoness
    key: demoness
    public: false
    secret: true
    tags:
      - Demoness
    description: |-
      You are a being from the Caves. You have been alive for a long time, but your memory is fuzzy.

      You don't need to eat. Instead, you live for the thrill of enslaving souls, manipulating people, and causing pain. You will become {tag:unhappy} if you don't.

      You can Break souls — see {tag:demoness}. If you have {tag:slavemaster}, they become {tag:broken-enslaved} instead of merely {tag:broken}.

      **Desire examples:**
      - Enslaving the soul of the Heir — the highest high, truly sublime (+5).
      - Causing people to fall in love with you for good (+4).
      - Fulfilling people's Worst Fears, or capturing and torturing them (+3).
      - Humiliating someone (+2).
      - Encouraging someone to let loose (+1).

      You find normal crosses tacky and boring. Fire scares you somewhat — it definitely hurts. The Silver Cross, on the other hand, terrifies you. If you touch it, your powers are disabled for the rest of the day.

      There may be people in the area who want to use your power. They'll take your treasured independence — the demented, servile idiots.

