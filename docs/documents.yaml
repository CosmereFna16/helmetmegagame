  - name: Meals & Kitchens
    key: meals
    public: true
    tags:
      - Cooking (Basic)
      - Cooking (Skilled)
      - Nobility
    description: |-
      Fine meals make average people happy, but Nobility have them as a baseline. They need to eat them every once in a while or they'll be unhappy. Lavish meals make everyone happy and are valid objects of a Desire.

      Fine meals: cost 2 ⬢ per meal. You can make up to 4 Fine meals in one Routine move.
      Lavish meals: cost 3 ⬢ per meal and one hard to get exotic ingredient. You can make up to 3 Lavish meals in one Routine move.
  - name: Alcohol & Drugs
    key: alcoholdrugs
    public: true
    tags:
      - Brewing (Basic)
      - Brewing (Skilled)
      - Alcoholic
    description: |-
      Alcohol & Drugs

      The Inn's Brewer keeps two shelves in the cellar: one for drink, one
      for things that aren't. Both are made the same way — water, patience,
      and whatever's growing down there — and both are worth good coin.

      BASIC ALCOHOL (Brewing (Basic))
      Fast to brew, faster to drink.
      - Barleyback — an honest ale. Whatever's on tap at the Inn tonight.
      - Widow's Mead — honeyed and strong. Ask around about the name.
      - Muckwater Stout — thick, dark, tastes like the wasteland smells. Miners swear by it.
      - Farmhand's Cider — cheap, sharp, gets the job done.

      ADVANCED ALCOHOL (Brewing (Skilled))
      Slower, finer, worth serving at the Baron's own table.
      - Ravenheart Red — the barony's pride, aged in oak salvaged from the old keep's cellar.
      - Goldenrod Mead Royale — spiced and gilded, reserved for court.
      - Wassail of the Iron Cross — mulled wine, spiked with something the Order won't name.

      BASIC TONICS (Brewing (Basic))
      Recreational, easy to come by — a Pusher's bread and butter.
      - Ravenroot Chew — a bitter root, chewed for a light head-buzz.
      - Sootleaf Pipeweed — mellow smoke, makes a long watch on the wall bearable.
      - Widow's Kiss Drops — a few drops under the tongue. A warm little lie that everything's fine.

      ADVANCED TONICS (Brewing (Skilled))
      The ingredients are foraged, not farmed — expect the Caves, not the cellar.
      - Glowroot Tincture — distilled from a fungus that only grows near the old tech ruins. Makes colors sing.
      - Weeper's Salve — eases pain fast. Worth its weight for anyone doing real fighting.
      - Cultist's Communion — the Cult of Bacchus's own sacrament, used in their initiation rites. Not sold; you're given it.

      DRINKING (mechanics)
      "Take Alcohol" on your character sheet, next to "Ate Meal" — costs 3 ⬢
      (a Brewing Effort nets you 3 back, same rate).
      - Grants the Tipsy tag for 4 turns: for the first 2 you're actually
        Happy; for the 2 after that you're merely immune to Unhappy — Tipsy
        is still shielding you, just quietly.
      - Slightly worse at combat while Tipsy, unless you have the Alcoholic
        tag — built up from a lifetime of practice, not something you buy.
      - Doesn't touch hunger. Drink all you like, you'll still need to eat.
  # The Demoness threat's own brief (docs/threats.md). Assigned by the
  # Demoness tag, which is also what unlocks the hidden Demoness tag
  # category — so the paper and the powers arrive together.
  - name: Demoness
    key: demoness
    public: false
    tags:
      - Demoness
    description: |-
      You are a being from the Caves. You have been alive for a long time, but your memory is fuzzy.

      You don't need to eat. Instead, you live for the thrill of enslaving souls, manipulating people, and causing pain. You will become {tag:unhappy} if you don't.

      You can Break souls — see {tag:demoness}. If you have {tag:slavemaster}, they become {tag:broken-enslaved} instead of merely {tag:broken}.

      Desire examples:
      - Enslaving the soul of the Heir — the highest high, truly sublime (+5).
      - Causing people to fall in love with you for good (+4).
      - Fulfilling people's Worst Fears, or capturing and torturing them (+3).
      - Humiliating someone (+2).
      - Encouraging someone to let loose (+1).

      You find normal crosses tacky and boring. Fire scares you somewhat — it definitely hurts. The Silver Cross, on the other hand, terrifies you. If you touch it, your powers are disabled for the rest of the day.

      There may be people in the area who want to use your power. They'll take your treasured independence — the demented, servile idiots.

