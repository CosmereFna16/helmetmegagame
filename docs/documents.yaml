  - name: Post-Christianity
    key: postchristianity
    public: false
    tags: []
    description: |-
      Nobody remembers exactly which schism did it, or which century. Only that somewhere between the old world ending and Ravenheart being built on its bones, the Church kept the parts that mattered and let the rest wash away with everything else. What's left is simpler: God is still watching, still kind, and still asks the same three things He always did—feed the hungry, forgive the guilty, and don't let the dark win.

      The scripture reads a little differently now, half-remembered verses stitched next to warnings about the wasteland and the things that live in it, but the shape of the faith hasn't changed. It's not fire and brimstone. It's people who've lost almost everything, believing anyway, and trying to be good to each other because the alternative is so much worse.
  - name: Messenger Ravens
