explanation:
  tag: Anyone with this tag gets this Document.
  public: If assigned, this will appear in a player's document folder. However, using the search function, anyone can browse and find this document.
# Documents are a map keyed by their document key (`courtier:`, not
# `- key: courtier`) — see docs/tags.yaml's header, and db/lib/yamlEntries.js.
documents:
  courtier:
    name: Courtier
    public: false
    tags: []
    description: As a member of the Baron’s retinue, you may take food from a fellow member whenever you please — within reason (Treasurer and Leader roles can see everyone's Resources, so don’t steal. If you’d like to steal, arrange it with a GM). ‡
  church:
    name: Church
    public: false
    tags: []
    description: As a member of the Church, you may take food from a fellow member whenever you please — within reason (Treasurer and Leader roles can see everyone's Resources, so don’t steal. If you’d like to steal, arrange it with a GM). ‡
  independent:
    name: Independent
    public: false
    tags: []
    description: As an independent townsman, you aren't on anyone's payroll. The Headman isn't expected to pay you. You should therefore ply a trade so you don't starve to death.
  ravenhearteconomy:
    name: Ravenheart's Economy
    public: true
    tags: []
    description: |-
      You're welcome to change things, but this is how things have been done for years:

      The town farms, fishes, and hunts. Most of that is taxed by the Headman, who sends a fraction of his tithe to the Bishop and the bulk to the Baron (through the Meister, his tax-man). What little he has left is paid to those on the town's payroll, mostly the Sheriff.

      So, the Fortress survives off of the town's taxes, and provides protection in turn.
      The Church survives off of the town's taxes, and provides religious services in turn.
  diplomat:
    name: Diplomat
    public: false
    secret: true
    tags: []
    description: |-
      You are from the Culture, a post-scarcity interstellar empire of hedonists ruled by benevolent AI. You want the best for the people of Ravenheart — and that would mean convincing the Baron to join the Culture — but Contact (the Culture's diplomatic wing) operates in the scale of centuries, not human generations. They don't think it's the right time, although they haven't told you why. In general, Contact is very non-interventionist. Therefore, do the best you can to quietly help people and further the Culture's mission: help push for a leader likely to cooperate, ensure the Order of the Silver Cross doesn't grow out of control, and above all, do not blow your cover! The *last* thing the Culture wants is for the people of Ravenheart to know you're here…

      They would appreciate it if you collected any interesting gear, took some photos with your drone, and sent logs to the mothership. The caves supposedly have a lot of interesting things going on, but it's probably dangerous.

      Also, you probably had a good reason to come here (boredom?) and your friends thought you were cr*aaa*zy! Coming here? Where you could die?! Back home, almost no one dies, ever. Everything is just very safe.

      You have one (!) gadget — an autonomous, sentient flying drone with a supercomputer for a brain. It's disguised as a bird and has a strong personality. It likes to fly and look around the forest. It's harmless.

      If anything goes wrong, the General Contact Vessel *Helpless Is The Face Of Your Beauty* will teleport you on board. It'll take your message three minutes to reach them.
  treasurer:
    name: Treasurer
    public: true
    tags:
      - Treasurer
      - Leader
    description: |-
      As Treasurer or Leader, you can see each faction member's Resources.

      **Transferring Resources**

      You can transfer Resources from any source to any recipient, but you have to be able to reach both ends — stand in the same Zone as them. ‡
  medical:
    name: Medical
    public: true
    tags:
      - Medical (Basic)
      - Medical (Skilled)
      - Medical (Expert)
    description: |-
      Health and injuries are tags. The price to treat them is measured in
      Resources, your turns, and a skill.

      **What you can do in a day.** Treating a case within your skill is
      routine. You get 2 of them a turn with {tag:medical-basic}, 3 with
      {tag:medical-skilled}, 4 with {tag:medical-expert}. First aid — anything
      the table below lists at 0 turns — costs you nothing at all and never
      counts against that, so bandage as many people as you like.

      **Reaching past your skill.** You can attempt any cure, including ones
      well above your training. That's a Gambit: it spends your Move for the
      turn, a die is rolled, and you'll both find out at the end of it. A bad
      roll can leave the patient worse than you found them. The top of the
      table is a Gambit even for an Esculap.

      **Surgery needs instruments.** Hold {tag:surgical-equipment}, or stand
      somewhere a set is already laid out — the Sanctuary's operating theatre
      has one. Either way it's +1 on every medical Gambit you roll. ‡

      {tag:medical-basic} · {tag:medical-skilled} · {tag:medical-expert}

      | Tier | ⬢ | Turns | Skill |
      |---|---|---|---|
      | Free | 0 | 0 | Medical (Basic) |
      | Very minor — first aid | 1 | 0 | Medical (Basic) |
      | Minor | 2 | 0 | Medical (Basic) |
      | Moderately severe | 2 | 1 | Medical (Skilled) |
      | Severe | 4 | 1 | Medical (Skilled) |
      | Very minor surgery | 6 | 1 | Medical (Skilled) |
      | Severe surgery | 8 | 1 | Medical (Expert) |
      | Complex surgery | 8 | 1 | Medical (Expert) + Gambit |

      **Free — 0 ⬢, no turn**

      - {tag:minor-bleeding}, {tag:dislocated-shoulder}

      **Very minor — 1 ⬢, no turn**

      - {tag:bruised}, {tag:severe-pain}

      **Minor — 2 ⬢, no turn**

      - {tag:minor-wound}, {tag:burned}, {tag:sprained-ankle}, {tag:infected},
        {tag:frostbite}

      **Moderately severe — 2 ⬢, 1 turn**

      - {tag:deep-wound}, {tag:broken-bone}, {tag:cracked-ribs},
        {tag:poisoned}, {tag:heatstroke}, {tag:pain-shock}, {tag:choking},
        {tag:blunt-force-trauma}

      **Severe — 3–4 ⬢, 1 turn**

      - {tag:severe-bleeding}, {tag:arterial-bleed}, {tag:parasites},
        {tag:severe-burns}, {tag:broken-jaw}, {tag:mangled-hand},
        {tag:festering}, {tag:rot-lung}, {tag:pox}

      **Very minor surgery — 6 ⬢, 1 turn**

      - {tag:grievous-wound}, {tag:feverish}, {tag:necrosis}

      **Severe surgery — 8 ⬢, 1 turn**

      - {tag:punctured-lung}, {tag:gut-wound}, {tag:appendicitis},
        {tag:envenomated}, {tag:disfigured}

      **Complex surgery — 8 ⬢, 1 turn, Gambit**

      - {tag:sepsis}, {tag:dying}, {tag:consumptive}, {tag:blind},
        {tag:crippled-leg}, {tag:phrygian-toxin}

      Tonics (see {document:alcoholdrugs}) cure some tags outright.
  sanctuary:
    name: Sanctuary
    public: true
    description: |-
      The Sanctuary is perhaps the only part of Ravenheart that hasn't succumbed to feudalism. It's stocked with advanced (roughly modern-day) medical equipment, an absolute treasure of ancient times. There is a set of {tag:surgical-equipment} laid out in the operating theatre, and anyone working in that room has the use of it — though it is a real object, and a determined thief could carry it off. ‡

      The Sanctuary operates independently from the Baron. Although he could try to gain control over it, it would be unprecedented and pretty pointless. So the Esculap does whatever he wants within his walls.

      Traditionally, in part due to the cost of medical procedures, the Esculap only treats people that can pay or people of noble blood. So try not to get hurt — you should only expect to get medical treatment if you can pay for it, unless the Esculap is feeling generous.
  teachingskills:
    name: Teaching Skills
    public: true
    tags: []
    description: "Skills can be taught. Find someone standing where you are who holds the skill and the {tag:teaching} tag, and press Learn Skill on your sheet — or they press Teach Skill. Teaching is the teacher's Routine for the turn; learning is your Gambit. Roll a 5 or a 6 and the skill is yours when the turn ends. Someone with {tag:teaching-lecturing} can take up to three students at once. A {tag:teaching-drill-instructor}'s students succeed on a 4 when the skill is a fighting skill. ‡"
  production:
    name: Producing Resources
    public: true
    tags:
      - Laboring (Basic)
      - Laboring (Skilled)
      - Laboring (Hunting)
      - Laboring (Farming)
      - Laboring (Fishing)
    description: |-
      Labor is how Resources are produced, and you need a skill to do it at all. Without one of the tags below, a day of work produces nothing. ‡

      Pick **Labor** as the kind of your Move — it isn't adjudicated and it doesn't roll, it simply pays. Choosing it means choosing not to do anything else that turn. Submit no Move at all and you'll Labor automatically. ‡

      | Skill | Per turn | Where |
      |---|---|---|
      | {tag:laboring-basic} | {resource:labor:basic} | Anywhere |
      | {tag:laboring-skilled} | {resource:labor:skilled} | Anywhere |
      | {tag:laboring-hunting} | {resource:labor:hunting} | Wilderness, scaled by the place |
      | {tag:laboring-farming} | {resource:labor:farming} | Fields and worked ground, scaled by the place |
      | {tag:laboring-fishing} | {resource:labor:fishing} | Water, scaled by the place |

      The bottom three need {tag:laboring-skilled} behind them and are side-grades rather than upgrades. Hold as many as you like — laboring always pays the best result you're entitled to where you stand, so there is nothing to switch and nothing to forget. ‡

      Those three numbers are what an ordinary spot pays. Real ground is better or worse, and what a place is worth **changes over the course of the game**. Press **Labor?** in any location's channel to see what it yields right now. Hunting swings hardest; farmland is steady until it isn't. ‡

      Tools raise a yield while you carry them — bows and guns for hunting, a Hatchet or a Plow for farming, a Rod for fishing. Each says so in its own description. ‡

      If the Lifeweb fails, laboring very nearly stops. ‡
  combat:
    name: Combat
    public: true
    tags: []
    description: |-
      The theory and nitty-gritty of combat — like, the realistic physics — is as important as the skill. Even a master fencer won't be able to do much against a random guy in plate armor, and just a few horse archers can take out a whole squad of footpads. Different weapons excel in different circumstances, like: how much space you have, whether you’re alone or in formation, and whether your opponent is armored.

      **Melee**
      - Polearms are ubiquitous. Their reach means you can keep the opponent away and decide when the battle starts. They come in stabby, crushy, and pokey varieties.
      - Blunt weapons are useful even against armored targets, but won’t help find weak spots.
      - Precision weapons, like swords held by the blade (halfswording) or daggers, are useful against armored opponents if you can wrestle them down to the ground.
      - Hidden weapons are useful in social environments.
      - Cutting and stabbing weapons really hurt unarmored people.
      - Axes can break shields or drag them out of position.

      **Ranged**
      - Bows and slingshots are quiet and really hurt unarmored targets. Very big bows can crack or penetrate armor.
      - Crossbows take time to reload but are better against armored opponents.
      - Firearms beat everything.

      Shields are very useful. For armor, there’s a few important traits: material, concealability, weight, and donning time. Some items can be worn under regular clothes. Certain items, like plate, will make a long trek through the forest difficult — you’ll get very hot under all that metal — but make you a veritable tank in combat. Seriously, almost nothing can get through plate. However, it also has the downside of being hard to equip, so if you’re, say, at a feast and someone pulls out a dagger, you’d better have a padded jack or brigandine underneath.

      **Energy Shields**
      - Stop projectiles.
      - Reduce, but don't stop, melee damage.
      - Do nothing against needles or syringes.
      - Worn on the belt or the wrist.
  townstarting:
    name: Town Starting Packet
    public: false
    tags: []
    description: |-
      The Headman received a raven saying he didn't receive the last tax wagon. It was probably ambushed by bandits. The Meister won't be happy about this… prepare to be squeezed for it. ‡

      Last week, Thomas Ciobanu — a respectable tradesman — was found milky-eyed, giggly, with a profoundly satisfied look. He wandered around aimlessly, going hungry — when people tried to help him, he just called them fools. The Esculap's medicine couldn't do anything for him, so the Inquisitor had him hanged. He fought all the way to the gallows, like a rabid dog.
  fortressstarting:
    name: Fortress Starting Packet
    public: false
    tags: []
    description: |-
      The last tithe didn't arrive.
  lifewebbasic:
    name: The Lifeweb
    public: true
    tags: []
    description: |-
      The Lifeweb is a profoundly unintelligible piece of machinery within the Fortress's walls — a tower that, at its peak, spews the Life Fire. Although it also produces electricity, it is mainly prized for the Fire, which is said to be what keeps Ravenheart arable, breathable, and livable. One only needs to follow the river a few miles southeast before seeing, far in the distance, the wind-scorched lands of the rest of the world, humid, scarred, and inhospitable.

      The Lifeweb is tended by the Mortii. The Mortii are rejects, outcasts, exiles, hunchbacks, and convicts.

      The tower has a door leading downwards.
  lifeweb:
    name: Lifeweb (Mortus)
    public: false
    secret: true
    tags: []
    description: |-
      The Lifeweb is a profoundly unintelligible piece of machinery within the Fortress's walls — a tower that, at its peak, spews the Life Fire. Although it also produces electricity, it is mainly prized for the Fire, which is said to be what keeps Ravenheart arable, breathable, and livable. One only needs to follow the river a few miles southeast before seeing, far in the distance, the wind-scorched lands of the rest of the world, humid, scarred, and inhospitable.

      The tower has a door leading downwards. Inside, levers control what parts of Ravenheart receive power. It also has a door which can be opened to reveal pistons, firing madly, witchfire green. There's a chair on a platform with complex implements. You can hook someone in, strap them down, align the machinery, cue the machine to speculate the vitrii, select the injection point, and decide whether you want some blood drawn — granting {tag:drained} and feeding the Lifeweb 20 points — or all the person's blood, feeding the Lifeweb 100 points but killing the donor.
  respawning:
    name: Respawning
    public: true
    tags:
      - Chaplain
      - Mortus
      - Dead
    description: |-
      When you die, you can rejoin at any time — but you'll be Cursed, meaning you can only start as a Bum or Migrant and you'll suffer a -6 penalty to your starting points.

      To rejoin as any other role, wait until your body is buried or your name is engraved. It is the Church and Mortii's jobs to do so.

      A ghost has no voice. Your body speaks for you — while it lies unburied it stinks, and the place it is lying in keeps saying so. ‡
  courtstructure:
    name: Court Structure
    public: false
    tags: []
    description: |-
      The Baron's rule is absolute. He has a small council including the Hand, the Meister, the Captain, and any other courtier he might assign.

      The Hand's the voice, the organizer, the executor, the Hand. He outranks everyone except the Baron.
      The Meister collects taxes and provides medical attention.
      The Captain commands the Watch. ‡

      The rest of the court, the Baron's family included, live their lives.
  watchman:
    name: The Watch
    public: false
    tags: []
    description: |-
      The Watch is Ravenheart's single line of defense along with its few Knights and Sheriffs. It's led by the Captain.

      Every member of the Watch has a {tag:disabler} (takes several shots; useful against unarmed people, but not someone who can run up to you and take it out of your hands), but otherwise relies on their armory — which has a good supply of Simple weapons and a decent supply of Moderate weapons (see {document:smithing}). The Fortress's yard also has an automated turret, which can't tell the difference between hostiles and friendlies. The switch to enable it is in the Captain's office.

      Watchmen also carry a {tag:radio-bracelet-watch}, which connects to the Captain's {tag:radio-system-watch}.

      **Your camp has an armory. While in camp, you may freely equip yourself with any weapon or armor from the Simple or Dead Simple tier (use the add tag menu; see {document:smithing} for options).**
  postchristianity:
    name: Post-Christianity
    public: true
    tags: []
    description: |-
      In the darkness, there are sacred things. And what is most sacred? That which remembers. What is darkness but ignorance?

      Can you blame them, the writhing monsters, suckling beneath the surface? They are less than animal. They have proven that that essence of purity which God imbued us with is not immutable; to the contrary, people have lost it, spat on it, cursed it.

      … And some people mock it, but what do they know of the stability, the openness of an ennobled mind, the very peace they seek through their perversions? It is good — it is the ultimate good — to love oneself, and through oneself, God.

      It is regrettable, but not reproachable, that God smote the Earth. At the very least, those of us who remained faithful were given this sliver of Paradise.

      The problem with the Heretic is just that: they crawl out from their holes, seeking to turn us against the Truth. But they cannot. Even if they were to murder and devour all of us, we would not forget God — as long as we chose not to. Nothing can take away faith, charity, and virtue, except our own malfeasance.

      In any case, the Afterlife is around the corner, as it always was and it always will be. Only by forgetting that could we prioritize the gratification of the moment.
  smithing:
    name: Smithing and Crafting
    public: true
    tags:
      - Crafting
      - Smithing
      - Smithing (Skilled)
      - Smithing (Gunpowder)
    description: |-
      Like brewing or cooking, smithing costs Resources, turns, and is gated by skills.

      {tag:crafting} — tailoring, woodwork and Dead Simple metalwork.
      {tag:smithing} — Simple metalwork.
      {tag:smithing-skilled} — everything from Moderate upward. Requires Smithing.
      {tag:smithing-gunpowder} — firearms and bombs. Requires Smithing (Skilled).

      | Tier | ⬢ | Turns | Skill |
      |---|---|---|---|
      | Dead Simple | 3 | 0 | Crafting or Smithing |
      | Simple | 6 | 1 | Smithing |
      | Moderate | 14 | 1 | Smithing (Skilled) |
      | High Quality | 26 | 2 | Smithing (Skilled) |
      | Exceptional | 34 | 3 | Smithing (Skilled) |
      | Gunpowder | 31 | 2 | Smithing (Gunpowder) |

      **Dead Simple — 3 ⬢, no turn**

      - Weapons: {tag:work-knife}, {tag:hatchet}, {tag:pitchfork}, {tag:sling},
        {tag:quarterstaff}, {tag:shortbow}
      - Armor: {tag:buckler}, {tag:padded-armor}, {tag:padded-cap}
      - Padded Armor and Padded Cap need Crafting. Everything else here takes
        either skill.

      **Simple — 6 ⬢, 1 turn**

      - Weapons: {tag:spear}, {tag:dagger}, {tag:silver-knife}, {tag:gladius},
        {tag:phrygian-spear}, {tag:mace}, {tag:battle-axe}
      - Armor: {tag:simple-helm}, {tag:mail-coif}
      - Mail Coif needs Smithing. Crafting instead of Smithing: {tag:longbow},
        {tag:shield}, {tag:pavise}

      **Moderate — 14 ⬢, 1 turn**

      - Weapons: {tag:halberd}, {tag:broadsword}, {tag:war-hammer}, {tag:knuckle-duster}
      - Armor: {tag:mail-shirt}

      **High Quality — 26 ⬢, 2 turns**

      - Weapons: {tag:bastard-sword}, {tag:rapier}, {tag:sabre}, {tag:katana},
        {tag:silver-spear}, {tag:lucerne}, {tag:zweihander}, {tag:crossbow}
      - Armor: {tag:knights-helmet}, {tag:breastplate}, {tag:brigandine} (hidden under clothes)

      **Exceptional — 34 ⬢, 3 turns**

      - Armor: {tag:plate-armor}.

      **Gunpowder — 31 ⬢, 2 turns**

      - Weapons: {tag:musketoon}, {tag:bore-pistol}
      - {tag:bomb}

  caving:
    name: Caving
    public: true
    tags: []
    description: |-
      Ravenheart's caves are the graveyards of ancient civilizations. They're as dangerous as they are rewarding. There's three levels to the caves: the Caverns, the Railroad, and the Aberrant Pits. Moving from one level to the next takes a turn, so plan carefully before committing. Caving rewards preparation, so consider bringing a good weapon, some food, a doctor, and maybe some medicine or alcohol.

      At the start of every turn, you'll automatically roll an Exploration die (1d6, shared with your Gambit modifiers). Bad things happen on a roll of 1, while a roll of 6 rewards you with loot, tonic ingredients, or information. This doesn't use up your turn.

      You can use Moves as normal in the caves. There's a few suggested actions: scavenging for loot, obtaining valuable metals, hunting monsters for their tonic ingredients, and foraging for the useful {tag:cave-fungus}.

      The caves' truly special rewards are available through events. Check each location regularly.

  # The Merchant Update filled this in — it was an empty stub for as long as
  # the seat was unfinished. Reached by doc_element from both The Company
  # roles, so the Dockers read it too: they are the ones hauling the goods.
  # The canonical numbers are docs/systemdocs/DEPOT.md §3-4; this is the
  # player-facing half and only carries the bands, never the full table.

  charon:
    name: The Charon
    public: false
    secret: true
    tags: []
    description: |-
      The Charon is a spaceship. It'll take its passengers out into space, where an enormous passenger liner is allegedly waiting for refugees. The Charon's hatch can be accessed through the Undercroft.
  meals:
    name: Meals & Kitchens
    public: true
    tags:
      - Cooking (Basic)
      - Cooking (Skilled)
      - Nobility
    description: |-
      Fine meals make average people happy, but Nobility have them as a baseline. They need to eat them every once in a while or they'll be unhappy. Lavish meals make everyone happy and are valid objects of a Desire.

      **Fine meals:** cost 2 ⬢ per meal. You can make up to 4 Fine meals in one Routine Move.
      **Lavish meals:** cost 3 ⬢ per meal and one hard-to-get exotic ingredient. You can make up to 3 Lavish meals in one Routine Move.
  alcoholdrugs:
    name: Alcohol & Drugs
    public: true
    tags:
      - Brewing (Basic)
      - Brewing (Skilled)
      - Alcoholic
    description: |-
      Like cooking or smithing, brewing costs Resources, turns, and is gated
      by a skill. Many brews also need special ingredients.

      {tag:brewing-basic} — alcohol and the simple tonics.
      {tag:brewing-skilled} — wine and everything that needs a hard-to-find
      ingredient. Requires Brewing (Basic).

      Some ingredients are tracked tags, like {tag:cave-fungus} and
      {tag:graga-sac}, but some are just flavor and should be acquired appropriately.

      **Brewing (Basic)**

      | Brew | ⬢ | Turns | Needs |
      |---|---|---|---|
      | {tag:bliss} | 0 | — (yields up to 2 per turn) {info:Multiply the amount of resources by the units you choose to make.} | cave fungus |
      | {tag:feces} | 0 | — | feces |
      | {tag:alcohol} | 2 | 1 (yields up to 3 per turn) {info:Multiply the amount of resources by the units you choose to make.} | — |
      | {tag:miasma} | 2 | 1 | a corpse {info:You must be holding one. It is not used up.} |
      | {tag:poppy} | 2 | 1 (yields up to 2 per turn) {info:Multiply the amount of resources by the units you choose to make.} | — |
      | {tag:molotov-cocktail} | 2 | — (yields up to 2 per turn) {info:Multiply the amount of resources by the units you choose to make.} | alcohol |
      | {tag:cleaning-powder} | 2 | 1 (yields up to 2 per turn) {info:Multiply the amount of resources by the units you choose to make.} | — |
      | {tag:cat} | 3 | 1 | alcohol |
      | {tag:nightshade} | 3 | 1 | a forest herb |

      **Brewing (Skilled)**

      | Brew | ⬢ | Turns | Needs |
      |---|---|---|---|
      | {tag:pure-luck} | 0 | 1 | an Aberrant's heart |
      | {tag:graga-sweat} | 2 | 1 | a graga sac |
      | {tag:white-honey} | 2 | 1 | a rainbow trout's heart |
      | {tag:deadeye-drops} | 2 | 1 | cave fungus |
      | {tag:mercy} | 2 | 1 (yields up to 2 per turn) {info:Multiply the amount of resources by the units you choose to make.} | cave fungus |
      | {tag:mindbreaker-toxin} | 2 | 1 | cave fungus |
      | {tag:invisibility-potion} | 2 | 1 | a graga sac |
      | {tag:succubus-draught} | 2 | 1 | a willing lover's blood |
      | {tag:raven-draught} | 2 | 1 | a raven's eye |
      | {tag:ravenheart-red} | 4 | 1 (yields up to 2 per turn) {info:Multiply the amount of resources by the units you choose to make.} | — |
      | {tag:distilled-coca} | 4 | 1 | coca leaves |
      | {tag:advanced-poppy} | 4 | 1 | poppy |
      | {tag:phrygian-tears} | 4 | 2 | Gambit |
      | {tag:gunpowder-grenade} | 6 | 1 | saltpeter |
      | {tag:purifier} | 6 | 1 | cave fungus |
      | {tag:dreamers-draught} | 6 | 1 | a {tag:skinless-brain} {info:You must be holding one. It is not used up.} |
      | {tag:forgiveness} | 8 | 1 | someone's tears |
      | {tag:flawless-skin} | 8 | 1 | a lock of Nobility hair |
  # GM-only. The `gamemaster` flag is not a property of any Character — the
  # documents page resolves it against the Discord GM role at request time,
  # the same check that gates /gm. Filtered server-side, so a player's browser
  # never receives this text at all.
  cavingmonsters:
    name: Caving Monsters
    public: false
    tags: []
    flags:
      - gamemaster
    description: |-
      Some monsters to use in caving.

      **Nekkers**

      Weak, quadrupedal, ape-like scavengers. They eat corpses and can often be seen on the surface after battles, competing with the vultures. Killing one leaves a {tag:nekker-corpse}, which a {tag:butcher} can cut {tag:nekker-pheromones} out of. ‡

      **Gragas**

      Dangerous, strong, hulking cave dwellers. Extremely slow, in part due to their overburdened leg muscles, which barely support them.

      Can be easily escaped. Killing them leaves a {tag:graga-corpse}, which a {tag:butcher} cuts a {tag:graga-sac} out of; that goes into {tag:graga-sweat} and the {tag:invisibility-potion}. The Merchant can sell Graga Sacs. ‡

      **Skinless**

      Explorers and citizens of the caves. They travel alone or in packs, eventually returning to their communities in the **Aberrant Pits**. They rarely venture up into the Caverns. They used to be people. They can be talked down.

      Killing them leaves a {tag:skinless-corpse}; a {tag:butcher} cuts the {tag:skinless-brain} out of it, and that brain is the one ingredient in the {tag:dreamers-draught}. The Merchant can sell them. Note what that means: the Draught has a price, and the price is that somebody chose not to talk one down. ‡

      **Aberrants**

      Horrors. Drop Aberrant Hearts.

  # The Demoness threat's own brief (db/lib/threats.js). Assigned by the
  # Demoness tag, which is also what unlocks the hidden Demoness tag
  # category — so the paper and the powers arrive together.
  demoness:
    name: Demoness
    public: false
    secret: true
    tags:
      - Demoness
    description: |-
      You are a being from the Caves. You have been alive for a long time, but your memory is fuzzy.

      You don't need to eat. Instead, you live for the thrill of enslaving souls, manipulating people, and causing pain. You will become unhappy if you don't.

      You can Break souls — see {tag:demoness}. If you have {tag:slavemaster}, they become {tag:broken-enslaved} instead of merely {tag:broken}.

      You find normal crosses tacky and boring. Fire scares you somewhat — it definitely hurts. The Silver Cross, on the other hand, terrifies you. If you touch it, your powers are disabled for the rest of the day.

      There may be people in the area who want to use your power. They'll take your treasured independence — the demented, servile idiots.

