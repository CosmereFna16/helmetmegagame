explanation:
  tag: Anyone with this tag gets this Document.
  public: If assigned, this will appear in a player's document folder. However, using the search function, anyone can browse and find this document.
documents:
  - name: Courtier
    key: courtier
    public: false
    tags: []
    description: As a member of the Baron’s retinue, you may take food from the faction Silo whenever you please—within reason (Treasurer and Leader roles can see their Silo’s transaction history, so don’t steal. If you’d like to steal, arrange it with a GM).
  - name: Church
    key: church
    public: false
    tags: []
    description: As a member of the Church, you may take food from the faction Silo whenever you please—within reason (Treasurer and Leader roles can see their Silo’s transaction history, so don’t steal. If you’d like to steal, arrange it with a GM).
  - name: Independent
    key: independent
    public: false
    tags: []
    description: As an independent townsman, you aren't on anyone's payroll. The Headman isn't expected to pay you. You should therefore ply a trade so you don't starve to death.
  - name: Ravenheart's Economy
    key: ravenhearteconomy
    public: true
    tags: []
    description: |-
      You are welcome to change things, but this is how things have been done for years:

      The town farms, fishes, and hunts. Most of that is taxed by the Headman, who sends a fraction of his tithe to the Bishop and the bulk to the Baron (through the Meister, his tax-man). What little he has left is paid to those on the town's payroll, mostly the Sheriff.

      So, the Fortress survives off of the town's taxes, and provides protection in turn.
      The Church survives off of of the town's taxes, and provides religious services in turn.
  - name: Diplomat
    key: diplomat
    public: false
    tags: []
    description: 'You are from the Culture, a post-scarcity interstellar empire ruled by benevolent robots. You want the best for the people of Ravenheart—and that would mean convincing the Baron to join the Culture—but Contact (the Culture''s diplomatic wing) operates in the scale of centuries, not human generations. They don''t think it''s the right time. Therefore, do the best you can to quietly help people and further the Culture''s mission: install an open-minded ruler, ensure the Order of the Iron Cross doesn''t grow out of control, and above all, do not blow your cover. You have limited gadgets—including an autonomous, sentient drone disguised as a raven. If anything goes wrong, the "Helpless Is The Face Of Your Beauty" will teleport you on board. It''ll take your message three minutes to reach them.'
  - name: Treasurer
    key: treasurer
    public: true
    tags:
      - Treasurer
      - Leader
    description: |-
      As Treasurer or Leader, you can control your faction's Silo.

      You can see every deposit and withdrawal, in addition to each member's Resource amounts.
  - name: Medical
    key: medical
    public: true
    tags:
      - any of the medical tags
    description: |-
      Most negative health effect tags, like {tag:paralyzed}, can be removed by people with the Medical skills (Basic, Skilled, and Expert). Different tags have different resource, turn (measured in Routine moves), and skill costs. Some grievous wounds even require Gambits to treat. You're welcome to try to treat a wound outside of your level of expertise, but it'll be a Gambit and you might make things worse.

      To find a removal cost, hover over the tag's tooltip. A full list is below:

      [Placeholder]
  - name: Producing Resources
    key: production
    public: true
    tags:
      - Laborer
      - Laborer (Farming)
      - Laborer (Fishing)
      - Laborer (Herding)
    description: |-
      Each is an Effort, and pays out more with the right tags:

      | Activity | Base | +Laborer | +Specialist | Location |
      |---|---|---|---|---|
      | Herding | {resource:herding:base} | {resource:herding:laborer} | {resource:herding:specialist} | Anywhere |
      | Farming | {resource:farming:base} | {resource:farming:laborer} | {resource:farming:specialist} | Town or Fortress (arable land) |
      | Fishing | {resource:fishing:base} | {resource:fishing:laborer} | {resource:fishing:specialist} | Town or Fortress (near the river) |
      | Hunting | 1d4 ⬢ (×3 with Hunter) | — | — | Town, Fortress, or Caves |

      Laborer is a general-purpose 2-point tag that makes producing resources more viable than just as a survival method, while the specialist tags (you can buy them for 2 points on top of Laborer) make that specific trade a lot more valuable.

      To automatically add Resources on an Effort, type +(resources) anywhere in your message. For example, write `I hunt. +1d4*3` or `I farm. +{resource:farming:specialist}`. Also works on default moves.
  - name: Combat
    key: combat
    public: true
    tags: []
    description: |-
      Different equipment excels in different situations.

      Weapons
      - Blunt (clubs, staves, fists) — the most versatile option, but rarely puts someone down for good on its own.
      - Stabbing (spears, rapiers, daggers) — precise and effective against unarmored targets.
      - Cutting (swords, knives) — even light armor blunts a cutting weapon's edge.
      - Slashing (axes) — good at cutting through shields.

      Armor
      - Plate and other rigid, single-piece armor reliably turns aside blows, but has joints and gaps a determined attacker can exploit.
      - Chainmail and other soft armor stops a blade, but a blunt weapon can still bruise or break bone underneath.
      - Quilted armor (gambesons and the like) softens blunt impacts further, and layers well under other armor—chainmail can even go under formal court dress.
      - Almost nothing stops a bullet.
      - Always wear a helmet.

      Shields
      - A shield is a serious advantage in melee.
      - Fighters standing shield-to-shield are safer together than apart.

      Energy Shields
      Rare and expensive personal-scale energy shields exist in the wasteland around Ravenheart, remnants of finer technology than the barony can produce itself.
      - Stop bullets, arrows, and energy blasts outright.
      - Reduce, but don't stop, melee damage.
      - Do nothing against needles or syringes.
      - Worn on the belt or the wrist.
      - Short out on contact with liquid.
  - name: Town Starting Packet
    key: townstarting
    public: false
    tags: []
    description: |-
      The Headman received a raven saying he didn't receive the last tax wagon. It was probably ambushed by bandits. The Meister won't be happy about this... prepare to have the Silo drained.

      Last week, Thomas Ciobanu—a respectable tradesman—was found milky-eyed, giggly, with a profoundly satisfied look. He wandered around aimlessly, going hungry—when people tried to help him, he just called them fools. The Esculap's medicine couldn't do anything for him, so the Inquisitor had him hanged. He fought all the way to the gallows, like a rabid dog.
  - name: Fortress Starting Packet
    key: fortressstarting
    public: false
    tags: []
    description: |-
      The last tithe didn't arrive and it shows. Banquets are paused, and the food is being rationed. The Silos will run dry until the next tax wagon arrives. It is up to the Baron's men to resolve this.

      To make things worse, a letter from the Bastard declaring his intents was found on the table. Since the Guards didn't see anyone come in to deliver it, it must've been someone on the inside—someone who favored the Bastard—that brought it in. There must be a traitor.
  - name: Camp Starting Packet
    key: campstarting
    public: false
    tags: []
    description: |-
      The word for wind in the Windlands is the same word as train, because that's how hard it blows.

      While most of humanity today lives underground—or in those rare fertile oases like Ravenheart—your people refused to cower in the darkness like animals. You lived among brambles, lizards, and oxen. To protect yourself, you wore wind goggles, masks, and gloves. Often being unable to hear your comrades, you were taught sign language as a child and learned to recognize people by their gait.

      The air is still here near Ravenheart. This could be a home. What will life be without having to move to find food? What will life be without wind? What will it be like to see your friend's face, and not just their mask?

      The Bastard has united the clans. The Windriders and the Broken Spears are the two that survived the long march to Ravenheart. You are ready to fight. However, there was an incident: a man from the Broken Spears killed one of the Windriders during an argument on whether to raid the town. Additionally, food stores are running low.
  - name: Broken Spear Clan
    key: brokenspear
    public: false
    tags: []
    description: |-
      You are lightning on the plains—a hundred horses galloping! Behold the people of Ravenheart, like sheep ready for the rending. After you take it, Ravenheart will become a place of strength and honor.

      The Bastard showed strength when he defeated your Lieutenant, but not honor: he spared his life, humiliating him even further. You will follow him gladly.

      However, the fire in his eyes has died. The man ponders and calculates like an old toothless woman. Ravenheart knows you are here—every day wasted is a day they grow stronger. The birds watch you as if you were a corpse ready for the picking.

      In the meantime, you have a threat close at hand: the scheming, snakelike Windriders. During an argument about whether or not to raid the village for food, one of your men killed one of theirs. They are not happy. Perhaps they are scared of your strength.

      Celebrations of life are as common as honor killings in the Broken Spears clan. Drug use—or "riding the horse"—is common and approved. Methamphetamine is a favorite. Addiction, however, is weakness; what, did you fall off the horse?
  - name: Windrider Clan
    key: windrider
    public: false
    tags: []
    description: |-
      The Windrider Clan was the last to bend the knee to the Bastard. An impenetrable sense of family, centuries of prestige: Ereglas the Conqueror, Oliver Horserider, The Ranger Chief, all were Windriders.

      Fate has already decided your course. You were forged upon the face of a dead planet. You are the ideal human, intelligent, capable, and unyielding. They cannot stop you.

      The Bastard understands an all-out attack would be suicide. Support of the people, logistics, careful planning; these are what kept the Windriders alive while clans like the Broken Spears formed and disbanded, year by year. So your fealty was lightly given. You trust his plan will net you a home, but you will not accept a king.

      One of the Broken Spears brats murdered one of your men during an argument. These things happen; but such a childish deed cannot go unpunished, can it? Either the Bastard makes amends—prioritization of resources, independence after taking Ravenheart, or some other promise—or the Broken Spears get put down like the brushlizards they are.
  - name: The Lifeweb
    key: lifewebbasic
    public: true
    tags: []
    description: |-
      "The Lifeweb is a profoundly unintelligible piece of machinery within the Fortress's walls—a tower that, at its peak, spews the Life Fire. Although it also produces electricity, it is mainly prized for the Fire, which is said to be what keeps Ravenheart arable, breathable, and livable. One only needs to follow the river a few miles south east before seeing, far in the distance, the wind-scorched lands of the rest of the world, humid, scarred, and inhospitable.

      The tower has a door leading downwards. Presumably, that is where the Mortii feed the Lifeweb.

      The Lifeweb must be fed every 3 days (6 turns) to stay alive. It requires a living person."
  - name: The Lifeweb
    key: lifeweb
    public: false
    tags: []
    description: |-
      "The Lifeweb is a profoundly unintelligible piece of machinery within the Fortress's walls—a tower that, at its peak, spews the Life Fire. Although it also produces electricity, it is mainly prized for the Fire, which is said to be what keeps Ravenheart arable, breathable, and livable. One only needs to follow the river a few miles south east before seeing, far in the distance, the wind-scorched lands of the rest of the world, humid, scarred, and inhospitable.

      The tower has a door leading downwards. Inside, levers control what parts of Ravenheart receive power.

      Only the Mortii know how to feed the Lifeweb"
  - name: Respawning
    key: respawning
    public: true
    tags:
      - Chaplain
      - Mortus
      - Dead
    description: |-
      When you die, you can rejoin at any time—but you'll be Cursed, meaning you can only start as a Bum or Migrant and you'll suffer a -3 penalty to your starting points.

      To rejoin as any other role, wait until your body is buried or your name is engraved. It is the Church and Mortii's jobs to do so.
  - name: Court Structure
    key: courtstructure
    public: false
    tags: []
    description: |-
      The Baron rules. His Hand is his spymaster and voice—loyal, proactive, and the one who actually keeps the court organized. The Meister is the Keep's circulatory system: he collects the Town's taxes through the Headman and watches the Silo so nobody bleeds it dry.

      The Captain commands the Watch. The Bishop leads the Church and, with the Priests, tends to people's souls. The Esculap runs the Sanctuary and everyone's health. The Inquisitor answers to no one but God, and would very much like the Bishop to remember that.

      Below them all, Courtiers gossip, scheme, and try not to get caught doing either.
