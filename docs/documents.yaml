  - name: Post-Christianity
    key: postchristianity
    public: true
    tags: []
    description: |-
      In the darkness, there are sacred things. And what is most sacred? That which remembers. What is darkness but ignorance?

      Can you blame them, the writhing monsters, suckling beneath the surface? They are less than animal. They have proven that that essence of purity which God imbued us with is not immutable; to the contrary, people have lost it, spat on it, cursed it.

      ... And some people mock it, but what do they know of the stability, the openness of an ennobled mind, the very peace they seek through their perversions? It is good—it is the ultimate good—to love oneself, and through oneself, God.

      It is regrettable, but not reproachable, that God smote the Earth. At the very least, those of us who remained faithful were given this sliver of Paradise.

      The problem with the Heretic is just that: they crawl out from their holes, seeking to turn us against the Truth. But they cannot. Even if they were to murder and devour all of us, we would not forget God—as long as we chose not to. Nothing can take away faith, charity, and virtue, except our own malfeasance.

      In any case, the Afterlife is around the corner, as it always was and it always will be. Only by forgetting that could we prioritize the gratification of the moment.
