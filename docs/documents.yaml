  - name: The Pusher
    key: thepusher
    public: true
    tags: []
    roles:
      - captain
      - pusher
    description: |-
      The Pusher sells drugs and runs the town's gambling den and, well, er, informal drug pub. It's his job to keep the peasants satisfied and not rebelling.

      He is exempted from the usual capital punishment for drug possession—completely above the law. But he owes the Baron a cut, directly.
