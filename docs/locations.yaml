  - id: forest
    name: Forest
    zone: Town
    map: { x: 12, y: 44 }
    description: >-
      Streams part mossy boulders under the green shadows of spruce and beech.
    extendedDescription: ""
    publicSubLocations: []
    privateSubLocations: []
