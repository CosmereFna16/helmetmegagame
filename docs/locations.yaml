# Source of truth for the game's Zones/Locations, hand-edited then pushed
# with `npm run db:sync-locations` (db/prisma/sync-locations.js). This sync
# is fully destructive in both directions: entries here are upserted into
# the DB and Discord, and any Zone/Location NOT listed here gets its Discord
# category+channels deleted and its DB row removed. Removing an entry is a
# real delete — there's no undo short of re-adding it (which provisions a
# brand-new category/channels, since removed/re-added locations lose their
# old Discord IDs).
#
# - id: a stable slug, used to match this entry to its DB row across syncs.
#   Renaming a location later means changing `name` here, NOT `id` — a
#   changed `id` is treated as a brand-new location (old one gets pruned,
#   new one gets provisioned from scratch) instead of a rename.
# - name: display name (standardize on Title Case). Only used as the Discord
#   channel/category name the FIRST time a location is provisioned —
#   renaming it here later does not rename already-provisioned Discord
#   channels (see CLAUDE.md). Note: Discord itself force-lowercases regular
#   text/forum channel names (no spaces/capitals allowed at all), but
#   preserves whatever case you give a category — so a provisioned
#   location's category shows "Town Square" while its actual channels show
#   "town-square"/"town-square-public"/"town-square-private". Not a bug,
#   just a Discord platform rule.
# - zone: the Zone this location belongs to, matched/created by name.
# - description: a sentence or two of flavor text for the location.
# - publicSubLocations: ordered list (most important/flavorful first) of the
#   sub-areas players can spin up forum posts for in the location's `-public`
#   channel. Purely descriptive — there's no enforcement tying a forum post
#   to one of these names.
# - privateSubLocations: same idea, for secret/GM-facing sub-areas. Not
#   surfaced anywhere yet beyond this file.
# - tags: free-text flavor/categorization labels for the location itself —
#   unrelated to the player-facing Tag system. Empty until you fill them in.
#
# `description` + `publicSubLocations` are also pushed to Discord: every
# sync (re)writes the location's plain/summary channel topic to
# `{description} | **Sublocations**: {publicSubLocations, comma-joined}` —
# unlike the channel name, this keeps syncing on every run, even for
# already-provisioned locations, so editing these two fields and re-running
# the sync is enough to update the live channel topic.
#
# Locations within a zone are ordered by narrative importance (throne room
# first, etc.) — purely for readability of this file; it has no effect on
# Discord's actual category ordering, which stays alphabetical by
# "{Zone} / {Location}" (see sortLocationCategories).
#
# locationConnections: the sole master for which Locations a character can
# directly travel between (Location.connectsTo, a symmetric/undirected
# adjacency graph — each pair below connects both ways, by `id` slug). A
# Location pair NOT listed here does NOT connect — there is no
# "fully connected unless restricted" fallback, so a newly-added Location
# starts isolated until you add a pair for it here. Order within a pair
# doesn't matter. Whether a hop is free or costs a turn is still decided by
# whether the two Locations share a Zone (see performMove in
# bot/src/lib/location.js) — this list only decides which hops are legal at
# all, i.e. you can only ever move to a direct neighbor, never teleport
# elsewhere in your own Zone.

locationConnections:
  - [undercroft, keep]
  - [gatehouse, undercroft]
  - [keep, gatehouse]
  - [gatehouse, depths]
  - [gatehouse, forest]
  - [gatehouse, town]
  - [gatehouse, church]
  - [church, forest]
  - [church, town]
  - [sanctuary, town]
  - [sanctuary, forest]
  - [underquarter, town]
  - [underquarter, sanctuary]
  - [town, customs]
  - [customs, merchants-depot]
  - [customs, depths]
  - [depths, warcamp]
  - [warcamp, forest]
  - [garrison, gatehouse]
  - [garrison, keep]

locations:
  # --- Fortress ---
  - id: keep
    name: Keep
    zone: Fortress
    description: Ceramite, the color of terracotta and steel, supports the impregnable fortress.
    publicSubLocations:
      - Throne Room
      - Drawing Room
      - Ballroom
      - Council
      - The Charon
      - Quarters
      - Kitchen
      - Healer's Ward
      - Library
      - Reliquary Chapel
    privateSubLocations: []
    tags: []
  - id: garrison
    name: Garrison
    zone: Fortress
    description: The garrison tower, surrounded by smaller stone buildings.
    publicSubLocations:
      - Captain's Office
      - Barracks
      - Armory
      - Dungeons
      - Training Yard
      - Kennels
    privateSubLocations: []
    tags: []
  - id: gatehouse
    name: Gatehouse
    zone: Fortress
    description: Grass rises rebelliously around the manicured paths. Past the portcullis, old stone stairs rise towards the Keep, and further yet, to the Lifeweb.
    publicSubLocations:
      - Gate
      - Lifeweb
      - Yard
      - Stables
      - Bell Tower
    privateSubLocations: []
    tags: []
  - id: undercroft
    name: Undercroft
    zone: Fortress
    description: Pillars uphold the keep from collapsing onto the barrels of wine and antiquities. There are deeper passages.
    publicSubLocations:
      - Cistern
      - Tombs
      - Bricked-up Door
    privateSubLocations: []
    tags: []

  # --- Town ---
  - id: town
    name: Square
    zone: Town
    description: Vines dress the homes. A crumbling wall, patched with wooden palisade, surrounds the town.
    publicSubLocations:
      - Town Square
      - Fields
      - Inn
      - Market Row
      - Gallows
      - Fountain
      - Smithery
    privateSubLocations: []
    tags: []
  - id: church
    name: Cathedral
    zone: Town
    description: Stained limestone erected modestly upon a tall wooded hill. The inside is vastly illuminated.
    publicSubLocations:
      - Hall
      - Vestry
      - Crypt
      - Bell Tower
      - Confessionals
      - Scriptorium
      - Courtyard
      - Houses
    privateSubLocations: []
    tags: []
  - id: sanctuary
    name: Sanctuary
    zone: Town
    description: A squat and vulnerable place, immaculately clean.
    publicSubLocations:
      - Ward
      - Esculap's Office
      - Theater
      - Icebox
      - Morgue
      - Garden
    privateSubLocations: []
    tags: []
  - id: underquarter
    name: Underquarter
    zone: Town
    description: Squat buildings, piled into discomfort.
    publicSubLocations:
      - Shacks
      - Abandoned Theater
      - Gambling Den
      - Bathhouse
      - Old Lots
    privateSubLocations: []
    tags: []

  - id: forest
    name: Forest
    zone: Town
    description: Streams part mossy boulders under the green shadows of spruce and beech.
    publicSubLocations: []
    privateSubLocations: []
    tags: []

  # --- Windlands ---
  - id: warcamp
    name: Warcamp
    zone: Windlands
    description: An arbitrary array of tents, shields, and banners rise against the mountainside.
    publicSubLocations:
      - War Pavilion
      - Common Grounds
      - Healer's Tents
      - Mess Hall
      - Broken Spears Camp
      - Lieutenant's Camp
      - Fields
      - Mountains
    privateSubLocations: []
    tags: []

  # --- Caves ---
  - id: customs
    name: Customs
    zone: Caves
    description: The sentry beholds migrants and mercenaries as they talk around the fire.
    publicSubLocations:
      - Outpost
    privateSubLocations: []
    tags: []
  - id: merchants-depot
    name: Merchant's Depot
    zone: Caves
    description: Inside the caves, crates around a decayed metal frame. There is a small gap in the roof where light comes in.
    publicSubLocations:
      - Ledger Room
      - Shuttle Pad
      - Bunkhouse
    privateSubLocations: []
    tags: []
  - id: depths
    name: Depths
    zone: Caves
    description: The start and end of all things.
    publicSubLocations: []
    privateSubLocations: []
    tags: []
