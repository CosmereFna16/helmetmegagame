# Source of truth for the game's Zones/Locations, hand-edited then pushed
# with `npm run db:sync-locations` (db/prisma/sync-locations.js). This sync
# is fully destructive in both directions: entries here are upserted into
# the DB and Discord, and any Zone/Location NOT listed here gets its Discord
# category+channels deleted and its DB row removed. Removing an entry is a
# real delete — there's no undo short of re-adding it (which provisions a
# brand-new category/channels, since removed/re-added locations lose their
# old Discord IDs).
#
# PROSE STYLE — every prose value in this file is a `>-` folded block scalar,
# one physical line per paragraph, no hard wrapping. `>-` never needs quoting,
# so a `: ` or a leading `-` inside the text is safe, and it folds back to a
# single line — which matters, because `description` becomes a Discord channel
# topic and a sublocation `description` becomes one section of a forum post.
# A value with real paragraph breaks takes `|-` instead, with ONE blank line
# between paragraphs: a folded scalar collapses a blank line to a single
# newline, not the `\n\n` a paragraph break needs. An unwritten value is
# literally `""`. docs/roles.yaml follows the same rule.
#
# - id: a stable slug, used to match this entry to its DB row across syncs.
#   Renaming a location later means changing `name` here, NOT `id` — a
#   changed `id` is treated as a brand-new location (old one gets pruned,
#   new one gets provisioned from scratch) instead of a rename.
# - name: display name (standardize on Title Case). Only used as the Discord
#   channel/category name the FIRST time a location is provisioned —
#   renaming it here later does not rename already-provisioned Discord
#   channels (see CLAUDE.md). Note: Discord itself force-lowercases regular
#   text/forum channel names (no spaces/capitals allowed at all), but
#   preserves whatever case you give a category — so a provisioned
#   location's category shows "Town Square" while its actual channels show
#   "town-square"/"town-square-public"/"town-square-private". Not a bug,
#   just a Discord platform rule.
# - zone: the Zone this location belongs to, matched/created by name.
# - map: where this location's node sits on the web app's Map panel, as
#   { x, y } percentages of the plate (0-100, origin top-left, the plate is
#   4:3). Synced into Location.mapX/mapY on every run, so retuning the
#   layout is an edit here and a re-sync — no code change. A location with no
#   `map:` simply isn't drawn on the plate; it's still reachable from the
#   destination list beneath it. `npm run map:check` reports crossing roads
#   and nodes drawn on top of each other, which is the fast loop for moving
#   these numbers around by hand.
# - description: the INTRO string — a sentence or two of flavor text. Short by
#   necessity: this is what goes into the summary channel's topic, which is a
#   single capped line. See the paragraph below.
# - extendedDescription: the LONG-FORM description, with room to breathe. Goes
#   into the generated description post (see below), not the topic, so length
#   is not a concern here.
# - publicSubLocations: ordered list (most important/flavorful first) of the
#   sub-areas players can spin up forum posts for in the location's `-public`
#   channel. Purely descriptive — there's no enforcement tying a forum post
#   to one of these names. Each entry is a `name` plus its own long-form
#   `description`, which becomes one section of the description post:
#
#     publicSubLocations:
#       - name: Throne Room
#         description: >-
#           Whatever you want to say about the throne room.
#
#   A bare string (`- Throne Room`) is still accepted by the sync and reads as
#   that name with an empty description, but don't write new ones that way —
#   an unwritten sublocation takes `description: ""`.
# - privateSubLocations: same idea, for secret/GM-facing sub-areas — still a
#   plain list of names. Not surfaced anywhere yet beyond this file.
# - tags: free-text flavor/categorization labels for the location itself —
#   unrelated to the player-facing Tag system. Empty until you fill them in.
#
# `description` + `publicSubLocations` are also pushed to Discord: every
# sync (re)writes the location's plain/summary channel topic to
# `{description} | **Sublocations**: {sublocation names, comma-joined}` —
# unlike the channel name, this keeps syncing on every run, even for
# already-provisioned locations, so editing these two fields and re-running
# the sync is enough to update the live channel topic.
#
# `extendedDescription` + each sublocation's `description` go somewhere else:
# every sync generates one **locked, pinned** forum post per location, titled
# "{name}: Description", at the top of the location's `-public` channel. Its
# body is the location's extended description followed by a `###` section per
# public sublocation — a sublocation with no text still gets its heading, so an
# unwritten one is visibly unwritten rather than missing. The post carries the
# 🗺 **Information** forum tag, which means the Dawn wipe skips it entirely
# (⏰ Persistent is not enough: a ⏰ post survives but has its messages
# deleted, which would blank the description every dawn).
#
# That post is reconciled by content hash on every sync: edit the text here,
# re-run the sync, and the existing post is rewritten in place — same thread,
# still pinned, still locked, no duplicate. A sync that changes nothing makes
# no Discord writes at all. Delete the post by hand and the next sync rebuilds
# it.
#
# Locations within a zone are ordered by narrative importance (throne room
# first, etc.) — purely for readability of this file; it has no effect on
# Discord's actual category ordering, which stays alphabetical by
# "{Zone} / {Location}" (see sortLocationCategories).
#
# locationConnections: the sole master for which Locations a character can
# directly travel between (Location.connectsTo, a symmetric/undirected
# adjacency graph — each pair below connects both ways, by `id` slug). A
# Location pair NOT listed here does NOT connect — there is no
# "fully connected unless restricted" fallback, so a newly-added Location
# starts isolated until you add a pair for it here. Order within a pair
# doesn't matter. Whether a hop is free or costs a turn is still decided by
# whether the two Locations share a Zone (see performMove in
# bot/src/lib/location.js) — this list only decides which hops are legal at
# all, i.e. you can only ever move to a direct neighbor, never teleport
# elsewhere in your own Zone.

locationConnections:
  - [undercroft, keep]
  - [gatehouse, undercroft]
  - [keep, gatehouse]
  - [gatehouse, caverns]
  - [gatehouse, forest]
  - [gatehouse, town]
  - [gatehouse, church]
  - [church, forest]
  - [church, town]
  - [sanctuary, town]
  - [sanctuary, forest]
  - [underquarter, town]
  - [underquarter, sanctuary]
  - [town, customs]
  - [customs, merchants-depot]
  - [customs, caverns]
  - [warcamp, railroad]
  - [caverns, railroad]
  - [railroad, aberrant-pits]
  - [warcamp, forest]
  - [garrison, gatehouse]
  - [garrison, keep]

locations:
  # --- Fortress ---
  - id: keep
    name: Keep
    zone: Fortress
    map: { x: 30, y: 8 }
    description: >-
      Stone walls reinforced with ceramite, the color of terracotta and steel, draped with the Baron's fluttering heraldry.
    extendedDescription: |-
      Stone walls reinforced with ceramite, the color of terracotta and steel, draped with the Baron's fluttering heraldry. Old electric lamps of various colors illuminate the warm, comfortable interiors.

      The gates open into a hallway branching into the Keep's many rooms. Past gargoyle-studded columns, the throne room. Stairs lead downwards into the Undercroft and upwards into the Quarters.
    publicSubLocations:
      - name: Throne Room
        description: >-
          Towards the back, benches form concentric circles around the throne. There's an elevated arcade to the left. A hearth roars.
      - name: Great Hall
        description: >-
          It's a warm room. Windows face the forest.
      - name: Council Room
        description: >-
          A wide table. There's a holographic map of Ravenheart, and a button for the intercom.
      - name: The Charon
        description: >-
          A sealed gate. The Baron's key opens this.
      - name: Quarters
        description: ""
      - name: Kitchen
        description: ""
      - name: Healer's Ward
        description: ""
      - name: Library
        description: ""
      - name: Reliquary Chapel
        description: >-
          The Silver Cross is locked away here, accessible by the Incarn's key.
    privateSubLocations: []
    tags: []
  - id: garrison
    name: Garrison
    zone: Fortress
    map: { x: 48, y: 10 }
    description: >-
      The garrison tower and its offshoot buildings surround the training yard.
    extendedDescription: >-
      The garrison tower and its offshoot buildings surround the training yard. A home for those who walk the cobbles at night.
    publicSubLocations:
      - name: Captain's Office
        description: >-
          In the center of the tower, second floor. You should let some fresh air in.
      - name: Barracks
        description: ""
      - name: Armory
        description: >-
          It has enough to give each Watchman his choice of gear—short of plate—but nothing else. Consider stocking it.
      - name: Dungeons
        description: >-
          Connects to the Undercroft.
      - name: Training Yard
        description: >-
          In the center of the garrison, surrounded by elevated platforms. There are crates of wooden training weapons.
      - name: Kennels
        description: >-
          Good and mean dogs both, ready to hunt unruly peasants.
    privateSubLocations: []
    tags: []
  - id: gatehouse
    name: Gatehouse
    zone: Fortress
    map: { x: 38, y: 24 }
    description: >-
      Grass rises rebelliously around the manicured paths, illuminated by searchlight. Past the portcullis, old stone stairs rise towards the Keep, and further yet, to the Lifeweb.
    extendedDescription: >-
      Grass rises rebelliously around the manicured paths, illuminated by searchlight. Past the portcullis, old stone stairs rise towards the Keep, and further yet, to the Lifeweb. The Gatehouse itself has several watchtowers and a murder hole over the gate. A winch system controls the portcullis. There is a back gate behind the fortress leading into the forest, but it's equally guarded.
    publicSubLocations:
      - name: Gate
        description: >-
          Menacing iron, with several inset windows, built by a paranoid man. There are old logs to the side, piled and bound.
      - name: Lifeweb
        description: >-
          A tower of pure ceramite. It spews a voluminous flame. The Mortii's key unlocks the door.
      - name: Yard
        description: >-
          The constant rains have raised vines across the fortress walls, which flower white and pink.
      - name: Stables
        description: >-
          Old horses only, incapable of bearing anyone.
      - name: Bell Tower
        description: >-
          The old-fashioned way.
    privateSubLocations: []
    tags: []
  - id: undercroft
    name: Undercroft
    zone: Fortress
    map: { x: 22, y: 20 }
    description: >-
      Pillars uphold the keep from collapsing onto the barrels of wine and antiquities. There are deeper passages.
    extendedDescription: >-
      Pillars uphold the keep from collapsing onto the barrels of wine and antiquities. There are deeper passages.
    publicSubLocations:
      - name: Sauna
        description: >-
          The heater is electric. Small and comfortable.
      - name: Cistern
        description: >-
          Dark, connected rooms with ornate pillars, full of knee-high water.
      - name: Tombs
        description: >-
          The Baron's progenitors bear faces of varying humanity.
      - name: Bricked-up Door
        description: >-
          Where does this go...? It wouldn't be easy to open this passageway.
      - name: Ancient Shrine
        description: >-
          A shrine to Thoth, the Old God of art, magnificence, and inspiration. How has this not been destroyed yet?
    privateSubLocations: []
    tags: []

