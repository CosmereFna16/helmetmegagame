  - id: sanctuary
    name: Sanctuary
    zone: Town
    map: { x: 44, y: 62 }
    description: >-
      A squat but elegant place built into the ruins of an old fort. Immaculately clean, bathed by light.
    extendedDescription: >-
      A squat but elegant place built into the ruins of an old fort. Immaculately clean, bathed by light. The Barons funded it with electrical and mechanical equipment, but not all of it works—the wooden contraptions are more reliable.
    publicSubLocations:
      - name: Ward
        description: ""
      - name: Esculap's Office
        description: ""
      - name: Theater
        description: ""
      - name: Morgue
        description: >-
          Where they go before they're buried. There's also a cellar stuffed with ice here—a good place to store organs.
      - name: Garden
        description: >-
          You can grow herbs here.
    privateSubLocations: []
    tags: []
  - id: underquarter
    name: Underquarter
    zone: Town
    map: { x: 70, y: 56 }
    description: >-
      Squat buildings, piled into discomfort.
    extendedDescription: ""
    publicSubLocations:
      - name: Shacks
        description: ""
      - name: Abandoned Theater
        description: ""
      - name: Gambling Den
        description: ""
      - name: Bathhouse
        description: ""
      - name: Old Lots
        description: ""
    privateSubLocations: []
