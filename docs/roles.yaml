  - name: Caves
    situation:
      - >-
        The Caves: Migrants make it to the Fortress from here.
    factions:
      - name: The Company
        slug: the-company
        starting_resources: 5
        roles:
          - name: Merchant
            slug: merchant
            intro: >-
              Make your fortune buying and selling Tags.
            description:
              - >-
                Ravenheart is a great source of business and not much else. You wouldn't dare put your heart here—the place is doomed.
              - >-
                You start with a huge amount of capital, invest it.
              - >-
                Your goal is to make as many Resources as you can by buying and selling Tags. Your Supply Depot sits in Customs, down in the caves: go there to request Tags by shuttle (it'll cost you), and then sell them. To sell Tags, simply message a GM explaining who'd like the tag and how much you're selling it for.
              - >-
                Try your hand at usury. Lend loans with interest, and call on your Dockers to enforce them. That's probably the easiest way to make serious bucks.
              - >-
                If things ever get too dour, simply hop on your sponsor's shuttle… if you can pay for it. Trip's 30 ⬢ flat, pal.
            difficulty: hard
            multiple: false
            starting_resources: 50
            starting_location: customs
            leader: true
            starting_tags:
