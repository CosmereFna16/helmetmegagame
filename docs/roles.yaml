            slug: lieutenant-windrider-clan
            intro: >-
              Your ultimate task is at hand. Fulfill your destiny.
            description:
              - >-
                Your ultimate task is at hand. Fulfill your destiny.
              - >-
                The Broken Spears clan cannot go unpunished for their slight.
