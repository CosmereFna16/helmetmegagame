# Source of truth for every playable role/faction, synced into
# Postgres by db/lib/syncRoles.js#syncRolesFromYaml (npm run db:sync-roles).
#
# PROSE STYLE — every prose value in this file (`intro`, each `description`
# bullet, each zone `situation` entry) is a `>-` folded block scalar, one
# physical line per bullet, no hard wrapping. `>-` never needs quoting, so a
# `: ` or a leading `-` inside the text is safe, and it folds back to a single
# line. That last part is load-bearing: `Role.description` is a String[] and
# each element is rendered as one Markdown bullet on the role charter, so an
# element carrying a newline breaks the bullet. Never use `|` on `description`
# — it hands the sync one string where Prisma wants an array, and the sync
# throws mid-pass with the factions already written.
# docs/locations.yaml follows the same rule.
#
# `slug` is the stable match key across syncs, on both factions and roles —
# same contract as docs/locations.yaml's `id` and docs/tags.yaml's `slug`.
# Renaming later means changing `name`, NOT `slug`; a changed slug is treated
# as a brand-new row (old one pruned) rather than a rename.
#
# Threats — Sympathizer, the Demoness, the Cult of Bacchus, the Judge — are
# NOT in this file. They were never read by any sync (a GM hands those seats
# out by hand and they never appear in the player-facing picker), so the whole
# brief lives in docs/threats.md as prose instead.
#
# The Brigands are the exception, and used to be listed here as a threat too:
# they ARE in this file, with weights, so they sync like any other faction and
# do appear in the picker. Nothing in db/, web/ or bot/ special-cases them.
# They sit in the Town zone — their roles start in the Forest, which is a Town
# location, and under the Silo reach rules (FACTIONS.md) a faction's zone is
# where its Silo is. Town robbers bank in Town.
#
# `weight` (only present on `multiple: true` roles) is the seat cap,
# expressed as seats allowed per 100 total players — the picker computes
# `round(weight * GameConfig.playerCount / 100)`, so raising playerCount to
# 120 scales every capped role by 1.2. `weight: unlimited` means no cap at
# any scale (chaff roles like Peasant/Bum).
#
# `multiple: false` roles get no `weight` field at all — they're a single
# specific named character (Baron, Bishop, Headman, ...) and always stay
# at exactly one seat no matter how large the game gets, which is not the
# same thing as "1 per 100 players".
#
# `leader: true` / `treasurer: true` set Character.isLeader/isTreasurer at
# creation. These were once entries in `starting_tags`, but Leader and
# Treasurer are plain booleans on Character, not Tags (see
# docs/systemdocs/TAGS.md §6).
#
# `starting_resources` appears on both roles and factions, but means two
# different things depending on where it sits: on a role, it's how many
# Resources that character starts play with; on a faction, it's how many
# Resources start in that faction's Silo.
#
# `starting_location` (role-level) is a Location **slug** from
# docs/locations.yaml — it decides where the character starts, and therefore
# which Discord Location category they get view access to on creation.
#
# `starting_tags` are Tag names from docs/tags.yaml, granted free at
# creation on top of whatever the player buys with points. The sync throws on
# any name not in the catalog, so a typo can't silently ship a character
# missing tags.
#
# `extra_starting_points` (optional, defaults 0) is added to
# GameConfig.startingTagPoints to form that role's point-buy budget.
zones:
  - name: Fortress
    situation:
      - >-
        The last tithe didn't arrive, and it shows. The banquets are a little less extravagant than usual. Pressure builds on the Meister—go talk to the Headman. Take whatever they can spare from their stores.
      - >-
        A letter from the Bastard declaring his intents was found on the table. Since the Watchmen didn't see anyone come in, it's clear someone on the inside brought it in. There must be a traitor.
      - >-
        To lift spirits, the Baron has offered the Successor's (or Heir's) hand in marriage. The Courtiers, suspecting each other to be traitors, rival for the betrothal.
    factions:
      - name: The Court
        slug: the-court
        starting_resources: 20
        roles:
          - name: Baron
            slug: baron
            intro: >-
              They will know your glory, O Baron! This land is yours, hope incarnate—for humanity, for peace, for justice. Walk the path of your ancestors.
            description:
              - >-
                You are the ruler. Your job is not an easy one.
              - >-
                Choose a last name—a Dynasty name. Ensure that if you die, at least your heir will continue on. He is everything!
              - >-
                Whether you understand the gravity of the situation or live in perpetual dissociation, you are charged with the survival of one of Earth's last bastions. This is Ravenheart—a garden, a home. Your ancestors strove to protect it. Some will see you as a dictator, some will see you as a fool—it does not matter! This will outlive you, outlive them!
              - >-
                Stay happy. An unhappy Baron is an unproductive, dangerous baron.
              - >-
                Your offices have a PA system that can be heard in intercoms throughout Ravenheart.
              - >-
                You have three missions:
              - >-
                Be organized. Communicate, force your Hand to work, check in on people.
              - >-
                Above all, be proactive. Ravenheart is a dangerous place. If you prepare well, you may keep away the darkness...
              - >-
                Win people's loyalty. If your people trust and follow you, there is no danger you cannot overcome.
              - >-
                Eventually you will be attacked by the Bastard. Besides your personal investment, it's clear that that man cannot be allowed to rule Ravenheart. The visionary that he is—he would lose it all. Ravenheart's survival is a delicate balance, one he cannot possibly hope to ever understand.
            difficulty: hard
            multiple: false
            starting_resources: 10
            starting_location: keep
            leader: true
            starting_tags:
              - Ravenhearter
              - Nobility
              - The Baron's Key
              - Literate
            doc_elements:
              - courtstructure
              - lifewebbasic
              - fortressstarting
              - armory
              - ravenhearteconomy
              - charon
          - name: Baroness
            slug: baroness
            intro: >-
              Someone must raise and protect the Heir, that invaluable link in the chain of infinity. Be the Lioness—or succumb to anxiety.
            description:
              - >-
                Your Baron is a stressed, overburdened, and threatened man. You do not understand everything, but he has a project. Ravenheart is one of humanity's last bastions. Do what you can to protect him—and the Heir.
            difficulty: easy
            multiple: false
            starting_resources: 3
            starting_location: keep
            starting_tags:
              - Ravenhearter
              - Courtier
              - Nobility
              - Jewelry
              - Literate
            doc_elements:
              - courtstructure
              - lifewebbasic
              - fortressstarting
          - name: Heir
            slug: heir
            intro: >-
              You are your father's son. Are you the exact opposite of him, or his closest ally?
            description:
              - >-
                You are your father's son. Are you the exact opposite of him, or his closest ally?
              - >-
                Life is good as the Heir—but that make change one day. Will you make effort to reveal the gravity of your situation, or will you dawdle your days away?
            difficulty: easy
            multiple: false
            starting_resources: 3
            starting_location: keep
            starting_tags:
              - Ravenhearter
              - Courtier
              - Nobility
              - Literate
            doc_elements:
              - courtstructure
              - lifewebbasic
              - fortressstarting
          - name: Successor
            slug: successor
            intro: >-
              You are the Baron's daughter. Bring some light to the darkness.
            description:
              - >-
                You are the Baron's daughter. Bring some light to the darkness.
            difficulty: easy
            multiple: false
            starting_resources: 3
            starting_location: keep
            starting_tags:
              - Ravenhearter
              - Courtier
              - Nobility
              - Jewelry
              - Literate
            doc_elements:
              - courtstructure
              - lifewebbasic
              - fortressstarting
          - name: Hand
            slug: hand
            intro: >-
              You're the Baron's best friend and perhaps the only man he can truly trust. If anyone can be said to shape fate, Hand, it is you.
            description:
              - >-
                You're the Baron's best friend and perhaps the only man he can truly trust. You are completely loyal to him.
              - >-
                The Baron works best when he's informed and has a court that's loyal and organized. You are his spymaster, his executor, his voice. Without you, Ravenheart collapses.
              - >-
                Whether you understand the gravity of the situation or live in perpetual dissociation, you are charged with the survival of one of Earth's last bastions. This is Ravenheart—a garden, a home.
              - >-
                You have three missions:
              - >-
                Be organized. Communicate, check in on people, execute the Baron's vision.
              - >-
                Above all, be proactive. Ravenheart is a dangerous place. If you prepare well, you may keep away the darkness...
              - >-
                Win people's loyalty. If your people trust and follow you, there is no danger you cannot overcome.
              - >-
                Eventually you will be attacked by the Bastard. Besides your personal investment, it's clear that that man cannot be allowed to rule Ravenheart. The self-loving "visionary" that he is—he would lose it all. Ravenheart's survival is a delicate balance, one he cannot possibly hope to ever understand.
            difficulty: normal
            multiple: false
            starting_resources: 2
            starting_location: keep
            treasurer: true
            starting_tags:
              - Ravenhearter
              - Courtier
            doc_elements:
              - courtstructure
              - lifewebbasic
              - fortressstarting
              - courtier
              - armory
              - ravenhearteconomy
              - charon
          - name: Meister
            slug: meister
            intro: >-
              You are the Keep's brains, but more importantly, its circulatory system. Feel the weight of the world, Meister, you Atlas!
            description:
              - >-
                You are the Keep's brains, but more importantly, its circulatory system. Ensure the Town sends its taxes—your main contact there is the Headman—and oversee that no one is taking undue amounts of Resources from the Silo.
              - >-
                Your part in fate is not well-loved nor well-understood, but it is essential. You may not understand yet, Meister, but there are great things at play.
              - >-
                Consider keeping records of what happens every day. They may be useful later.
              - >-
                You have minor medical training and you know how to use the Keep's messenger ravens.
            difficulty: normal
            multiple: false
            starting_resources: 2
            starting_location: keep
            treasurer: true
            starting_tags:
              - Ravenhearter
              - Courtier
              - Frail
              - Medical (Skilled)
              - Literate
              - Ravenkeeper
            doc_elements:
              - courtstructure
              - lifewebbasic
              - fortressstarting
              - courtier
              - ravens
              - medical
              - ravenhearteconomy
          - name: Courtier
            slug: courtier
            intro: >-
              Live life indulgently or honorably—there is not much binding you except your own decisions. What freedom!
            description:
              - >-
                For whatever reason, the Baron keeps you around in his court. Convince the Captain to launch an expedition into the caves, host marvelous feasts, and duel your fellow courtiers for the Successor's affection. It is your day to make of it what you will.
              - >-
                As a Courtier, your gameplay is largely undefined. You are encouraged to set your own goals and desires and work to fulfill them.
              - >-
                Buy the Manor tag once you're established if you want a household of your own to run, alongside your wine and your politics.
            difficulty: easy
            multiple: true
            weight: 6
            starting_resources: 3
            starting_location: keep
            starting_tags:
              - Ravenhearter
              - Courtier
              - Literate
            doc_elements:
              - courtier
              - courtstructure
              - fortressstarting
          - name: Minstrel
            slug: minstrel
            intro: >-
              Compose ballads, smuggle drugs from the Town, and keep the Baron happy.
            description:
              - >-
                Compose ballads, smuggle drugs from the Town (and peddle them to the courtiers), keep the Baron happy.
            difficulty: easy
            multiple: true
            weight: 1
            starting_resources: 3
            starting_location: keep
            starting_tags:
              - Ravenhearter
              - Musician
            doc_elements:
              - courtier
              - courtstructure
              - fortressstarting
          - name: Diplomat
            slug: diplomat
            intro: >-
              Recover ancient artifacts and study Ravenheartian culture.
            description:
              - >-
                Recover ancient artifacts and study Ravenheartian culture. Meddle. Convince the Baron to join your interstellar federation.
            difficulty: easy
            multiple: true
            weight: 1
            starting_resources: 3
            starting_location: keep
            starting_tags:
              - Ravenhearter
              - Literate
            doc_elements:
              - courtier
              - diplomat
              - courtstructure
              - fortressstarting
          - name: Servant
            slug: servant
            intro: >-
              Keep the fortress running.
            description:
              - >-
                Keep the fortress running. Clean, cook, maintain, and serve.
              - >-
                Take Cooking (Skilled) if you want to run the kitchens properly as the Chef.
            difficulty: easy
            multiple: true
            weight: 3
            starting_resources: 2
            starting_location: keep
            starting_tags:
              - Ravenhearter
              - Cooking (Basic)
            doc_elements:
              - courtier
              - courtstructure
              - fortressstarting
      - name: The Watch
        slug: the-watch
        parent: The Court
        starting_resources: 20
        roles:
          - name: Captain
            slug: captain
            intro: >-
              Bravely lead the Watch and hold back the darkness, you goddamn hero.
            description:
              - >-
                Ravenheart is an ancient bastion of humanity, a beacon of light. It is your solemn duty—at least on paper—to uphold that. Do you understand the gravity of your situation? Oh, enough waxing, Captain—you will either solve the problem or you won't.
              - >-
                You win through leadership, proactivity, communication, and organization. Think carefully. Always be a step ahead of the Dark. If the Watch loves you, the people inform you—if you have eyes everywhere, plans, if you know and see, nothing can stop you.
              - >-
                You are, unfortunately, a man of the bottle. Can you kick your addiction before people find out? (Get the tag removed, somehow).
              - >-
                Or just don't bother.
              - >-
                You know, the Watch is a fine group of men. It's ran this way for a few centuries now. Yes, it's corrupt, technically, but really it's just a good group of boys making money.
              - >-
                And... quitting? Really? That doesn't sound fun...
            difficulty: hard
            multiple: false
            starting_resources: 3
            starting_location: garrison
            leader: true
            treasurer: true
            starting_tags:
              - Ravenhearter
              - Watchman
              - Fighting (Trained)
              - Dog
            doc_elements:
              - courtstructure
              - fortressstarting
              - watchman
              - armory
              - combat
          - name: Incarn
            slug: incarn
            intro: >-
              You are a warrior monk, the Warden, the unbound spirit of the Keep.
            description:
              - >-
                In your heart, you know it is the nature of the Universe that good will win. It is not important to make a big fuss—God is on your side. Above all, keep yourself, and if you can the Baron, the Captain—but changing people's minds is like wrestling a donkey in the mud, you know—pure, holy, a servant of Goodness. Do not stoop to the madness of passion, Incarn!
              - >-
                Your job is to guard the dungeon, process migrants, and protect the Silver Cross, Ravenheart's only relic. The Silver Cross is an ancient artifact. It terrifies and burns demonic creatures.
              - >-
                Your role is as organizational as it is combat-like—you should assist the Captain in assigning his men, drafting battleplans, and performing espionage. Monitor the outskirts and the caves, hire a messenger—always be a step ahead of the darkness.
            difficulty: normal
            multiple: false
            starting_resources: 2
            starting_location: garrison
            treasurer: true
            starting_tags:
              - Ravenhearter
              - Fighting (Skilled)
            doc_elements:
              - courtstructure
              - fortressstarting
              - watchman
              - postchristianity
              - armory
              - combat
          - name: Watchman
            slug: watchman
            intro: >-
              Serve the Baron and salute your Captain. You are the man of the hour!
            description:
              - >-
                Serve the Baron, salute your Captain. Darkness is coming—do you heed the call, or frolick about?
              - >-
                Or—alright, we got the optics out of the way. Truth is, being a Watchman is mostly bribes, racketeering, and gambling. Consider taking protection money from the town businesses. That's what usually works the most.

              - >-
                Your job is simple. **Live a comfortable life. Drink. Make money. Play cards.** Yes, there are bandits about, but it's nothing the townsfolk can't deal with.
              - >-
                Or you can try to be a good man. It's up to you.
            difficulty: easy
            multiple: true
            weight: 8
            starting_resources: 2
            starting_location: garrison
            starting_tags:
              - Ravenhearter
              - Watchman
              - Fighting (Basic)
            doc_elements:
              - courtstructure
              - fortressstarting
              - watchman
              - armory
              - combat
          - name: Squire
            slug: squire
            intro: >-
              Train. One day, you might become a knight.
            description:
              - >-
                Train. One day, you might become a knight.
            difficulty: easy
            multiple: true
            weight: 2
            starting_resources: 2
            starting_location: garrison
            starting_tags:
              - Ravenhearter
            doc_elements:
              - courtstructure
              - fortressstarting
              - watchman
              - armory
              - combat
  - name: Town
    situation:
      - >-
        The last tithe wagon didn't return from the Fortress. Brigands, probably. The Meister won't be happy about this; repare to have the Silo drained.
      - >-
        Last week, Thomas Ciobanta—a respectable tradesman—went inexplicably stupid. He wandered around aimlessly, half-naked and starving. When people tried to help him, he just called them idiots. The Inquisitor tested Thomas's reaction by showing him a cross: he snarled like a dog, so the Inquisitor had him hanged.
    factions:
      - name: The Church
        slug: the-church
        starting_resources: 10
        roles:
          - name: Bishop
            slug: bishop
            intro: >-
              In the animal world, who can choose good but Man? Even if Ravenheart falls, O Bishop, do not let the people's souls fall with it!
            description:
              - >-
                I must ask you, Bishop: do you know the Truth? If not, why do you pose as its Servant? These are questions you must ask before you take office.
              - >-
                It is not the first time dark days have come to Ravenheart, but they are difficult times still. You hope the people will survive—God will ensure it. During this difficult transition, ensure you serve as a shining example of goodness.
              - >-
                At some point, you will have to decide between peacefulness or the Order of the Silver Cross.
              - >-
                Along with the Chaplain, you have the power to dispel negative Tags of the psychological kind—the person must first confess to you, then spend a whole day in prayer (2 Efforts).
            difficulty: normal
            multiple: false
            starting_resources: 3
            starting_location: church
            leader: true
            starting_tags:
              - Ravenhearter
              - Chaplain
              - Pious
              - Literate
            doc_elements:
              - townstarting
              - postchristianity
              - church
              - ravenhearteconomy
          - name: Chaplain
            slug: chaplain
            intro: >-
              Care for the needy, lend an ear, and kindle goodness in others.
            description:
              - >-
                It is not the first time dark days have come to Ravenheart. The people will survive—God will ensure it. During this difficult transition, ensure you serve as a shining example of goodness. Evil can only be held back with Truth—do not stoop to violence or zealotry.
              - >-
                Care for the needy, lend an ear, and kindle goodness in others. Pay visits to the Fortress. Practice pacifism or support the Inquisition.
              - >-
                Along with the Bishop, you have the power to dispel negative Tags of the psychological kind—the person must first confess to you, then spend a whole day in prayer (2 Efforts).
            difficulty: easy
            multiple: true
            weight: 3
            starting_resources: 2
            starting_location: church
            starting_tags:
              - Ravenhearter
              - Chaplain
              - Pious
              - Literate
            doc_elements:
              - townstarting
              - postchristianity
              - church
          - name: Scholastic
            slug: scholastic
            intro: >-
              You are a servant of the truth, delving to places no other man would. Contemplate, search for knowledge—occult or otherwise—and write your magnum opus.
            description:
              - >-
                Earth is a speck in the infinite firmament. You have always been humbled—or perhaps energized—by the Truth. Try to understand it. Search for knowledge—occult or otherwise—and write your magnum opus. Be a hermit or preach on the streets. Whether you wake others up or not, ensure you yourself _never_ fall asleep.
            difficulty: normal
            multiple: true
            weight: 1
            starting_resources: 2
            starting_location: church
            starting_tags:
              - Ravenhearter
              - Literate
            doc_elements:
              - townstarting
              - postchristianity
              - church
      - name: The Sanctuary
        slug: the-sanctuary
        starting_resources: 10
        roles:
          - name: Esculap
            slug: esculap
            intro: >-
              Lead the Sanctuary, developing medicines and putting bodies back together. Be the Eye in the Storm—or lose yourself to curiosity.
            description:
              - >-
                Sickness and pain leave men terrified and alone. It is a noble task to help another face that pain.
              - >-
                Prioritize treating the rich and affluent, despite triage. You may be a noble man, but, despite your scholastic training, the Baron approved your appointment for a reason.
              - >-
                With science, the sky's the limit. You can brew medicines and potions, install implants and body-modifications, and even experiment for the good of science.
              - >-
                If there's no wounded, get creative. Offer clinical trials; go foraging for unique ingredients and try to brew new potions; ask if the Incarn will let you experiment on his prisoners. Brewing potions is especially worthwhile; it can really help it when you get a wave of inmates. Just throw out a few {tag:cleaning-powder}, a few {tag:mercy}, some {tag:poppy}...
              - >-
                You can perform medicine, removing negative medical tags according to their skill, Resource, and action cost.
            difficulty: normal
            multiple: false
            starting_resources: 2
            starting_location: sanctuary
            leader: true
            starting_tags:
              - Ravenhearter
              - Medical (Expert)
              - Brewing (Skilled)
              - Literate
            doc_elements:
              - townstarting
              - medical
          - name: Serpent
            slug: serpent
            intro: >-
              Cure illnesses, perform surgeries, brew potions, and keep people in this world—where they're needed.
            description:
              - >-
                Sickness and pain leave men terrified and alone. It is a noble task to help another face that pain.
              - >-
                With science, the sky's the limit. You can brew medicines and potions, install implants and body-modifications, and even experiment for the good of science.
              - >-
                If there's no wounded, get creative. Offer clinical trials; go foraging for unique ingredients and try to brew new potions; ask if the Incarn will let you experiment on his prisoners. Brewing potions is especially worthwhile; it can really help it when you get a wave of inmates. Just throw out a few {tag:cleaning-powder}, a few {tag:mercy}, some {tag:poppy}...
              - >-
                You can perform medicine, removing negative medical tags according to their skill, Resource, and action cost.
            difficulty: normal
            multiple: true
            weight: 4
            starting_resources: 2
            starting_location: sanctuary
            starting_tags:
              - Ravenhearter
              - Medical (Skilled)
              - Brewing (Basic)
              - Literate
            doc_elements:
              - townstarting
              - medical
      - name: Order of the Silver Cross
        slug: order-of-the-silver-cross
        parent: The Church
        starting_resources: 10
        roles:
          - name: Inquisitor
            slug: inquisitor
            intro: >-
              It is your everlasting duty to protect your people by expunging the barony's corruption.
            description:
              - >-
                Do you know what it means to love God?
              - >-
                Dark days, exactly as preached in the scriptures, are coming to Ravenheart. Look at the people! They frolic, indulging themselves, like sheep before the slaughter! You have seen—_seen_—the blood, the horror. There are things that lurk in the shadows that no man could comprehend. But you have also seen the goodness of God.
              - >-
                You are not thirsty for power. You are just sane. It is your everlasting duty to protect your people by expunging the barony's corruption. To this end, organize your followers and, above all, work to radicalize the Town, the Church, and possibly even the Court.
              - >-
                If you can get the Bishop on your side, it will be a great boon. He is weak! Force him to bend the knee.
              - >-
                The time for silence has passed. There is no time to waste! Scream, from the top of your lungs, what is coming! Wake them!
              - >-
                One other thing: the Incarn holds the Silver Cross, an artifact blessed to defeat evil. Secure it from him.
            difficulty: hard
            multiple: false
            starting_resources: 3
            starting_location: church
            leader: true
            starting_tags:
              - Ravenhearter
              - Pious
            doc_elements:
              - townstarting
              - postchristianity
              - church
          - name: Practicus
            slug: practicus
            intro: >-
              Serve the Inquisitor, and work to radicalize the Town, the Church, and possibly even the Court.
            description:
              - >-
                Do you know what it means to love God?
              - >-
                Dark days, exactly as preached in the scriptures, are coming to Ravenheart. Look at the people! They frolic, indulging themselves, like sheep before the slaughter! You have seen—_seen_—the blood, the horror. There are things that lurk in the shadows that no man could comprehend. But you have also seen the goodness of God.
              - >-
                You are not thirsty for power. You are just sane. It is your everlasting duty to protect your people by expunging the barony's corruption. Work to radicalize the Town, the Church, and possibly even the Court.
              - >-
                If you can get the Bishop on your side, it will be a great boon. He is weak! Force him to bend the knee.
              - >-
                The time for silence has passed. There is no time to waste! Scream, from the top of your lungs, what is coming! Wake them!
              - >-
                One other thing: the Incarn holds the Silver Cross, an artifact blessed to defeat evil. Secure it from him.
            difficulty: easy
            multiple: true
            weight: 3
            starting_resources: 2
            starting_location: church
            starting_tags:
              - Ravenhearter
              - Pious
            doc_elements:
              - townstarting
              - postchristianity
              - church
          - name: Preacher
            slug: preacher
            intro: >-
              You are the Order's face. Speak in the Town Square for all to hear.
            description:
              - >-
                You are the Order's face. Speak in the Town Square for all to hear.
              - >-
                Do you know what it means to love God?
              - >-
                Dark days, exactly as preached in the scriptures, are coming to Ravenheart. Look at the people! They frolic, indulging themselves, like sheep before the slaughter! You have seen—_seen_—the blood, the horror. There are things that lurk in the shadows that no man could comprehend. But you have also seen the goodness of God.
              - >-
                You are not thirsty for power. You are just sane. It is your everlasting duty to protect your people by expunging the barony's corruption. To this end, organize your followers and, above all, work to radicalize the Town, the Church, and possibly even the Court.
              - >-
                If you can get the Bishop on your side, it will be a great boon.
              - >-
                The time for silence has passed. There is no time to waste! Scream, from the top of your lungs, what is coming! Wake them!
              - >-
                One other thing: the Incarn holds the Silver Cross, an artifact blessed to defeat evil. Secure it from him.
            difficulty: easy
            multiple: true
            weight: 1
            starting_resources: 2
            starting_location: church
            starting_tags:
              - Ravenhearter
              - Pious
            doc_elements:
              - townstarting
              - postchristianity
              - church
      - name: The Town
        slug: the-town
        starting_resources: 10
        roles:
          - name: Headman
            slug: headman
            intro: >-
              Lead the Town. Ensure it works and pays its taxes.
            description:
              - >-
                On certain days, you hike up the mountain and behold the Town. Those are the people that are beholden to you. You cannot afford to let them down, Headman!
              - >-
                Your main job is to tax people. You are beholden to the Meister, the Baron's taxman, and things have gotten nasty in the past when the tithe didn't meet his expectations. If the Silo's not full next time he comes, it won't be a pretty day.
              - >-
                Laborers produce far more than they need to eat. Take everything they have, and call the Sheriff if they won't budge.
              - >-
                You also owe some tax to the Bishop.
              - >-
                The Sheriff is on your payroll.
              - >-
                If the Watch do a bit of racketeering or take bribes in town, look the other way, as you always have.
            difficulty: hard
            multiple: false
            starting_resources: 3
            starting_location: town
            leader: true
            starting_tags:
              - Ravenhearter
              - Insightful
              - Old
              - Laborer (Farming)
              - House
            doc_elements:
              - townstarting
              - farming
              - ravenhearteconomy
          - name: Sheriff
            slug: sheriff
            intro: >-
              Keep the peace in the Town, six-shooter at your hip.
            description:
              - >-
                On certain days, you hike up the mountain and behold the Town. Those are the people that are beholden to you. You cannot afford to let them down, Sheriff!
              - >-
                You have a trusty .45 six-shooter, a reject from the Fortress's armory.
            difficulty: normal
            multiple: true
            weight: 1
            starting_resources: 2
            starting_location: town
            starting_tags:
              - Ravenhearter
              - Fighting (Trained)
              - Neoclassic R&W10
              - House
            doc_elements:
              - townstarting
              - combat
          - name: Metalsmith
            slug: metalsmith
            intro: >-
              Forge anything from basic tools to siege implements and legendary weapons.
            description:
              - >-
                With smithing, you are only limited by your Resources and your creativity. You can make weapons, but you can also make armor, tools, siege equipment, sculptures...
              - >-
                You're not on the Headman's payroll, so it's important you find clients so that you can feed yourself.
              - >-
                The theory is important. Axes are good at breaking shields; blunt weapons harm people even in full armor; swords excel in one-to-one combat.
              - >-
                Simple things, like shortswords or basic tools, cost 1 Effort and 2 ⬢. Moderately difficult things, like swords or breastplates, cost 1 Effort and 4 ⬢. High quality objects cost 2 Efforts and 6 ⬢.
              - >-
                You can also make Unique Tags—name and describe them—for 2 Efforts, 1 Move, and 12 ⬢. You'll have to roll to see what the quality ends up being.
            difficulty: normal
            multiple: true
            weight: 1
            starting_resources: 2
            starting_location: town
            starting_tags:
              - Ravenhearter
              - Smithing
              - House
            doc_elements:
              - townstarting
              - smithing
              - combat
              - independent
          - name: Peasant
            slug: peasant
            intro: >-
              You're a peasant. Make a living at day, live your life at night.
            description:
              - >-
                Peasantry—the unlimitedness of knowing you are not being watched, because you are one of Many. You are free, in a way. You must feed yourself and pay your taxes, but what else? It is time to choose a path. Fulfill your Desires or become honest and authentic—choose a life, build it, and protect it.
              - >-
                Naturally, you must work during the Dawn, but you are encouraged to experiment with what you do at Dusk.
              - >-
                You start as a Laborer, working every trade a little harder than most. Specialize further with Laborer (Farming), Laborer (Fishing) (comes with a Boat), or Laborer (Herding) to produce at a dedicated rate in one of them—or find your own trade.
            difficulty: easy
            multiple: true
            weight: unlimited
            starting_resources: 2
            starting_location: town
            extra_starting_points: 2
            starting_tags:
              - Ravenhearter
              - Laborer
            doc_elements:
              - townstarting
              - production
              - independent
          - name: Herald
            slug: herald
            intro: >-
              Tell the news, take messages, and hope either the Baron or the Headman will pay you.
            description:
              - >-
                Done rightly, your job can be quite profitable—particularly if you're willing to spy and play the information game.
              - >-
                Many people are willing to divulge their secrets. Lend an ear, and you'll be surprised at what you pick up.
              - >-
                Since it takes 1 Turn to travel between Zones—and most people aren't making the trip back and forth anyways—information's not instant. The Baron, the Headman, or even the Hand might like to know what's happening on the other side of Ravenheart.
            difficulty: easy
            multiple: true
            weight: 1
            starting_resources: 2
            starting_location: town
            starting_tags:
              - Ravenhearter
            doc_elements:
              - townstarting
              - independent
          - name: Outsider
            slug: outsider
            intro: >-
              Nature garbs you. Live on the outskirts, free and independent.
            description:
              - >-
                Live on the outskirts, free and independent.
              - >-
                You are aware of the Goddess of Nature, Sylva. Some still worship her in Ravenheart. It is up to you to follow the Church or stick to the oldways.
              - >-
                Forage and heal as a Healer (Medical (Basic), Brewing (Basic)), or track game as a Hunter (Laborer (Hunting))—both still Forester at heart. Hunting pays better than any other honest work and can just as easily pay nothing: use the /hunt command from the Forest, or write /hunt in your Move.
            difficulty: easy
            multiple: true
            weight: 2
            starting_resources: 2
            starting_location: town
            extra_starting_points: 3
            starting_tags:
              - Ravenhearter
              - Forester
            doc_elements:
              - townstarting
              - production
              - medical
              - independent
          - name: Mortus
            slug: mortus
            intro: >-
              Bring spirits to peace and feed the Lifeweb.
            description:
              - >-
                You have two jobs, both of them sacred: 1. feed the Lifeweb and 2. bury people, bringing their souls to peace.
              - >-
                The Mortii take a lifelong vow dedicating themselves to powering the Lifeweb. They are often exiles, outcasts, or infirms. Why did you take the vow?
              - >-
                The Lifeweb maintains Ravenheart's environment. Without it, it'll fade into the wastelands. However, it is powered by human blood. People can either voluntarily donate their blood to feed it for a short time—or you can kidnap people and feed them manually.
              - >-
                Any crimes you commit in service of your vow are not crimes.
              - >-
                You are allowed to loot whatever corpses you find. That's how the Mortus traditionally sustain themselves, but if dead people are scarce, you can ask the Headman for some food.
            difficulty: easy
            multiple: true
            weight: 3
            starting_resources: 2
            starting_location: town
            starting_tags:
              - Ravenhearter
              - Mortus
            doc_elements:
              - townstarting
              - lifeweb
              - respawning
          - name: Bum
            slug: bum
            intro: >-
              You live in a shell and sleep with the dogs, but you understand life (or think you do).
            description:
              - >-
                You live in a shell and sleep with the dogs, but you understand life (or think you do). Beg for food and coin.
            difficulty: easy
            multiple: true
            weight: unlimited
            starting_resources: 2
            starting_location: town
            starting_tags:
              - Ravenhearter
            doc_elements:
              - townstarting
          - name: Pusher
            slug: pusher
            intro: >-
              Sell drugs.
            description:
              - >-
                Sell drugs.
              - >-
                You start with an assortment of drugs and can make more.
            difficulty: normal
            multiple: false
            starting_resources: 2
            starting_location: town
            starting_tags:
