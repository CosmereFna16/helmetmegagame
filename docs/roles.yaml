      - name: Brigands
        slug: brigands
        starting_resources: 5
        roles:
          - name: Brigand Leader
            slug: brigand-leader
            intro: >-
              You raided a shipment on the way to the Fortress—well done!
            description:
              - >-
                Some call you scum. But what do they know of freedom?
              - >-
                The Brigand Leader is given the sacred task of organizing his small band of scrappy men. Keep them in line; earn their loyalty, buy them booze, or bully them into submission. Also, find a place to make your base.
              - >-
                You successfully raided a tax caravan. You're rich! But they might be looking for you. Put your resources together and plan your next move.
              - >-
                As a Brigand, you can do whatever you want. But here are some three goals in order of priority in case you need inspiration: 1. Survive, 2. Make money, 3. Find the airship in the Baron's fortress and hitch a ride off this planet! Ha-ha... just kidding. You, in the Keep? Impossible. But imagine...
              - >-
                You are probably afraid of fighting. You do not want to die. Your greatest strength is your creativity: forge papers and play con games; kidnap the metalsmith and build an empire; pay a lady to lure the Heir out and take him hostage; ambush whoever's bringing the tax caravan. Or rob the merchant. Oh, imagine robbing the merchant! If you have to fight, fine, but be careful.
              - >-
                A little hint: some of the Watchmen take bribes.
