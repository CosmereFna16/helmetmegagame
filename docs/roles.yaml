  - name: Caves
    situation:
      - >-
        The Caves: Migrants make it to the Fortress from here.
    factions:
      - name: The Company
        slug: the-company
        roles:
          - name: Merchant
            slug: merchant
            intro: >-
              Make your fortune buying and selling Tags.
            description:
              - >-
                Its poor souls are a great source of business, but Ravenheart is a terrible place otherwise. You wouldn't dare put your heart here—the place is doomed. Time to make some money.
              - >-
                Your Depot sits in the Customs, down inside the Caverns: a shuttle with a hangar door up in the ceiling. Your Licence opens it. There's a mini-turret, almost always off. It won't shoot you, but it'll shoot anyone else, including the Dockers.
              - >-
                You can buy at the Depot's price and sell it at whatever makes sense for profit. You can also buy things from Ravenheartians and sell them to the Depot: brews, ore, cave fungus, smithing production, paintings. Ravenheart Red and paintings especially fetch a good price.
              - >-
                The Company will advance you up to 60 ⬢ against the business. Your license will be revoked if you fail to pay it.
              - >-
                Try your hand at usury. Lend at high rates and call on your Dockers to collect. That's probably the easiest way to make serious bucks.
              - >-
                Taking the shuttle instead of the Railroad like a normal migrant costs 30 ⬢. And you have to have your license.
            difficulty: hard
            multiple: false
            starting_resources: 10
            starting_zone: caverns
            leader: true
            starting_tags:
              - Literate
              - Merchant's Garb
              - Merchant's License
            doc_elements:
              - townstarting
          - name: Docker
            slug: docker
            intro: >-
              Serve the Merchant and get drunk during the night.
            description:
              - >-
                Serve the Merchant and get drunk during the night. Maybe he'll let you get a ride on his spaceship if things ever get bad around here.
              - >-
                You are the legs of his business. The Depot is at the bottom of the Caves and his customers are not, so somebody carries the goods up and the money down—that is you. Somebody also collects from the people who owe him. That is also you.
              - >-
                One warning about the Depot: the mini-turret only recognises the Merchant's Licence. He has one. You do not.
            difficulty: easy
            multiple: true
            weight: 2
            starting_resources: 1
            starting_zone: caverns
            starting_tags: []
            doc_elements:
              - townstarting
              - merchant
