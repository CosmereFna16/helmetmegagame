# Source of truth for every playable role/faction, synced into
# Postgres by db/lib/syncRoles.js#syncRolesFromYaml (npm run db:sync-roles).
#
# PROSE STYLE — every prose value in this file (`intro`, each `description`
# bullet, each zone `situation` entry) is a `>-` folded block scalar, one
# physical line per bullet, no hard wrapping. `>-` never needs quoting, so a
# `: ` or a leading `-` inside the text is safe, and it folds back to a single
# line. That last part is load-bearing: `Role.description` is a String[] and
# each element is rendered as one Markdown bullet on the role charter, so an
# element carrying a newline breaks the bullet. Never use `|` on `description`
# — it hands the sync one string where Prisma wants an array, and the sync
# throws mid-pass with the factions already written.
# docs/locations.yaml follows the same rule.
#
# Factions and roles are maps keyed by slug (`baron:`, not `- slug: baron`);
# `zones:` stays a sequence, since a zone here carries only a name. See
# docs/tags.yaml's header for why, and db/lib/yamlEntries.js.
#
# `slug` is the stable match key across syncs, on both factions and roles —
# same contract as docs/locations.yaml's `id` and docs/tags.yaml's `slug`.
# Renaming later means changing `name`, NOT `slug`; a changed slug is treated
# as a brand-new row (old one pruned) rather than a rename.
#
# Threats — Sympathizer, the Demoness, the Judge — are
# NOT in this file. They were never read by any sync (a GM hands those seats
# out by hand and they never appear in the player-facing picker), so the whole
# brief lives in db/lib/threats.js instead (docs/systemdocs/THREATS.md).
#
# The Brigands are the exception, and used to be listed here as a threat too:
# they ARE in this file, with weights, so they sync like any other faction and
# do appear in the picker. Nothing in db/, web/ or bot/ special-cases them.
# They sit in the Town zone — their roles start in the Forest, which is a Town
# location, and under the Silo reach rules (FACTIONS.md) a faction's zone is
# where its Silo is. Town robbers bank in Town.
#
# `weight` (only present on `multiple: true` roles) is the seat cap,
# expressed as seats allowed per 100 total players — the picker computes
# `round(weight * GameConfig.playerCount / 100)`, so raising playerCount to
# 120 scales every capped role by 1.2. `weight: unlimited` means no cap at
# any scale (chaff roles like Commoner/Migrant).
#
# `multiple: false` roles get no `weight` field at all — they're a single
# specific named character (Baron, Bishop, Headman, ...) and always stay
# at exactly one seat no matter how large the game gets, which is not the
# same thing as "1 per 100 players".
#
# A seat normally frees up when its holder dies. The roles that DON'T reopen
# (Baron, Heir, Bishop, the Brigands, ...) are listed in
# code — db/lib/roleCapacity.js#PERMANENT_SEAT_ROLE_SLUGS, by slug — not here.
#
# `leader: true` / `treasurer: true` set Character.isLeader/isTreasurer at
# creation. These were once entries in `starting_tags`, but Leader and
# Treasurer are plain booleans on Character, not Tags (see
# docs/systemdocs/TAGS.md §6).
#
# `whitelist: true` is a SEPARATE thing, and used to be the same thing: who
# may claim this seat at all. Picking a whitelisted role needs the @Leader
# Whitelist Discord role (db/lib/roleIds.js), unless a GM has switched
# GameConfig.leaderWhitelistEnabled off on /gm/dev. It rode on `leader:` until
# the two were split, which conflated a hosting decision with a faction
# mechanic — the Baron HAS to lead the Court whether or not his seat is gated,
# and the Hand and the Arbiter are gated without leading anything. Every
# `leader: true` role is also whitelisted today, but that is a choice, not a
# rule: set both, independently.
#
# `starting_resources` (role-level) is how many Resources that character
# starts play with. A faction's Silo is not listed here: its opening balance
# is computed at seed time from the weights of the faction's roles — see
# db/lib/factionSilo.js.
#
# `starting_zone` (role-level) is a Zone **slug** from docs/zones.yaml — it
# decides where the character starts, and therefore which zone role (and so
# which Discord category) they get on creation. Must be a presence zone: the
# Caves group itself is not standable, but its levels (caverns, railroad,
# aberrant-pits) are.
#
# `silo` (faction-level, optional) is a Room **slug** from docs/zones.yaml —
# the room this faction banks in. CREATE-ONLY, exactly like `parent:` below:
# it seeds the pointer when the faction row is first written and is never
# re-applied, because a Leader or Treasurer re-points their own silo in play
# and a re-sync must not drag it back. See docs/systemdocs/FACTIONS.md.
#
# `starting_location` (role-level, optional) is a Location **slug** from
# docs/zones.yaml — it decides which Location channel (and "Location: {Name}"
# role) the character lands in. If a role gives none, it defaults to the
# first Location (by `sort`) of its `starting_zone`. If both are given, the
# location must actually belong to that zone — the sync throws otherwise.
#
# `starting_tags` are Tag names from docs/tags.yaml, granted free at
# creation on top of whatever the player buys with points. The sync throws on
# any name not in the catalog, so a typo can't silently ship a character
# missing tags.
#
# `extra_starting_points` (optional, defaults 0) is added to
# GameConfig.startingTagPoints to form that role's point-buy budget.
zones:
  - name: Fortress
    situation:
      - >-
        The last tithe didn't arrive, and it shows. The banquets are a little less extravagant than usual. Pressure builds on the Meister—go talk to the Headman. Take whatever they can spare from their stores.
      - >-
        A letter from the Bastard declaring his intents was found on the table. Since the Watchmen didn't see anyone come in, it's clear someone on the inside brought it in. There must be a traitor.
      - >-
        To lift spirits, the Baron has offered the Successor's (or Heir's) hand in marriage. The Courtiers, suspecting each other to be traitors, rival for the betrothal.
    factions:
      the-court:
        name: The Court
        silo: storehouse
        roles:
          baron:
            name: Baron
            # The seat fixes the holder's gender -> Role.lockedGender.
            gender: MAN
            intro: >-
              They will know your glory, O Baron! This land is yours, hope incarnate — for humanity, for peace, for justice. Walk the path of your ancestors.
            description:
              - >-
                You are the ruler. Your job isn't an easy one.
              - >-
                Choose a last name — a Dynasty name. Ensure that if you die, at least your heir will continue on.
              - >-
                Whether you understand the gravity of the situation or live in perpetual dissociation, you are charged with the survival of one of Earth's last bastions. This is Ravenheart — a garden, a home. Your ancestors strove to protect it. Some will see you as a dictator, some will see you as a fool — it does not matter! This will outlive you, outlive them!
              - >-
                Stay happy. An unhappy Baron is an unproductive, dangerous baron.
              - >-
                The Council Room has an intercom. Anyone standing at that table can speak into it, and everyone above ground hears — except the Black Hills, which no speaker was ever strung out to. The yard also has an automated machine gun turret which can be turned on from the Captain's office. It can't tell hostiles or friendlies apart. ‡
              - >-
                You have three missions:
              - >-
                Be organized. Communicate, force your Hand to work, check in on people.
              - >-
                Above all, be proactive. Ravenheart is a dangerous place. If you prepare well, you may keep away the darkness…
              - >-
                Win people's loyalty. If your people trust and follow you, there is no danger you cannot overcome.
              - >-
                Eventually you will be attacked by the Bastard. Besides your personal investment, it's clear that that man cannot be allowed to rule Ravenheart. The visionary that he is — he would lose it all. Ravenheart's survival is a delicate balance, one he cannot possibly hope to ever understand.
              - >-
                A note: there is a trapdoor in the throne room that drops into a dark pit. There's a Graga there, a true monster.
              - >-
                The town's labor feeds Ravenheart but doesn't produce any surplus. Its true economic surplus comes from Godard Factory’s production of Squeeze. Keep close communication with the Banneret to ensure he’s getting you enough obols to fund the warchest, and buy you nice things from the merchant.
            difficulty: hard
            multiple: false
            starting_resources: 5
            starting_zone: fortress
            extra_starting_points: 7
            leader: true
            whitelist: true
            starting_tags:
              - Armory Key
              - Ravenhearter
              - Nobility
              - The Baron's Key
              - Elevator Key
              - Baron's Scepter
              - Brigandine
              - Sabre
              - Literate
              - Courtier
              - Obol x25
              - Post-Christian
            doc_elements:
              - godking
              - squeeze
              - courtstructure
              - lifewebbasic
              - fortressstarting
              - watchman
              - armory
              - ravenhearteconomy
              - charon
          baroness:
            name: Baroness
            # The seat fixes the holder's gender -> Role.lockedGender.
            gender: WOMAN
            intro: >-
              Someone must raise and protect the Heir, that invaluable link in the chain of infinity. Be the Lioness — or succumb to anxiety.
            description:
              - >-
                Your Baron is a stressed, overburdened, and threatened man. You do not understand everything, but he has a project. Ravenheart is one of humanity's last bastions. Do what you can to protect him — and the Heir.
            difficulty: easy
            multiple: false
            starting_resources: 1
            starting_zone: fortress
            starting_tags:
              - Ravenhearter
              - Courtier
              - Nobility
              - Jewelry
              - Literate
              - Obol x5
              - Post-Christian
            doc_elements:
              - godking
              - courtstructure
              - lifewebbasic
              - fortressstarting
          heir:
            name: Heir
            # The seat fixes the holder's gender -> Role.lockedGender.
            gender: MAN
            intro: >-
              You are your father's son. Are you the exact opposite of him, or his closest ally?
            description:
              - >-
                You are your father's son. Are you the exact opposite of him, or his closest ally?
              - >-
                Life is good as the Heir — but that may change one day. Will you make effort to reveal the gravity of your situation, or will you dawdle your days away?
            difficulty: easy
            multiple: false
            starting_resources: 1
            starting_zone: fortress
            extra_starting_points: 5
            starting_tags:
              - Ravenhearter
              - Courtier
              - Nobility
              - Literate
              - Obol x5
              - Post-Christian
            doc_elements:
              - godking
              - courtstructure
              - lifewebbasic
              - fortressstarting
          successor:
            name: Successor
            # The seat fixes the holder's gender -> Role.lockedGender.
            gender: WOMAN
            intro: >-
              You are the Baron's daughter. Bring some light to the darkness.
            description:
              - >-
                You are the Baron's daughter. Bring some light to the darkness.
            difficulty: easy
            multiple: false
            starting_resources: 1
            starting_zone: fortress
            starting_tags:
              - Ravenhearter
              - Courtier
              - Nobility
              - Jewelry
              - Literate
              - Post-Christian
            doc_elements:
              - godking
              - courtstructure
              - lifewebbasic
              - fortressstarting
          hand:
            name: Hand
            intro: >-
              You're the Baron's best friend and perhaps the only man he can truly trust. If anyone can be said to shape fate, Hand, it is you.
            description:
              - >-
                You're the Baron's best friend and perhaps the only man he can truly trust. You are completely loyal to him.
              - >-
                The Baron works best when he's informed and has a court that's loyal and organized. You are his spymaster, his executor, his voice. Without you, Ravenheart collapses.
              - >-
                Whether you understand the gravity of the situation or live in perpetual dissociation, you are charged with the survival of one of Earth's last bastions. This is Ravenheart — a garden, a home.
              - >-
                You have three missions:
              - >-
                Be organized. Communicate, check in on people, execute the Baron's vision.
              - >-
                Above all, be proactive. Ravenheart is a dangerous place. If you prepare well, you may keep away the darkness…
              - >-
                Win people's loyalty. If your people trust and follow you, there is no danger you cannot overcome.
              - >-
                Eventually you will be attacked by the Bastard. Besides your personal investment, it's clear that that man cannot be allowed to rule Ravenheart. The self-loving "visionary" that he is — he would lose it all. Ravenheart's survival is a delicate balance, one he cannot possibly hope to ever understand.
              - >-
                A note: there is a trapdoor in the throne room that drops into a dark pit. There's a Graga there, a true monster.
              - >-
                The town's labor feeds Ravenheart but doesn't produce any surplus. Its true economic surplus comes from Godard Factory’s production of Squeeze. Keep close communication with the Banneret to ensure he’s getting you enough obols to fund the warchest, and buy you nice things from the merchant.
            difficulty: normal
            multiple: false
            starting_resources: 1
            starting_zone: fortress
            extra_starting_points: 7
            treasurer: true
            whitelist: true
            starting_tags:
              - Armory Key
              - Ravenhearter
              - Courtier
              - Literate
              - Hand's Pin
              - Elevator Key
              - Obol x10
            doc_elements:
              - godking
              - squeeze
              - courtstructure
              - lifewebbasic
              - fortressstarting
              - courtier
              - watchman
              - armory
              - ravenhearteconomy
              - charon
          meister:
            name: Meister
            intro: >-
              You are the Keep's brains, but more importantly, its circulatory system. Feel the weight of the world, Meister, you Atlas!
            description:
              - >-
                You are the Keep's brains, but more importantly, its circulatory system. Ensure the Town sends its taxes — your main contact there is the Headman — and oversee that no one is taking undue amounts of Resources from the Silo.
              - >-
                Your part in fate is not well-loved nor well-understood, but it is essential. You may not understand yet, Meister, but there are great things at play.
              - >-
                Consider keeping records of what happens every day. They may be useful later.
              - >-
                You have minor medical training and you know how to use the Keep's messenger ravens.
              - >-
                A note: there is a trapdoor in the throne room that drops into a dark pit. There's a Graga there, a true monster.
              - >-
                The town's labor feeds Ravenheart but doesn't produce any surplus. Its true economic surplus comes from Godard Factory’s production of Squeeze. Keep close communication with the Banneret to ensure he’s getting you enough obols to fund the warchest, and buy you nice things from the merchant.
            difficulty: normal
            multiple: false
            starting_resources: 2
            starting_zone: fortress
            treasurer: true
            whitelist: true
            starting_tags:
              - Ravenhearter
              - Courtier
              - Frail
              - Medical (Basic)
              - Literate
              - Bird
              - Obol x5
            doc_elements:
              - godking
              - squeeze
              - courtstructure
              - lifewebbasic
              - fortressstarting
              - courtier
              - medical
              - ravenhearteconomy
          arbiter:
            name: Arbiter
            intro: >-
              Represent the God-King Enoch II's interests, support Ravenheart's defense, and advise the Baron.
            description:
              - >-
                You are on the Baron's side or you dislike him—it's up to you. However, your home and allegiance is back in the Kingdom, and as such, you are here to serve His Majesty God-King Enoch II's interests—primarily by ensuring neither Ravenheart's court nor its peasants get uppity, and secondarily by aiding in the organization of its defenses against both internal and external threats.
              - >-
                Unless the God-King orders you otherwise, ensure you're helping the fortress however you can. It is particularly important that you aid in economic matters, such as in the organization of Godard Factory or the town's taxation. Ensure the Meister and the Headman do their jobs.
              - >-
                Ask the Baron how you can help him. Your service will surely be appreciated.
            difficulty: normal
            multiple: false
            whitelist: true
            starting_resources: 2
            starting_zone: fortress
            starting_location: keep
            starting_tags:
              - Ravenhearter
              - Literate
              - Sabre
              - Major's Insignia
              - Obol x4
            doc_elements:
              - godking
              - courtstructure
              - fortressstarting
              - ravenhearteconomy
          courtier:
            name: Courtier
            intro: >-
              Live life indulgently or honorably — there is not much binding you except your own decisions. What freedom!
            description:
              - >-
                For whatever reason, the Baron keeps you around in his court. Convince the Captain to launch an expedition into the caves, host marvelous feasts, and duel your fellow courtiers for the Successor's affection. It is your day to make of it what you will.
              - >-
                As a Courtier, your gameplay is largely undefined. You are encouraged to set your own goals and desires and work to fulfill them.
            difficulty: easy
            multiple: true
            weight: 6
            starting_resources: 1
            starting_zone: fortress
            starting_tags:
              - Ravenhearter
              - Courtier
              - Literate
            doc_elements:
              - godking
              - courtier
              - courtstructure
              - fortressstarting
          minstrel:
            name: Minstrel
            intro: >-
              Compose ballads, smuggle drugs from the Town, and keep the Baron happy.
            description:
              - >-
                Compose ballads, smuggle drugs from the Town (and peddle them to the courtiers), keep the Baron happy.
            difficulty: easy
            multiple: true
            weight: 1
            starting_resources: 1
            starting_zone: fortress
            starting_tags:
              - Ravenhearter
              - Musician
            doc_elements:
              - godking
              - courtier
              - courtstructure
              - fortressstarting
          servant:
            name: Servant
            intro: >-
              Keep the fortress running.
            description:
              - >-
                Keep the fortress running. Clean, cook, maintain, and serve.
              - >-
                Take Cooking (Skilled) if you want to run the kitchens properly as the Chef.
            difficulty: easy
            multiple: true
            weight: 3
            starting_resources: 1
            starting_zone: fortress
            starting_tags:
              - Ravenhearter
              - Cooking (Basic)
            doc_elements:
              - godking
              - courtier
              - courtstructure
              - fortressstarting
      the-watch:
        name: The Watch
        silo: mess-hall
        parent: The Court
        roles:
          captain:
            name: Captain
            intro: >-
              Bravely lead  and hold back the darkness, you goddamn hero.
            description:
              - >-
                Ravenheart is an ancient bastion of humanity, a beacon of light. It is your solemn duty — at least on paper — to uphold that. Do you understand the gravity of your situation? Oh, enough waxing, Captain — you will either solve the problem or you won't.
              - >-
                You win through leadership, proactivity, communication, and organization. Think carefully. Always be a step ahead of the Dark. If the Watch loves you, the people inform you — if you have eyes everywhere, plans, if you know and see, nothing can stop you.
              - >-
                You are, unfortunately, a man of the bottle. Can you kick your addiction before people find out? (Get the tag removed, somehow).
              - >-
                Or just don't bother.
              - >-
                You know, the Watch is a fine group of men. It's ran this way for a few centuries now. Yes, it's corrupt, technically, but really it's just a good group of boys making money.
              - >-
                And… quitting? Really? That doesn't sound fun…
            difficulty: hard
            multiple: false
            starting_resources: 1
            starting_zone: fortress
            leader: true
            whitelist: true
            treasurer: true
            starting_tags:
              - Armory Key
              - Ravenhearter
              - Watchman
              - Tactician
              - Melee (Trained)
              - Disabler
              - Radio System (Watch)
              - Radio Bracelet (Watch)
              - Alcoholic
              - Watch Badge
              - Broadsword
              - Simple Helm
              - Buckler
              - Mail Coif
              - Mail Shirt
              - Post-Christian
            doc_elements:
              - godking
              - courtstructure
              - fortressstarting
              - watchman
              - armory
              - combat
          incarn:
            name: Incarn
            intro: >-
              You are a warrior monk, the Warden, the unbound spirit of the Keep.
            description:
              - >-
                Guard the Keep, process prisoners, pray to God, and guard the Silver Cross. Your allegiance is to God first and foremost, and Ravenheart second. Fortunately, the Baron is on the side of order more often than not, so your cause is aligned with this. Do not stoop to the madness of passion, Incarn. Be resolute, quiet, and powerful.
              - >-
                Your job is to guard the dungeon, process migrants, and protect the Silver Cross, Ravenheart's only relic. The Silver Cross is an ancient artifact. It terrifies and burns demonic creatures.
              - >-
                Your role is as organizational as it is combat-like — you should assist the Captain in assigning his men, drafting battleplans, and performing espionage. Monitor the outskirts and the caves, hire a messenger — always be a step ahead of the darkness.
            difficulty: normal
            multiple: false
            starting_resources: 2
            starting_zone: fortress
            treasurer: true
            starting_tags:
              - Armory Key
              - Ravenhearter
              - Melee (Basic)
              - Radio Bracelet (Watch)
              - Pious
              - Incarn's Key
              - Cudgel
              - Watch Badge
              - Disabler
              - Mail Coif
              - Mail Shirt
              - Post-Christian
            doc_elements:
              - courtstructure
              - fortressstarting
              - watchman
              - postchristianity
              - armory
              - combat
          watchman:
            name: Watchman
            intro: >-
              Serve the Baron and defend Ravenheart. You are the man of the hour.
            description:
              - >-
                Serve the Baron, salute your Captain. Darkness is coming — do you heed the call, or frolic about?
              - >-
                Or — alright, we got the optics out of the way. Truth is, being a Watchman is mostly bribes, racketeering, and gambling. Consider taking protection money from the town businesses. That's what usually works the most.

              - >-
                Your job is simple. **Live a comfortable life. Drink. Make money. Play cards.** Yes, there are bandits about, but it's nothing the townsfolk can't deal with.
              - >-
                Or you can try to be a good man. It's up to you.
            difficulty: easy
            multiple: true
            weight: 6
            starting_resources: 1
            starting_zone: fortress
            starting_tags:
              - Ravenhearter
              - Watchman
              - Melee (Basic)
              - Disabler
              - Radio Bracelet (Watch)
              - Watch Badge
              - Cudgel
              - Simple Helm
              - Mail Coif
              - Mail Shirt
              - Post-Christian
            doc_elements:
              - courtstructure
              - fortressstarting
              - watchman
              - armory
              - combat
          squire:
            name: Squire
            intro: >-
              Train. One day, you might become a knight.
            description:
              - >-
                Train. One day, you might become a knight.
            difficulty: easy
            multiple: true
            weight: 2
            starting_resources: 1
            starting_zone: fortress
            starting_tags:
              - Ravenhearter
              - Watch Badge
              - Cudgel
              - Simple Helm
              - Buckler
              - Mail Coif
              - Mail Shirt
              - Post-Christian
            doc_elements:
              - courtstructure
              - fortressstarting
              - watchman
              - armory
              - combat
  - name: Town
    situation:
      - >-
        The last tithe wagon didn't return from the Fortress. Brigands, probably. The Meister won't be happy about this; repare to have the Silo drained.
      - >-
        Last week, Thomas Ciobanta—a respectable tradesman—went inexplicably stupid. He wandered around aimlessly, half-naked and starving. When people tried to help him, he just called them idiots. The Inquisitor tested Thomas's reaction by showing him a cross: he snarled like a dog, so the Inquisitor had him hanged.
    factions:
      the-church:
        name: The Church
        silo: pantry
        roles:
          bishop:
            name: Bishop
            intro: >-
              In the animal world, who can choose good but Man? Even if Ravenheart falls, O Bishop, do not let the people's souls fall with it!
            description:
              - >-
                I must ask you, Bishop: do you know the Truth? If not, why do you pose as its Servant? These are questions you must ask before you take office.
              - >-
                It is not the first time dark days have come to Ravenheart, but they are difficult times still. You hope the people will survive — God will ensure it. During this difficult transition, ensure you serve as a shining example of goodness.
              - >-
                At some point, you will have to decide between peacefulness or the Order of the Silver Cross.
              - >-
                Along with the Chaplain, you have the power to dispel negative Tags of the psychological kind — the person must first confess to you, then spend a whole day in prayer (2 Efforts).
            difficulty: normal
            multiple: false
            starting_resources: 1
            starting_zone: town
            leader: true
            whitelist: true
            starting_tags:
              - Cathedral Key
              - Ravenhearter
              - Chaplain
              - Pious
              - Literate
              - Post-Christian
              - Bishop's Mitre
            doc_elements:
              - townstarting
              - postchristianity
              - church
              - ravenhearteconomy
          chaplain:
            name: Chaplain
            intro: >-
              Care for the needy, lend an ear, and kindle goodness in others.
            description:
              - >-
                It is not the first time dark days have come to Ravenheart. The people will survive — God will ensure it. During this difficult transition, ensure you serve as a shining example of goodness. Evil can only be held back with Truth — do not stoop to violence or zealotry.
              - >-
                Care for the needy, lend an ear, and kindle goodness in others. Pay visits to the Fortress. Practice pacifism or support the Inquisition.
              - >-
                Along with the Bishop, you have the power to dispel negative Tags of the psychological kind — the person must first confess to you, then spend a whole day in prayer (2 Efforts).
            difficulty: easy
            multiple: true
            weight: 3
            starting_resources: 1
            starting_zone: town
            starting_tags:
              - Cathedral Key
              - Ravenhearter
              - Chaplain
              - Pious
              - Literate
              - Post-Christian
              - Superstitious
            doc_elements:
              - townstarting
              - postchristianity
              - church
          scholastic:
            name: Scholastic
            intro: >-
              You are a servant of the truth, delving to places no other man would. Contemplate, search for knowledge — occult or otherwise — and write your magnum opus.
            description:
              - >-
                Earth is a speck in the infinite firmament. You have always been humbled — or perhaps energized — by the Truth. Try to understand it. Search for knowledge — occult or otherwise — and write your magnum opus. Be a hermit or preach on the streets. Whether you wake others up or not, ensure you yourself _never_ fall asleep.
            difficulty: normal
            multiple: true
            weight: 1
            starting_resources: 1
            starting_zone: town
            starting_tags:
              - Cathedral Key
              - Ravenhearter
              - Literate
              - Post-Christian
              - Superstitious
            doc_elements:
              - townstarting
