      - name: The Town
        slug: the-town
        roles:
          - name: Headman
            slug: headman
            intro: >-
              Lead the Town. Ensure it works and pays its taxes.
            description:
              - >-
                On certain days, you hike up the mountain and behold the Town. Those are the people that are beholden to you. You cannot afford to let them down, Headman!
              - >-
                Your main job is to tax people. You are beholden to the Meister, the Baron's taxman, and things have gotten nasty in the past when the tithe didn't meet his expectations. If the Silo's not full next time he comes, it won't be a pretty day. You tax people by using the Transfer Resources button. Speak to them to communicate how much you should be taking. For convenience, Transfer Resources allows you to take from anyone without them having to send it toyou—but flavor wise, you should make sure you have permission.
              - >-
                Laborers produce far more than they need to eat. Take everything they have, and call the Sheriff if they won't budge.
              - >-
                You also owe some tax to the Bishop.
              - >-
                The Sheriff is on your payroll.
              - >-
                If the Watch do a bit of racketeering or take bribes in town, look the other way, as you always have.
            difficulty: hard
            multiple: false
            starting_resources: 1
            starting_zone: town
            leader: true
            starting_tags:
              - Ravenhearter
              - Insightful
              - Old
              - Laborer (Skilled)
              - Laborer (Farming)
              - House
              - Literate
              - Headman's Cap
            doc_elements:
              - townstarting
              - farming
              - ravenhearteconomy
          - name: Sheriff
            slug: sheriff
            intro: >-
              Keep the peace in the Town, six-shooter at your hip.
            description:
              - >-
                On certain days, you hike up the mountain and behold the Town. Those are the people that are beholden to you. You cannot afford to let them down, Sheriff!
              - >-
                You have a trusty .45 six-shooter, a reject from the Fortress's armory.
            difficulty: normal
            multiple: true
            weight: 1
            starting_resources: 1
            starting_zone: town
            starting_tags:
              - Ravenhearter
              - Melee (Basic)
              - Ranged (Basic)
              - Neoclassic R&W10
              - Cudgel
              - House
              - Sheriff's Badge
            doc_elements:
              - townstarting
              - combat
          - name: Metalsmith
            slug: metalsmith
            intro: >-
              Forge anything from basic tools to siege implements and legendary weapons.
            description:
              - >-
                With smithing, you are only limited by your Resources and your creativity. You can make weapons, but you can also make armor, tools, siege equipment, sculptures...
              - >-
                You're not on the Headman's payroll, so it's important you find clients so that you can feed yourself.
              - >-
                The theory is important. Axes are good at breaking shields; blunt weapons harm people even in full armor; swords excel in one-to-one combat.
              - >-
                Simple tools and weapons are cheap and quick; a moderate or high-quality piece — a proper sword, a breastplate — costs more of both, and something truly exceptional costs more still. Check the smithing price list for exact numbers.
              - >-
                You can also make Unique Tags—name and describe them yourself. You'll have to roll to see what the quality ends up being.
            difficulty: normal
            multiple: true
            weight: 2
            starting_resources: 20
            starting_zone: town
            starting_tags:
              - Ravenhearter
              - Smithing
              - House
            doc_elements:
              - townstarting
              - smithing
              - combat
              - independent
          - name: Peasant
            slug: peasant
            intro: >-
              You're a peasant. Make a living at day, live your life at night.
            description:
              - >-
                Peasantry—the unlimitedness of knowing you are not being watched, because you are one of Many. You are free, in a way. You must feed yourself and pay your taxes, but what else? It is time to choose a path. Fulfill your Desires or become honest and authentic—choose a life, build it, and protect it.
              - >-
                Naturally, you must work during the Dawn, but you are encouraged to experiment with what you do at Dusk.
              - >-
                You start as a skilled Laborer—and a farmer, producing best of all in the Town's fields. Your laboring can be flavored in any way you want: herding, foraging, hunting. Or find your own trade.
            difficulty: easy
            multiple: true
            weight: unlimited
            starting_resources: 1
            starting_zone: town
            starting_tags:
              - Ravenhearter
              - Laborer (Skilled)
              - Laborer (Farming)
              - Shack
            doc_elements:
              - townstarting
              - production
              - independent
          - name: Herald
            slug: herald
            intro: >-
              Tell the news, take messages, and hope either the Baron or the Headman will pay you.
            description:
              - >-
                Done rightly, your job can be quite profitable—particularly if you're willing to spy and play the information game.
              - >-
                Many people are willing to divulge their secrets. Lend an ear, and you'll be surprised at what you pick up.
              - >-
                Since it takes 1 Turn to travel between Zones—and most people aren't making the trip back and forth anyways—information's not instant. The Baron, the Headman, or even the Hand might like to know what's happening on the other side of Ravenheart.
            difficulty: easy
            multiple: true
            weight: 1
            starting_resources: 1
            starting_zone: town
            starting_tags:
              - Ravenhearter
              - Literate
            doc_elements:
              - townstarting
              - independent
          - name: Outsider
            slug: outsider
            intro: >-
              Nature garbs you. Live on the outskirts, free and independent.
            description:
              - >-
                Live on the outskirts, free and independent.
              - >-
                You are aware of the Goddess of Nature, Sylva. Some still worship her in Ravenheart. It is up to you to follow the Church or stick to the oldways.
              - >-
                Forage and heal as a Healer (Medical (Basic), Brewing (Basic)), or track game as a Hunter (the Laborer skills)—both still Forester at heart. Tick Labor on your Move and flavor it as hunting; the Forest is the Town's hunting ground.
            difficulty: easy
            multiple: true
            weight: 2
            starting_resources: 2
            starting_zone: town
            extra_starting_points: 7
            starting_tags:
              - Ravenhearter
              - Laborer (Basic)
              - Forester
              - Old Ways (Sylvia)
            doc_elements:
              - townstarting
              - production
              - medical
              - independent
          - name: Mortus
            slug: mortus
            intro: >-
              Bring spirits to peace and feed the Lifeweb.
            description:
              - >-
                You have two jobs, both of them sacred: 1. feed the Lifeweb and 2. bury people, bringing their souls to peace.
              - >-
                The Mortii take a lifelong vow dedicating themselves to powering the Lifeweb. They are often exiles, outcasts, or infirms. Why did you take the vow?
              - >-
                The Lifeweb maintains Ravenheart's environment. Without it, it'll fade into the wastelands. However, it is powered by human blood. People can either voluntarily donate their blood to feed it for a short time—or you can kidnap people and feed them manually. Dead bodies cannot be fed to the Lifeweb. Dead bodies can, however, be buried to bring the person's soul to peace—it takes a Routine move (hard to dig the pit).
              - >-
                Any crimes you commit in service of your vow are not crimes.
              - >-
                You are allowed to loot whatever corpses you find. That's how the Mortus traditionally sustain themselves, but if dead people are scarce, you can ask the Headman for some food.
            difficulty: easy
            multiple: true
            weight: 3
            starting_resources: 1
            starting_zone: town
            starting_tags:
              - Ravenhearter
              - Mortus
              - Mortus Rags
              - Melee (Basic)
              - Cudgel
            doc_elements:
              - townstarting
              - lifeweb
              - respawning
          - name: Bum
            slug: bum
            intro: >-
              You live in a shell and sleep with the dogs, but you understand life (or think you do).
            description:
