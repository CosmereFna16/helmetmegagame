  - name: Caves
    situation:
      - >-
        The Caves: Migrants make it to the Fortress from here.
    factions:
      the-company:
        name: The Company
        silo: cargo-bay
        roles:
          merchant:
            name: Merchant
            intro: >-
              Make your fortune buying and selling Tags.
            description:
              - >-
                Its poor souls are a great source of business, but Ravenheart is a terrible place otherwise. You wouldn't dare put your heart here — the place is doomed. Time to make some money.
              - >-
                Your Depot sits in the Customs, down inside the Caverns: a hangar door up in the ceiling and a shuttle you call down through it. Your Licence runs the place. There's a mini-turret, almost always off, and it does not read papers — it reads faces. It will not fire on yours. It will fire on everyone else's, including your Dockers, and including you if you are wearing somebody else's. ‡
              - >-
                You deal in obols (¢), not ⬢. You are the only place they come from and the only place they go back to. You can buy at the Depot's price and sell it at whatever makes sense for profit. ‡ You can also buy things from Ravenheartians and sell them to the Depot: brews, ore, cave fungus, smithing production, paintings. {tag:ravenheart-red} and paintings especially fetch a good price.
              - >-
                The Company will advance you up to 75 ¢ against the business. Your licence will be revoked if you fail to pay it. ‡
              - >-
                Try your hand at usury. Lend at high rates and call on your Dockers to collect. That's probably the easiest way to make serious bucks.
              - >-
                Taking the shuttle instead of the Railroad like a normal migrant costs 30 ⬢. And you have to have your license.
            difficulty: hard
            multiple: false
            starting_resources: 10
            starting_zone: caves
            leader: true
            whitelist: true
            starting_tags:
              - Cart
              - Literate
              - Merchant's Garb
              - Merchant's License
              - Depot Keycard
              - Silencer
              - Obol x20
            doc_elements:
              - godking
              - squeeze
              - townstarting
          docker:
            name: Docker
            intro: >-
              Serve the Merchant and get drunk during the night.
            description:
              - >-
                Serve the Merchant and get drunk during the night. Maybe he'll let you get a ride on his spaceship if things ever get bad around here.
              - >-
                You are the legs of his business. The Depot is at the bottom of the Caves and his customers are not, so somebody carries the goods up and the money down — that is you. Somebody also collects from the people who owe him. That is also you.
              - >-
                One warning about the Depot: the mini-turret does not recognise your keycard, or anybody's. It recognises the Merchant's face. Yours is not his. ‡
            difficulty: easy
            multiple: true
            weight: 2
            starting_resources: 1
            starting_zone: caves
            starting_tags:
              - Depot Keycard
            doc_elements:
              - townstarting
              - merchant
      unaffiliated:
        name: Unaffiliated
        roles:
          migrant:
            name: Migrant
            intro: >-
              Make it to the fortress.
            description:
              - >-
                Make it to the fortress.
            difficulty: easy
            multiple: true
            weight: unlimited
            starting_resources: 1
            starting_zone: caves
            starting_tags: [Pale]
            doc_elements: [caving]
          mercenary:
            name: Mercenary
            intro: >-
              Sell your sword or delve into the caves for pay.
            description:
              - >-
                No one's going to pay you. It's therefore your responsibility to provide for yourself. There's a few ways to do that: selling your sword to someone or going into the caves, fetching loot, and selling it to the Merchant or the Sanctuary. Trust me, the Sanctuary loves cave fungus!
              - >-
                If you'd prefer the virtuous angle, you can be a hedge knight instead.
            difficulty: normal
            multiple: true
            weight: 2
            starting_resources: 4
            starting_zone: caves
            starting_tags:
              - Melee (Basic)
              - Ranged (Basic)
              - Butcher
              - Dagger
              - Battle Axe
              - Mail Shirt
              - Buckler
              - Mail Coif
              - Shortbow
            doc_elements: [caving]
  - name: Marshes
    situation:
      - >-
        A shipment of Squeeze is overdue at the Depot. The Merchant has stopped asking politely, and the Baron has started asking at all.
      - >-
        Two refugees walked off in the night and did not come back. Nobody at the Factory seems troubled by it, which is the troubling part.
      - >-
        Something has been getting into the vats. The Godflesh comes out of the marsh dead; what is in the boiling room at night is not.
    factions:
      the-factory:
        name: The Factory
        # Godard is one of the Baron's cadet houses, which is the whole
        # reason the money goes up to the Keep rather than staying here.
        parent: The Court
        silo: logistics-room
        roles:
          banneret:
            name: Banneret
            intro: >-
              As the Baron’s cousin, begrudgingly serve Ravenheart by organizing the production of the valuable Squeeze and selling it to the merchant.
            description:
              - >-
                You are one of Ravenheart’s cadet houses, carrying only a fraction of the prestige and responsibility.
              - >-
                You have been charged with Godard Factory. While usually looked down upon as a piece of marsh scum, it is very valuable: Squeeze is how Ravenheart obtains obols, functionally funding its warchest.
              - >-
                Your whole operation relies on your communication with the merchant and the Keep. It’s your job to go to crate the Squeeze, load it on the cart, and sell it to the merchant—or you can let the Geschef do it. But make sure you’re getting a good price. Keep some to pay your employees and give the rest to the Baron, lest the Watch come knocking.
              - >-
                Keep your refugees happy with {tag:moonshine}, but also by paying them fair wages. They should make more than commoners—after all, you can afford to pay them. Or just don’t pay them and keep them in line.
              - >-
                Make sure everyone’s wearing their armored gloves. So many hands lost. Oh, and emphasize to your workers—do not eat the Squeeze! You can’t afford to repeat what happened last time…
            difficulty: hard
            multiple: false
            starting_resources: 4
            starting_zone: marshes
            starting_location: factory
            leader: true
            whitelist: true
            starting_tags:
              - Horse
              - Cart
              - Nobility
              - Brigandine
              - Sabre
              - Bore Pistol
              - Melee (Basic)
              - Ranged (Basic)
              - Armored Gloves
              - Factory Key
              - Banneret's Key
            doc_elements:
              - godking
              - godardfactory
              - squeeze
              - ravenhearteconomy
          geschef:
            name: Geschef
            intro: >-
              Organize operations while the Banneret goes to see the merchant. If the refugees get rowdy, hit them with a stick.
            description:
              - >-
                Your whole operation relies on your communication with the merchant and the Keep.
              - >-
                You’ve survived this operation long enough to become the general manager. A good place to be. You can treat some of the wounds that will surely come and brew the workers Moonshine to keep them happy.
              - >-
                Make sure everyone’s wearing their armored gloves. So many hands lost. Oh, and emphasize to your workers—do not eat the Squeeze! You can’t afford to repeat what happened last time…
            difficulty: normal
            multiple: false
            starting_resources: 4
            starting_zone: marshes
            starting_location: factory
            starting_tags:
              - Tough
              - Old
              - Cudgel
              - Padded Armor
              - Melee (Basic)
              - Brewing (Basic)
              - Medical (Basic)
              - Cooking (Basic)
              - Cleaning Powder
              - Armored Gloves
              - Factory Key
              - Banneret's Key
            doc_elements:
              - godardfactory
              - medical
          refugee:
            name: Refugee
            intro: >-
              Cut Godflesh out of the marsh for a man who can replace you. Or don’t, and make it to the town.
            description:
              - >-
                Extracting is dangerous, because the Godflesh is a living thing with swarming mouths that try to eat you. You run a risk of getting wounded. ‡
              - >-
                On the upside, working at the Factory gives you a chance of social mobility—a good Banneret will pay you much more than the average commoner would make, if only to keep you around.
              - >-
                Most refugees don’t stay for long and usually try to make it to the town. You are easily replaced, so it doesn’t matter. ‡
            difficulty: easy
            multiple: true
            weight: 3
            starting_resources: 1
            starting_zone: marshes
            starting_location: factory
            starting_tags:
              - Laboring (Basic)
              - Hatchet
              - Cleaning Powder
              - Armored Gloves
              - Factory Key
            doc_elements:
              - godardfactory

  - name: Black Hills
    situation:
      - >-
        A tax caravan bound for the Fortress never arrived, and the road it took is one nobody has walked since. The Baron has not said the word brigand out loud. ‡
      - >-
        Hunters who work the hills have started coming back a day early, and none of them will say why. The ones who do say anything mention the ravine. ‡
      - >-
        Somebody has been leaving cuts in the bark at shoulder height, in marks the town cannot read. They are fresher than they were last week. ‡
    factions:
      brigands:
        name: Brigands
        silo: ravine-camp
        roles:
          brigand-leader:
            name: Brigand Leader
            intro: >-
              You raided a shipment on the way to the Fortress — well done!
            description:
              - >-
                Some call you scum. But what do they know of freedom?
              - >-
                The Brigand Leader is given the sacred task of organizing his small band of scrappy men. Keep them in line; earn their loyalty, buy them booze, or bully them into submission. Also, find a place to make your base.
              - >-
