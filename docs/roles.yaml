            doc_elements:
              - townstarting
          pusher:
            name: Pusher
            intro: >-
              Sell drugs, run the gambling den, peddle to people's worldly desires. Hell, hire a few bums to be your goons.
            description:
              - >-
                Sell drugs. The Abandoned Theater in the Underquarter is yours; run a gambling den.
              - >-
