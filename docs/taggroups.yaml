# Sole master for the TagGroup catalog — split out of docs/tags.yaml so
# group colors can be freeform hex rather than a fixed set of tokens. Same
# posture as docs/tags.yaml: hand-edited, `slug` is the stable match key,
# synced upsert-only by db/lib/syncTags.js#syncTagsFromYaml, which reads
# this file and docs/tags.yaml together and never deletes on its own — a
# separate, opt-in `npm run db:prune-tags` prunes tags absent from
# docs/tags.yaml and, once no surviving tag sits in them, groups absent
# from this file too — see docs/systemdocs/SYNC.md §3b, docs/tags.yaml's
# header and docs/systemdocs/TAGS.md.
#
# Entries are keyed by slug (`general-traits:`, not `- slug: general-traits`)
# — see docs/tags.yaml's header for why, and db/lib/yamlEntries.js.
#
# Per-group fields:
#   category    - must match one of the category slugs declared in
#                 docs/tags.yaml's `categories:` list.
#   color       - freeform hex color (e.g. "#81a4d7") used to tint every tag
#                 chip in this group — the 3px left rule ChipLabel.js draws.
#                 Omit for an uncolored group. Not theme-aware (the chip sits
#                 on --field-bg, see web/app/globals.css), so it answers to
#                 THE PALETTE below rather than to taste.
#   requiredTag - optional slug of a Tag that gates every tag in this group
#                 (see docs/tags.yaml's requiredTag docs for the same idea
#                 at the single-tag level). This is the "hidden category"
#                 mechanism: a category whose every group is gated has no tab
#                 at all in the point-buy and Add Tag menus, and its tags are
#                 withheld from /api/tags, until the character holds the
#                 required tag. Enforced in web/lib/characterCreation.js
#                 (requirementSatisfied), and re-checked server-side by
#                 createCharacter and addTagRequest.
#
# THE PALETTE — keep it, or the character sheet goes motley again:
#   * One hue family per CATEGORY, so a sheet reads by category at a glance:
#     General blue/indigo, Skills green, Status amber, Health red, Items teal,
#     Demoness magenta — and Assets the one grey (stone) family.
#   * Groups inside a category step by LIGHTNESS and SATURATION, never out of
#     the hue. Health is the tightest on purpose: all seven read as one red.
#   * No two categories share a hue. Status and Health both carry bad news, so
#     amber-vs-red is the split keeping them apart; do not warm Status further.
#   * Every value clears 3:1 (WCAG 1.4.11, non-text UI) on BOTH the dusk and
#     dawn chip backgrounds — worst case --field-bg over --surface-raised,
#     where the tightest here measures 3.44. Check the numbers before adding.
groups:
  general-traits:
    name: Traits
    category: general
    color: "#81a4d7"
  general-social:
    name: Social
    category: general
    color: "#8479d7"
  # What a character actually believes. Ungated on purpose — a belief is not a
  # secret the way the Demoness group below is, and #info already
  # tells every player that "most people are Post-Christian, but some people
  # believe in the Old Ways".
  #
  # Wears the General blue like the rest of the category; what separates it
  # from its neighbours is tone, not hue — a muted mid slate between Traits'
  # clear steel blue and Brigands' mauve. 4.13:1 on dusk, 4.28:1 on dawn.
  general-beliefs:
    name: Beliefs
    category: general
    color: "#878fb7"
  # Desires rework (2026-08-31): the Addiction/Restriction/Interest ladder got
  # its own three groups instead of living scattered through Traits and The
  # Court. All ungated, same reasoning as Traits/Social/Beliefs — nothing here
  # is a secret.
  #
  # Personality rework (2026-09-01): Restrictions and Interests collapsed into
  # ONE group. The old split said a Restriction only ever closes the catalog
  # and an Interest only ever opens it, which made every Restriction a dead
  # end — Pacifist cost points and gave nothing back. A Personality tag is now
  # free to be negative AND open Desires nobody else can reach, so the two
  # halves stopped being different kinds of thing. Addictions stayed separate
  # because "one Addiction at a time" is a real rule, and a group is where you
  # see it.
  general-addictions:
    name: Addictions
    category: general
    color: "#6f93c9"
  # One value covering the ground the two old groups held, sitting between
  # their #7f88bd and #9db4e0 and staying inside the General blue/indigo family
  # THE PALETTE requires. 4.28:1 on dusk, 4.43:1 on dawn — comfortably clear of
  # the 3:1 floor, and of general-restrictions' 3.83 which was the tightest of
  # the two it replaces.
  general-personality:
    name: Personality
    category: general
    color: "#8a90c6"
  # Orphaned by the Personality rework above: general-personality took every
  # tag both of these held. Sync never deletes, and `db:prune-tags` only
  # prunes an empty group once it's absent from this file — so these rows
  # survive empty as long as they stay listed here, same as status-health
  # below. Don't reuse either slug, and don't put anything back in them.
  general-restrictions:
    name: Restrictions
    category: general
    color: "#7f88bd"
  general-interests:
    name: Interests
    category: general
    color: "#9db4e0"
  # Two body-membership groups, gated the same way Demoness is
  # (see the bottom of this file). Gating here rather than repeating
  # `requiredTag` on every member is the established idiom, and it means a
  # player who isn't in the body never sees the group at all. Unlike Demoness
  # these sit in the `general` category, which stays visible
  # because general-traits and general-social are ungated.
  general-watch:
    name: The Watch
    category: general
    color: "#5e84c1"
    requiredTag: watchman
  general-brigand:
    name: Brigands
    category: general
    color: "#8f7aad"
    requiredTag: brigand
  # Third body-membership group: the Baron's court, gated behind the free
  # `courtier` tag every court role starts with.
  general-court:
    name: The Court
    category: general
    color: "#aaace4"
    requiredTag: courtier
  # Orphaned: the Health category below took every tag that used to live
  # here. Sync never deletes, and `db:prune-tags` only prunes an empty group
  # once it's absent from this file — so this row survives empty as long as
  # it stays listed here. Don't reuse the slug, and don't put anything back
  # in it.
  status-health:
    name: Health
    category: status
    color: "#c6af8b"
  status-food:
    name: Food
    category: status
    color: "#d4ba67"
  status-buffs:
    name: Buffs
    category: status
    color: "#e4d6aa"
  status-debuffs:
    name: Debuffs
    category: status
    color: "#bf9453"
  items-food:
    name: Food
    category: items
    color: "#8bcace"
  # Tonic is its own group rather than a corner of Food: the catalog is a
  # supply chain (fungus -> Bliss, grain -> Alcohol -> the Red) and the
  # tonics above it are nothing like a meal. See the Alcohol & Drugs
  # document in docs/documents.yaml.
  items-drink:
    name: Tonic
    category: items
    color: "#5ab3ce"
  items-gear:
    name: Gear
    category: items
    color: "#71a4a4"
  items-armor:
    name: Armor
    category: items
    color: "#8faab7"
  # The exotic tier: relics, grafts and machinery that don't belong to the
  # low-fantasy surface of the game. Kept apart from Gear so a player reading
  # their sheet can tell at a glance which of their possessions are ordinary.
  items-special:
    name: Special
    category: items
    color: "#a9d0e5"
  items-weapons:
    name: Weapons
    category: items
    color: "#56bdaf"
  # --- Health ------------------------------------------------------------
  # Every affliction a doctor might treat, split by what KIND of medicine it
  # wants rather than by severity — severity is carried by the tag's own
  # requirement block (the cure ladder, docs/systemdocs/TAGS.md §5c). The
  # whole category is ONE red on purpose, split only by tone: blood red for
  # wounds, rust for rot, rose for fever, dusky mauve for the head, ash for
  # what can't be undone, pale pink for the trivial, apricot for recovery.
  health-wounds:
    name: Wounds
    category: health
    color: "#d35e64"
  health-infection:
    name: Infection
    category: health
    color: "#b9725f"
  health-illness:
    name: Illness
    category: health
    color: "#d3838c"
  health-maiming:
    name: Maiming
    category: health
    color: "#bea6a8"
  health-mind:
    name: Mind
    category: health
    color: "#aa7486"
  health-minor:
    name: Ailments
    category: health
    color: "#e5a9b3"
  health-recovery:
    name: Recovery
    category: health
    color: "#d89f90"
  assets-property:
    name: Property
    category: assets
    color: "#c9c5be"
  assets-companions:
    name: Companions
    category: assets
    color: "#a48d7c"
  # Skill families, clustered the same way General and Status already are.
  # A handful of standalone Skills tags (intercom, forester,
  # musician, lockpicking, butcher, climbing, navigating, stealth) stay
  # groupless on purpose — they don't
  # belong to any family and would just be noise in a one-tag group.
  skills-labor:
    name: Labor
    category: skills
    color: "#bed78f"
  skills-fighting:
    name: Combat
    category: skills
    color: "#8fd4a8"
  skills-crafting:
    name: Crafting
    category: skills
    color: "#93b261"
  skills-brewing:
    name: Brewing
    category: skills
    color: "#6eaa78"
  skills-cooking:
    name: Cooking
    category: skills
    color: "#79d070"
  skills-medical:
    name: Medical
    category: skills
    color: "#b8d5c3"
  # --- Gated groups ------------------------------------------------------
  # These carry `requiredTag`, which is what makes the Demoness category
  # hidden. Every tag in it is gated by the group, so the tags themselves
  # deliberately do NOT repeat `requiredTag` — the gate is written once here.
  demoness:
    name: Demoness
    category: demoness
    color: "#d26dad"
    requiredTag: demoness