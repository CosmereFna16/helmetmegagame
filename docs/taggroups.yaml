# Sole master for the TagGroup catalog — split out of docs/tags.yaml so
# group colors can be freeform hex rather than a fixed set of tokens. Same
# posture as docs/tags.yaml: hand-edited, `slug` is the stable match key,
# synced upsert-only (never deletes) by db/lib/syncTags.js#syncTagsFromYaml,
# which reads this file and docs/tags.yaml together — see docs/tags.yaml's
# header and docs/systemdocs/TAGS.md.
#
# Per-group fields:
#   category    - must match one of the category slugs declared in
#                 docs/tags.yaml's `categories:` list.
#   color       - freeform hex color (e.g. "#6fa8ab") used to tint every tag
#                 chip in this group (TagChip.js). Omit for an uncolored
#                 group. Not theme-aware — pick a value that reads on both
#                 the dusk and dawn backgrounds (see web/app/globals.css).
#   requiredTag - optional slug of a Tag that gates every tag in this group
#                 (see docs/tags.yaml's requiredTag docs for the same idea
#                 at the single-tag level). This is the "hidden category"
#                 mechanism: a category whose every group is gated has no tab
#                 at all in the point-buy and Add Tag menus, and its tags are
#                 withheld from /api/tags, until the character holds the
#                 required tag. Enforced in web/lib/characterCreation.js
#                 (requirementSatisfied), and re-checked server-side by
#                 createCharacter and addTagRequest.
groups:
  - slug: general-traits
    name: Traits
    category: general
    color: "#6fa8ab"
  - slug: general-social
    name: Social
    category: general
    color: "#9c88c4"
  # Two body-membership groups, gated the same way Demoness and Bacchus are
  # (see the bottom of this file). Gating here rather than repeating
  # `requiredTag` on every member is the established idiom, and it means a
  # player who isn't in the body never sees the group at all. Unlike Demoness
  # and Bacchus these sit in the `general` category, which stays visible
  # because general-traits and general-social are ungated.
  - slug: general-watch
    name: The Watch
    category: general
    color: "#8a9bb5"
    requiredTag: watchman
  - slug: general-brigand
    name: Brigands
    category: general
    color: "#a87351"
    requiredTag: brigand
  # Third body-membership group: the Baron's court, gated behind the free
  # `courtier` tag every court role starts with.
  - slug: general-court
    name: The Court
    category: general
    color: "#b89a5e"
    requiredTag: courtier
  # Orphaned: the Health category below took every tag that used to live
  # here. Groups sync upsert-only and are never deleted, so this row survives
  # empty — don't reuse the slug, and don't put anything back in it.
  - slug: status-health
    name: Health
    category: status
    color: "#c97a86"
  - slug: status-food
    name: Food
    category: status
    color: "#cf9f56"
  - slug: status-buffs
    name: Buffs
    category: status
    color: "#8bab76"
  - slug: status-debuffs
    name: Debuffs
    category: status
    color: "#7f92a3"
  - slug: items-food
    name: Food
    category: items
    color: "#cf9f56"
  # Tonic is its own group rather than a corner of Food: the catalog is a
  # supply chain (fungus -> Bliss, grain -> Alcohol -> the Red) and the
  # tonics above it are nothing like a meal. See the Alcohol & Drugs
  # document in docs/documents.yaml.
  - slug: items-drink
    name: Tonic
    category: items
    color: "#8c5566"
  - slug: items-gear
    name: Gear
    category: items
    color: "#a08a70"
  - slug: items-armor
    name: Armor
    category: items
    color: "#7c8794"
  # The exotic tier: relics, grafts and machinery that don't belong to the
  # low-fantasy surface of the game. Kept apart from Gear so a player reading
  # their sheet can tell at a glance which of their possessions are ordinary.
  - slug: items-special
    name: Special
    category: items
    color: "#7a6f9c"
  - slug: items-weapons
    name: Weapons
    category: items
    color: "#9c6b5a"
  # --- Health ------------------------------------------------------------
  # Every affliction a doctor might treat, split by what KIND of medicine it
  # wants rather than by severity — severity is carried by the tag's own
  # requirement block (the cure ladder, docs/systemdocs/TAGS.md §5c). Reds
  # and browns for damage, greens for rot and sickness, greys for what can't
  # be undone, blues for the head, and one warm tone for convalescence.
  - slug: health-wounds
    name: Wounds
    category: health
    color: "#b5555f"
  - slug: health-infection
    name: Infection
    category: health
    color: "#7d8f4e"
  - slug: health-illness
    name: Illness
    category: health
    color: "#8d7ab5"
  - slug: health-maiming
    name: Maiming
    category: health
    color: "#82828c"
  - slug: health-mind
    name: Mind
    category: health
    color: "#5f86a8"
  - slug: health-minor
    name: Ailments
    category: health
    color: "#c0a06a"
  - slug: health-recovery
    name: Recovery
    category: health
    color: "#6fa8ab"
  - slug: assets-property
    name: Property
    category: assets
    color: "#8e94a8"
  - slug: assets-companions
    name: Companions
    category: assets
    color: "#7fa38b"
  # --- Gated groups ------------------------------------------------------
  # These all carry `requiredTag`, which is what makes the Demoness and
  # Bacchus categories hidden. Every tag in them is gated by the group, so the
  # tags themselves deliberately do NOT repeat `requiredTag` — the gate is
  # written once here.
  - slug: demoness
    name: Demoness
    category: demoness
    color: "#c98bb0"
    requiredTag: demoness
  - slug: bacchus
    name: Bacchus
    category: bacchus
    color: "#9c6fb8"
    requiredTag: follower-of-bacchus
  # The Cult tier ladder (Seedling -> Ripening -> Bountiful) plus the Cult
  # Leader seat. These are Meta tags — 0 points, never purchasable, granted by
  # a GM — but they live in a gated group rather than groupless like the rest
  # of Meta, because /api/tags withholds a tag only when its GROUP carries a
  # requiredTag. Groupless would ship the whole cult ladder to every signed-in
  # client, which is exactly the leak that route's header comment exists to
  # close. No `color`, so the chips stay uncoloured like the rest of Meta.
  - slug: meta-cult
    name: Cult
    category: meta
    requiredTag: follower-of-bacchus
  # Empty for now: the powers a growing cult unlocks land here, gated by the
  # ladder rung that opens them. Groups sync upsert-only and are never
  # deleted, so these slugs are fixed from here on.
  - slug: bacchus-ripening
    name: Ripening
    category: bacchus
    color: "#9c6fb8"
    requiredTag: cult-ripening
  - slug: bacchus-bountiful
    name: Bountiful
    category: bacchus
    color: "#9c6fb8"
    requiredTag: cult-bountiful
