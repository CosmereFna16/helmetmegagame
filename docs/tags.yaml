  # --- Bacchus --------------------------------------------------------------
  # The Cult's own powers. Gated by group, not by tag: `bacchus` requires
  # `follower-of-bacchus`, `bacchus-ripening` requires `cult-ripening`,
  # `bacchus-bountiful` requires `cult-bountiful` (docs/taggroups.yaml), so
  # none of the tags below repeat a requiredTag for that gate — same posture
  # as the `demoness` group above.
  #
  # Spell/Rite naming: the display name carries the "Spell:"/"Rite:" prefix so
  # it can never collide with the status it inflicts on someone else (Rite:
  # Rage vs. the Rage status a victim ends up holding) — documents.yaml
  # assigns by tag NAME, and two rows sharing one is a coin toss.
  #
  # Cooldown markers: a spell with a stated cooldown lists ITSELF plus a
  # `<name>-expired` marker in consumesInto. dropCharacterTag runs before
  # grantTagSlugs in consumeTagRequestImpl, so the caster keeps the spell and
  # picks up the marker in the same transaction — same idiom as the potion at
  # requestEffects.js. Markers carry no description (optional field) and sit
  # outside the Spell:/Rite: naming, since nobody reads them as a chip.
  #
  # A status a spell inflicts on someone ELSE — who is usually not a cultist —
  # is NOT gated: a gated group would render as literal `{tag:slug}` text to
  # its own holder and inspect would withhold it. Same for the Bacchus
  # craftables, which get traded to non-cultists.
  - slug: spell-nourishment
    name: "Spell: Nourishment"
    category: bacchus
    group: bacchus
    description: "Once every 2 turns, touch someone else. Grant them {tag:ate-meal}. | vory ysm lechem, wa oryy"
    pointCost: 5
    purchasable: true
    purchasableAfterStart: true
    removable: true
    consumable: true
    consumesInto: [spell-nourishment, nourishment-expired]
