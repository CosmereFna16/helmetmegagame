  # Inflicted, never chosen: a GM grants these (a Demoness true form is the
  # usual source), and the expiry sweep in resolveNeeds() clears them if left
  # alone. A medic can cut that short — every requirement block below is the
  # cure cost, and is GM adjudication reference shown to players, not
