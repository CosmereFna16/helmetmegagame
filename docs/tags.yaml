  # A creation-only bundle rather than a thing you carry: it sits on the sheet
  # until the player unpacks it from their own character sheet (see consumable
  # in this file's header). Not tradeable or stackable — there's nothing to
  # hand over, and buying two would just collapse into one.
  - slug: starting-wares
    name: Starting Wares
    category: items
    group: items-gear
    description: "Goods you came in with, still crated. Unpack them whenever you like. [This is a small trader's stock, should you wish to go into business. Its real value is in what you can talk somebody into paying for it.]"
    pointCost: 14
    tradeable: true
    purchasable: true
    purchasableAfterStart: false
    consumable: true
    # Priced by what it unpacks into, the rule TAGS.md §4a sets for every
    # consumable and the rule this tag was caught breaking once already:
    # 2 Jewelry (1 pt each) + Instant Camera (1) + Sword Cane (3) = 6 pt.
    #
    # The 0-pt goods after those cost nothing on the scale and are the point
    # of the rebuild — a would-be trader now opens the crate onto actual
    # stock to haggle over, instead of a revolver. The comforts among them are
    # ordinarily Depot-only (docs/systemdocs/DEPOT.md §3), which is exactly
    # right: you brought them in with you, the same way the Merchant does.
    # Nothing here is hardware, so this is not a back door to his real shelf.
    consumesInto:
      - jewelry
      - jewelry
      - instant-camera
      - sword-cane
      - old-coin
      - old-coin
      - tea
      - coffee
      - sake
      - sweets

