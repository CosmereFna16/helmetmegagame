  # --- Status -----------------------------------------------------------
  # Happy/Unhappy are the Mood system (docs/systemdocs/REQUESTS.md §4).
  # Deliberately purchasable: false / removable: false so they never appear in
  # any player-facing tag picker — the only ways in are the Set Mood button on
  # the character sheet and a GM. "Neutral" is the absence of both, not a tag.
  - slug: happy
    name: Happy
    category: status
    group: status-buffs
    description: "+1 to the die on all Gambits. Wears off after 2 turns."
    pointCost: 0
    purchasable: false
    purchasableAfterStart: false
    removable: false
    durationTurns: 2

  - slug: unhappy
    name: Unhappy
    category: status
    group: status-debuffs
    description: "-1 to the die on all Gambits. Wears off after 2 turns."
    pointCost: 0
    purchasable: false
    purchasableAfterStart: false
    removable: false
    durationTurns: 2

  - slug: ate-meal
    name: Ate Meal
    category: status
    group: status-food
    description: "Won't go hungry next turn, and owes no upkeep this turn — ate a proper meal."
    pointCost: 0
    purchasable: false

  # Granted automatically by the per-turn upkeep pass (db/lib/hungerPass.js,
  # called from resolveNeeds) — never by a player or a picker, hence
  # purchasable/removable false, same as Happy/Unhappy. Deliberately no
  # durationTurns on Ate Meal above: it must NOT be swept, because the pass
  # consumes it explicitly.
  #
  # durationTurns: 1 means a Hunger granted while closing turn N carries
  # expiresTurn N+1 — it bites for exactly turn N+1 and is swept when N+1
  # closes.
  - slug: hunger
    name: Hungry
    category: status
    group: status-debuffs
    description: "-1 to the die on all Gambits. You went without food this turn."
    pointCost: 0
    purchasable: false
    purchasableAfterStart: false
    removable: false
    durationTurns: 1

  - slug: tipsy
    name: Tipsy
    category: status
    group: status-debuffs
    description: "Immune to Unhappy for 4 turns. Slightly worse at combat."
    pointCost: 0
    purchasable: false

  - slug: drained
