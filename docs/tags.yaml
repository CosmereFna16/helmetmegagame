    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    durationTurns: 2
    expiresInto: [dying]
    requirement:
      turnsCost: 1
      resourceCost: 6
      skills: [medical-skilled]

  - slug: broken-bone
    name: Broken Bone
    category: health
    group: health-wounds
    description: "Snapped clean, and grinding when you forget and lean on it. It will not knit straight on its own, ever — it wants setting and splinting by someone who knows how, or you keep it crooked for good."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    requirement:
      turnsCost: 1
      resourceCost: 2
      skills: [medical-skilled]

  - slug: cracked-ribs
    name: Cracked Ribs
    category: health
    group: health-wounds
    description: "Every breath is a decision. Nothing shows from the outside, which is exactly why people walk around on them for weeks — a doctor knows at a glance what everyone else takes for a bad mood."
    pointCost: 0
    purchasable: false
    purchasableAfterStart: false
    removable: true
    requirement:
      turnsCost: 1
      resourceCost: 2
      skills: [medical-skilled]

  - slug: dislocated-shoulder
    name: Dislocated Shoulder
    category: health
    group: health-wounds
    description: "The arm hangs wrong and won't be argued with. Someone who has done it before can put it back in a moment; nobody who hasn't should try. Left out, it stays out."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    requirement:
      resourceCost: 1
      skills: [medical-basic]

  - slug: frostbite
    name: Frostbite
    category: health
    group: health-wounds
    description: "Waxy white fingers and toes with no feeling left in them. Warmed properly and soon, they come back. Left as they are, they don't — the flesh simply dies where it stands."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    durationTurns: 3
    expiresInto: [necrosis]
    requirement:
      turnsCost: 1
      resourceCost: 2
      skills: [medical-skilled]

  - slug: punctured-lung
    name: Punctured Lung
    category: health
    group: health-wounds
    description: "Something went between the ribs, and now half of you won't fill. Every breath is shallower than the last. This is real surgery and it is not optional — a few days of this and you are dying."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    durationTurns: 3
    expiresInto: [dying]
    requirement:
      turnsCost: 1
      resourceCost: 8
      skills: [medical-expert]

  - slug: gut-wound
    name: Gut Wound
    category: health
    group: health-wounds
    description: "Opened through the belly. Whatever was supposed to stay inside your intestines is now everywhere it shouldn't be, and it is already going septic. Needs someone genuinely excellent, opening you up properly, very soon."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    durationTurns: 2
    expiresInto: [sepsis]
    requirement:
      turnsCost: 1
      resourceCost: 8
      skills: [medical-expert]

  - slug: broken-jaw
    name: Broken Jaw
    category: health
    group: health-wounds
    description: "Wired shut by the swelling alone. You cannot chew and you can barely make yourself understood. It needs setting by someone who won't leave your face where they found it."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    requirement:
      turnsCost: 1
      resourceCost: 4
      skills: [medical-skilled]

  - slug: mangled-hand
    name: Mangled Hand
    category: health
    group: health-wounds
    description: "Crushed, and the fingers are pointing in directions fingers don't. There is a window in which someone skilled can save most of it. After that window, they save what they can — which is not the fingers."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    durationTurns: 3
    expiresInto: [missing-fingers]
    requirement:
      turnsCost: 1
      resourceCost: 4
      skills: [medical-skilled]

  # --- Illness -----------------------------------------------------------
  - slug: appendicitis
    name: Appendicitis
    category: health
    group: health-illness
    description: "A hot, spiteful pain low on the right that you have been calling indigestion for two days. Nothing shows. Nobody looking at you would guess — but any real doctor prodding your belly would know instantly, and would tell you that it has to come out before it bursts."
    pointCost: -2
    purchasable: true
    purchasableAfterStart: false
    removable: true
    durationTurns: 3
    expiresInto: [sepsis]
    requirement:
      turnsCost: 1
      resourceCost: 8
      skills: [medical-expert]

  - slug: rot-lung
    name: Rot Lung
    category: health
    group: health-illness
    description: "Years of breathing whatever it is that hangs in the deep tunnels. You cough black and you cough it forever. It does not get better on its own and it does not get better with kindness — it gets better with somebody very good cutting the worst of it out."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    requirement:
      turnsCost: 1
      resourceCost: 8
      skills: [medical-expert]

  - slug: parasites
    name: Parasites
    category: health
    group: health-illness
    description: "Something is living in you and eating first. You are hungry constantly and thinner weekly, and there is nothing to see from the outside. A doctor knows the look. Purged properly it's a bad week; left alone it simply drains you."
    pointCost: 0
    purchasable: false
    purchasableAfterStart: false
    removable: true
    durationTurns: 4
    expiresInto: [drained]
    requirement:
      turnsCost: 1
      resourceCost: 2
      skills: [medical-skilled]

  - slug: poisoned
    name: Poisoned
    category: health
    group: health-illness
    description: "Sweating, shaking, guts in knots and a taste like old coins. You are weak, slow, and no use to anyone for days. It will not kill you — it just makes every hour of it wretched, and everything you try harder."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    durationTurns: 4
    requirement:
      turnsCost: 1
      resourceCost: 2
      skills: [medical-skilled]

  - slug: envenomated
    name: Envenomated
    category: health
    group: health-illness
    description: "So much pain. Something put venom in you and it is working its way through — the limb is swelling, the flesh around the bite is going bad, and unless your constitution is particularly robust this is the beginning of dying, not the end of it. Needs a surgeon, quickly."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    durationTurns: 3
    expiresInto: [dying]
    requirement:
      turnsCost: 1
      resourceCost: 8
      skills: [medical-expert]

  - slug: pox
    name: Pox
    category: health
    group: health-illness
    description: "It comes up across the face and arms in weeping clusters and everyone can see it coming up. It burns itself out in a week or so on its own — and leaves you looking like it. Treated early and properly, rather less so."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    durationTurns: 4
    expiresInto: [scarred]
    requirement:
      turnsCost: 1
      resourceCost: 4
      skills: [medical-skilled]

  # Tier 1 on the cure ladder: food and a fortnight of someone paying
  # attention. The cheapest thing on the list to undo, and the easiest to let
  # slide back.
  - slug: malnourished
    name: Malnourished
    category: health
    group: health-illness
    description: "Years of not quite enough. You bruise easily, you tire early, and you have never in your life felt strong."
    pointCost: -2
    visible: true
    purchasable: true
    purchasableAfterStart: false
    removable: true
    requirement:
      resourceCost: 1
      skills: [medical-basic]

  - slug: arthritis
    name: Arthritis
    category: health
    group: health-illness
    description: "Stiff, aching joints that seize in the cold and never quite let go. It doesn't leave, but a competent doctor can take the worst of it off you for a while."
    pointCost: -2
    visible: true
    purchasable: true
    purchasableAfterStart: false
    removable: true
    requirement:
      turnsCost: 1
      resourceCost: 2
      skills: [medical-skilled]

  # NEW (Claude) --------------------------------------------------------
  - slug: consumptive
    name: Consumptive
    category: health
    group: health-illness
    description: "A wasting cough that has been with you for years and will see you out. Good days and bad days, and the bad ones are getting closer together."
    pointCost: -4
    visible: true
    purchasable: true
    purchasableAfterStart: false
    removable: true
    requirement:
      turnsCost: 1
      resourceCost: 8
      skills:
        - medical-expert
      gambit: true

  - slug: hypothermia
    name: Hypothermia
    category: health
    group: health-illness
    description: "Past shivering and into the calm, stupid part where you stop minding the cold. Warmth, dry clothes and someone watching you is the whole treatment — and if nobody does it, this is how people are found in the morning."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    durationTurns: 3
    expiresInto: [dying]
    requirement:
      turnsCost: 1
      resourceCost: 4
      skills: [medical-skilled]

  - slug: heatstroke
    name: Heatstroke
    category: health
    group: health-illness
    description: "Dry, red, and stopped sweating some time ago. Shade and water fix it. Nothing fixing it means a couple of days of being no use at all afterwards."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    durationTurns: 2
    expiresInto: [drained]
    requirement:
      turnsCost: 1
      resourceCost: 2
      skills: [medical-skilled]

  # --- Mind --------------------------------------------------------------
  - slug: concussed
    name: Concussed
    category: health
    group: health-mind
    description: "The world arrives a half-second late and the light hurts. There is no treatment for this and there never has been — you sit somewhere dark and you wait it out."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: false
    durationTurns: 3

  - slug: shell-shocked
    name: Shell Shocked
    category: health
    group: health-mind
    description: "Something happened and part of you did not come back from it. Loud noises put you somewhere else entirely. No medicine touches this. It does not expire, and no doctor can cut it out of you."
    pointCost: 0
    purchasable: false
    purchasableAfterStart: false
    removable: false

  - slug: amnesiac
    name: Amnesiac
    category: health
    group: health-mind
    description: "There are holes. Names, faces, whole seasons. You have learned to nod along and work it out from context. Nothing brings it back and nothing makes it worse — this is simply how you are now."
    pointCost: -2
    purchasable: true
    purchasableAfterStart: false
    removable: false

  - slug: paralyzed
    name: Paralyzed
    category: health
    group: health-mind
    description: "You can't move or talk. It wears off — assuming whatever did it to you is finished with you."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: false
    durationTurns: 1

  - slug: hallucinating
    name: Hallucinating
    category: health
    group: health-mind
    description: "Nothing makes sense. What is happening?! Oh my God! It passes on its own, eventually. Someone with a steady hand and the right draught can bring you down faster."
    pointCost: 0
    purchasable: false
    purchasableAfterStart: false
    removable: true
    durationTurns: 2
    requirement:
      resourceCost: 2
      skills: [medical-basic]

  - slug: blinded
    name: Blinded
    category: health
    group: health-mind
    description: "Gone. Not dim, not blurred — gone. There is exactly one answer to this and it is the kind of thing only the Sanctuary's best would attempt: a fresh pair of eyes, from somewhere, and hands good enough to fit them. Bring both."
    pointCost: -5
    visible: true
    purchasable: true
    purchasableAfterStart: false
    removable: true
    requirement:
      turnsCost: 1
      resourceCost: 8
      skills: [medical-expert]
      gambit: true

  # The mild end of what Mute is the whole of. Permanent, so no requirement
  # block — but not `visible`, since it only shows when you speak.
  - slug: stutter
    name: Stutter
    category: health
    group: health-mind
    description: "The word is there and your mouth will not release it. Worse when you are watched, which is exactly when you need it least."
    pointCost: -1
    purchasable: true
    purchasableAfterStart: false
    removable: false

  - slug: mute
    name: Mute
    category: health
    group: health-mind
    description: "No voice. Whether it was taken or never came, it is not coming back, and no surgeon in the world is going to give you one. Write it down."
    pointCost: -4
    visible: true
    purchasable: true
    purchasableAfterStart: false
    removable: false

  # --- Maiming -----------------------------------------------------------
  # All permanent, all untreatable. Medicine's job with these ended at the
  # amputation; what's left is living with it.
  - slug: missing-leg
    name: Missing Leg
    category: health
    group: health-maiming
    description: "Taken off above the knee. You get about on a crutch and a good deal of stubbornness. Nobody is growing it back."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: false

  - slug: missing-arm
    name: Missing Arm
    category: health
    group: health-maiming
    description: "Gone at the shoulder. Half of every two-handed task in the world is closed to you now, and you have got very good at the other half."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: false

  # A crutch replaced by something that bears weight. Better off than Missing
  # Leg, which is why it prices between that and Crippled Leg — and still
  # permanent, so no requirement block.
  - slug: peg-leg
    name: Peg Leg
    category: health
    group: health-maiming
    description: "Turned oak below the knee, strapped on every morning. You walk, you work, you climb stairs slowly, and everyone hears you coming across a flagstone floor."
    pointCost: -2
    visible: true
    purchasable: true
    purchasableAfterStart: false
    removable: false

  # The severe, purchasable end of what `scarred` records for free.
  - slug: disfigured
    name: Disfigured
    category: health
    group: health-maiming
    description: "Something took the shape of your face and gave back a different one. People decide things about you before you have spoken, and they are seldom kind things."
    pointCost: -2
    visible: true
    purchasable: true
    purchasableAfterStart: false
    removable: false

  - slug: missing-fingers
    name: Missing Fingers
    category: health
    group: health-maiming
    description: "A couple short on one hand. Fiddly work is a trial and a firm grip is a memory, but you manage."
    pointCost: -1
    visible: true
    purchasable: true
    purchasableAfterStart: false
    removable: false

  - slug: crippled-leg
    name: Crippled Leg
    category: health
    group: health-maiming
    description: "It's still attached and it still hurts, which is the worst of both. You are slow, you are loud on stairs, and you are never running anywhere again — unless someone genuinely extraordinary rebuilds the whole thing, which is about as likely as it sounds."
    pointCost: -4
    visible: true
    purchasable: true
    purchasableAfterStart: false
    removable: true
    requirement:
      turnsCost: 1
      resourceCost: 8
      skills: [medical-expert]
      gambit: true

  - slug: deaf
    name: Deaf
    category: health
    group: health-maiming
    description: "Silence, and has been for a long time. You read faces and lips better than the people watching you realise. Nothing on earth is fixing it, and nothing about you advertises it either."
    pointCost: -3
    purchasable: true
    purchasableAfterStart: false
    removable: false

  - slug: missing-eye
    name: Missing Eye
    category: health
    group: health-maiming
    description: "One socket, empty or covered. Your depth perception is a running joke and your blind side is a genuine liability."
    pointCost: -3
    visible: true
    purchasable: true
    purchasableAfterStart: false
    removable: false

  # NEW (Claude) --------------------------------------------------------
  # Two purchasable drawbacks for the widened floor. Night Blind is priced for
  # this setting specifically -- Ravenheart is underground, so poor sight in
  # low light costs you more here than it would on the surface.
  - slug: night-blind
    name: Night Blind
    category: health
    group: health-mind
    description: "Fine in a lit room. Past the lamps you are guessing, and Ravenheart is mostly past the lamps."
    pointCost: -3
    purchasable: true
    purchasableAfterStart: false

  - slug: scarred
    name: Scarred
    category: health
    group: health-maiming
    description: "Whatever it was, it's healed. It just left the whole story written across you where anyone can read it."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: false

  # --- Ailments ----------------------------------------------------------
  # Tier 0, every one of them: realistically untreatable, quick, harmless.
  # No requirement block, so the Heal request never offers them — there is
  # nothing for a doctor to do and pretending otherwise would be silly.
  - slug: vomiting
    name: Vomiting
    category: health
    group: health-minor
    description: "Whatever it was, it is coming back up, and everyone within earshot knows. It stops when it stops. No doctor alive can shorten this and it would be undignified of them to charge you for trying."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: false
    durationTurns: 2

  # --- Pain ---------------------------------------------------------------
  # Three rungs of hurt, all of which pass on their own. Poppy and its
  # advanced form are the tonics that answer them (see items-drink); a medic
  # can shorten the worse two, and nobody can do a thing about an ache.
  - slug: aching
    name: Aching
    category: health
    group: health-minor
    description: "Everything hurts a little. You slept on stone, or something hit you and didn't break anything. It passes."
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false
    removable: false
    durationTurns: 3

  - slug: severe-pain
    name: Severe Pain
    category: health
    group: health-minor
    description: "It hurts enough that you are thinking about it instead of what you are doing. Poppy answers this, and so does a competent friend."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    durationTurns: 2
    requirement:
      resourceCost: 1
      skills: [medical-basic]

  - slug: pain-shock
    name: Pain Shock
    category: health
    group: health-minor
    description: "Past what a body will carry. You are grey, shaking, and not answering questions. Somebody needs to bring you out of this."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    durationTurns: 1
    requirement:
      turnsCost: 1
      resourceCost: 2
      skills: [medical-skilled]

  # --- The two poisons ----------------------------------------------------
  # Both end at Dying in a single turn, and both sit on tier 7 of the cure
  # ladder — Expert plus a Gambit — which is how "hard to cure" is written in
  # this file. The difference between them is entirely who can tell: Nightshade
  # is a scene, Phrygian Tears is a mystery.
  - slug: choking
    name: Choking
    category: health
    group: health-illness
    description: "You're choking to death — frothing, clawing at your own collar, and everyone in the room can see exactly what is happening. Nightshade does this. Can be cured with charcoal."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    durationTurns: 2
    expiresInto: [dying]
    requirement:
      turnsCost: 1
      resourceCost: 2
      gambit: false

  - slug: phrygian-toxin
    name: Phrygian Toxin
    category: health
    group: health-illness
    description: "Something is shutting you down from the inside, quietly, with no outward sign at all. You will simply stop. Whoever did it did not need to be in the room."
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false
    removable: true
    durationTurns: 1
    expiresInto: [dying]
    requirement:
      turnsCost: 1
      resourceCost: 8
      skills: [medical-expert]
      gambit: true

  - slug: hungover
    name: Hungover
    category: health
    group: health-minor
    description: "You had a wonderful evening and this is the invoice. Water, quiet, and the passage of time."
    pointCost: 0
    purchasable: false
    purchasableAfterStart: false
    removable: false
    durationTurns: 1

  - slug: migraine
    name: Migraine
    category: health
    group: health-minor
    description: "A spike behind one eye, and the light is unbearable. You get these. Nothing helps and nothing ever has — it passes, you get a few good days, and then it comes back, because it always comes back."
    pointCost: -2
    purchasable: true
    purchasableAfterStart: false
    removable: false
    durationTurns: 3
    expiresInto: [no-migraine]

  - slug: no-migraine
    name: No Migraine
    category: health
    group: health-minor
    description: "Your head is clear and the world is a reasonable place. Enjoy it. It might come back…"
    pointCost: 0
    purchasable: false
    purchasableAfterStart: false
    removable: false
    durationTurns: 4
    expiresInto: [migraine]

  # --- Recovery ----------------------------------------------------------
  # What good treatment LEAVES BEHIND, so a cure reads as convalescence
  # rather than the tag simply blinking out. All tier 0 — there is nothing to
  # treat about getting better.
  - slug: splinted
    name: Splinted
    category: health
    group: health-recovery
    description: "Set, strapped and holding. Keep your weight off it and it knits straight."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: false
    durationTurns: 4

  - slug: stitched-up
    name: Stitched Up
    category: health
    group: health-recovery
    description: "Cleaned, closed and drawn tight. It pulls when you move and it itches like sin, which is how you know it's working. It will leave a mark."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: false
    durationTurns: 3
    expiresInto: [scarred]

  - slug: cauterized
    name: Cauterized
    category: health
    group: health-recovery
    description: "Hot iron, no anaesthetic, and the bleeding stopped. It was the right call and you will never forget it happened."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: false
    durationTurns: 1
    expiresInto: [scarred]

  - slug: recovering
    name: Recovering
    category: health
    group: health-recovery
    description: "Out of danger and under orders to do nothing strenuous. Someone competent has already done the hard part; the rest is rest."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: false
    durationTurns: 2

