  # Meals. Cooked as a Routine Move, not bought: purchasable false keeps them
  # out of both point-buy menus, while craftable true is what lets
  # addTagRequestImpl accept a player cooking one. The per-Move batch caps
  # (4 Fine, 3 Lavish) are a GM adjudication reference, like every other
  # requirement block — see docs/documents.yaml's Meals & Kitchens document.
  - slug: fine-meal
    name: Fine Meal
    category: items
    group: items-food
    description: "An honest, well-made meal. Makes an ordinary person happy; Nobility expect one as a matter of course."
    pointCost: 0
    tradeable: true
    stackable: true
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    craftable: true
    consumable: true
    consumesInto:
      - ate-meal
      # An honest meal cheers an ordinary person; a noble expects one as a
      # matter of course, so it does nothing for their mood. They still eat.
      - slug: happy
        unlessTags: [nobility]
    requirement:
      resourceCost: 2
      skills: [cooking-basic]
      gambit: false
  - slug: lavish-meal
    name: Lavish Meal
    category: items
    group: items-food
    description: "A meal worth the Baron's own table. Makes anyone happy, Nobility included, and is a fair object of a Desire. Needs one hard-to-get exotic ingredient on top of the cost."
    pointCost: 0
    tradeable: true
    stackable: true
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    craftable: true
    consumable: true
    consumesInto:
      - ate-meal
      - happy
    requirement:
      resourceCost: 3
      skills: [cooking-skilled]
      gambit: false

  # --- Drink --------------------------------------------------------------
  # Alcohol, drugs and tonics. Brewed as a Move, never bought: purchasable
  # false keeps them out of both point-buy menus, craftable true is what lets
  # addTagRequestImpl accept a player brewing one — exactly the posture the
  # meals above take. Every requirement block below is a RECIPE, and like
  # every other requirement block in this file it is a GM adjudication
  # reference rather than anything the code enforces. The prose writeup is
  # docs/documents.yaml's Alcohol & Drugs document.
  #
  # The tiers are the two existing Brewing skills, whose descriptions already
  # promised all of this: Basic brews alcohol and the simple stuff, Skilled
  # brews wine and the tonics that need hard-to-find ingredients. Those
  # ingredients are named in each description — they are the real cost, and
  # the reason most of these are a negotiation with another player rather than
  # a shopping trip.
  - slug: cave-fungus
    name: Cave Fungus
    category: items
    group: items-drink
    description: "Pale, cold-loving stuff that grows where the lamps don't reach. An important ingredient in a great many recipes, and the base of nearly everything worth brewing down here. Eaten raw it will get you {tag:high} for a couple of turns and taste like the floor it grew on — no pleasure in it at all, which is rather the point of refining it first."
    pointCost: 0
    tradeable: true
    stackable: true
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    craftable: true
    consumable: true
    consumesInto:
      - slug: high
        durationTurns: 2
    requirement:
      resourceCost: 0

  - slug: alcohol
    name: Alcohol
    category: items
    group: items-drink
    description: "Beer, ale, mead — whatever the barrel held. Cheap, plentiful, and enough to take the edge off a bad day underground."
    pointCost: 0
    tradeable: true
    stackable: true
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    craftable: true
    consumable: true
    consumesInto:
      - tipsy
    requirement:
      resourceCost: 1
      skills: [brewing-basic]
      gambit: false

  - slug: bliss
    name: Bliss
    category: items
    group: items-drink
    description: "Cave Fungus, properly worked, until what's left is clean and sweet and nothing like the raw stuff. The best thing at any party in Ravenheart, and it costs nothing but the fungus and the work — which is why it turns up wherever people have no money and something to celebrate."
    pointCost: 0
    tradeable: true
    stackable: true
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    craftable: true
    consumable: true
    consumesInto:
      - happy
      - slug: high
        durationTurns: 3
    requirement:
      resourceCost: 0
      skills: [brewing-basic]
      gambit: false

  - slug: ravenheart-red
    name: Ravenheart Red
    category: items
    group: items-drink
    description: "The one genuinely exquisite thing this barony makes. Dear, slow to make, and a fair object of a Desire — plenty of people down here have never tasted it and intend to before they die."
    pointCost: 0
    tradeable: true
    stackable: true
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    craftable: true
    consumable: true
    consumesInto:
      - tipsy
      - happy
    requirement:
      resourceCost: 4
      skills: [brewing-skilled]
      gambit: false

  # The three tonics. Each one needs something the brewer cannot simply buy,
  # named in its description — that ingredient is the actual gate, and getting
  # hold of it is meant to be a scene rather than a purchase.
  - slug: dreamers-draught
    name: Dreamer's Draught
    category: items
    group: items-drink
    description: "Drink it and sleep, and while you sleep you may ask the world one question and be answered truthfully. Difficult to make and easy to ruin: the brewing is a Gambit, and only a roll of 4 or better yields anything you'd want to drink."
    pointCost: 0
    tradeable: true
    stackable: true
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    craftable: true
    consumable: true
    requirement:
      resourceCost: 6
      skills: [brewing-skilled]
      gambit: true

  - slug: forgiveness
    name: Forgiveness
    category: items
    group: items-drink
    description: "Whoever drinks it loses the last of what they knew — the argument, the debt, the thing they saw you do. Needs genuine tears, freely wept, and there is no substitute; someone has to have been made to cry, and mean it."
    pointCost: 0
    tradeable: true
    stackable: true
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    craftable: true
    consumable: true
    requirement:
      resourceCost: 8
      skills: [brewing-skilled]
      gambit: false

  - slug: flawless-skin
    name: Flawless Skin
    category: items
    group: items-drink
    description: "Beauty that isn't yours and doesn't last, worn for three turns like a borrowed coat. Needs a lock of hair from someone bearing {tag:nobility} — which means either a noble who owes you a favour, or a noble who never finds out."
