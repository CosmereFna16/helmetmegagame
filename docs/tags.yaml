    pointCost: 1
    equippable: true
    tradeable: true
    visible: true
    purchasable: true
    purchasableAfterStart: true

  # A creation-only bundle rather than a thing you carry: it sits on the sheet
  # until the player unpacks it from their own character sheet (see consumable
  # in this file's header). Not tradeable or stackable — there's nothing to
  # hand over, and buying two would just collapse into one.
  - slug: starting-wares
    name: Starting Wares
    category: items
    group: items-gear
    description: "Goods you came in with, still crated. Unpack them whenever you like."
    pointCost: 4
    purchasable: true
    purchasableAfterStart: false
    consumable: true
    consumesInto:
      - old-45-revolver
      - jewelry

  - slug: old-45-revolver
    name: Old .45 Revolver
    category: items
