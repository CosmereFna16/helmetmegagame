  # and merely reported an unmatched entry. Nothing automates it: no drink in
  # this file grants it and no pass looks for it. A GM grants it when the
  # roleplay has earned it, which is what the document tells players outright.
  # Not items — you don't carry a ghost or a spell in a pocket. Both arrive by
  # consuming something (the Golden Arrow, the Codex Supprimata) and then they
  # are simply part of you: untradeable, unremovable, and not purchasable at
  # any price.
  - slug: holoparasite
    name: Holoparasite
    category: general
    group: general-traits
    description: "A ghost that reflects your inner character — you decide its name and what it is like. It hits harder than anything a person should, and every wound it takes is written onto your own body instead. Nobody can see it unless you deploy it."
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false
    removable: false
    tradeable: false

  - slug: time-stop
    name: Time Stop
    category: general
    group: general-traits
    description: "Once a day you may stop time in a small area around you. Everything in it holds still; you do not. What you do with the moment is your own business."
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false
    removable: false
    tradeable: false

  - slug: tracking
    name: Tracking
    category: general
    group: general-traits
    description: "You have a ranger's eye. A trail that means nothing to anyone else tells you who passed, how many, and how long ago."
