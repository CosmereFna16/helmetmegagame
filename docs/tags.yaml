  # --- Demoness -------------------------------------------------------------
  # A hidden category (see the `categories:` note at the top of this file).
  # The Demoness prerequisite is written ONCE, as `requiredTag: demoness` on
  # the `demoness` group in docs/taggroups.yaml — deliberately not repeated on
  # each tag here, since the group gate is what hides the category and a
  # second copy of the same rule is a second thing to keep in sync.
  - slug: slavemaster
    name: Slavemaster
    category: demoness
    group: demoness
    description: "When you Break a soul, that person gains {tag:broken-enslaved} instead. They will follow your every command. You can only have two slaves at a time."
    pointCost: 4
    purchasable: true
    purchasableAfterStart: true

  # Discounted twins of the General Seductive/Torturer. Deliberately separate
  # tags rather than a parentTag chain: a chain prices cumulatively, so
  # Seductive (Demoness) would cost 4 + 3 = 7 — the opposite of a discount.
  # db/lib/inspectVision.js reads both slugs of each pair.
  - slug: seductive-demoness
    name: Seductive (Demoness)
    category: demoness
    group: demoness
    description: "You can see a person's Desire by examining them."
    pointCost: 3
    purchasable: true
    purchasableAfterStart: true

  - slug: torturer-demoness
    name: Torturer (Demoness)
    category: demoness
    group: demoness
    description: "You can see a person's Worst Fear by examining them."
    pointCost: 3
    purchasable: true
    purchasableAfterStart: true

  - slug: true-form-serpent
    name: "True Form: Serpent"
    category: demoness
    group: demoness
    description: "You can switch into your true form at will: a beautiful, monstrous woman with a serpentine lower body and eyes, tongues like a snake's. Can wrap around people, immobilizing them, and has fangs which inflict {tag:envenomated}."
    pointCost: 3
    purchasable: true
    purchasableAfterStart: true

  - slug: true-form-spider
    name: "True Form: Spider"
    category: demoness
    group: demoness
    description: "You can switch into your true form at will: a beautiful woman with a furry, eight-legged abdomen. Hard to see in the dark — can inflict {tag:paralyzed} and {tag:hallucinating}."
    pointCost: 3
    purchasable: true
    purchasableAfterStart: true

  - slug: true-form-siren
    name: "True Form: Siren"
    category: demoness
    group: demoness
    description: "You can switch into your true form at will — a beautiful, monstrous woman with a scaled face and a long, finned tail. Can swim expertly, and has a call that lures the weak-willed."
    pointCost: 3
    purchasable: true
    purchasableAfterStart: true
