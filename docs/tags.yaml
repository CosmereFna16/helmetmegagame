# Master source for the Tag/TagGroup catalog. Hand-edited; synced into
# Postgres by db/lib/syncTags.js#syncTagsFromYaml (npm run db:sync-tags),
# same non-destructive upsert-by-slug contract as docs/locations.yaml:
# removing an entry here never deletes its DB row, it just stops getting
# updated. `slug` is the stable match key across syncs.
#
# `categories` is validation-only — syncTagsFromYaml checks every tag/group's
# `category` against this list, but categories aren't their own DB table.
#
# `groups` are optional and scoped to one category, purely for display
# coloring (see web/app/globals.css's --tag-<color> tokens and TagChip.js).
# A tag with no `group` renders uncolored.
#
# `parentTag` vs `requiredTag` on a tag are two different relations:
#   - parentTag: sequential tier chain (Fighting (Basic) -> (Trained) -> ...)
#     — acquiring a tier is meant to replace the previous one, not stack.
#   - requiredTag: non-replacing prerequisite — you must already hold
#     requiredTag, but acquiring this tag does NOT remove/replace it (e.g.
#     Fighting (Archer) requires Fighting (Basic) but coexists with
#     Fighting (Skilled)). A TagGroup can also carry its own requiredTag to
#     gate every tag in that group at once (e.g. a whole "Cultist" group
#     hidden behind a membership tag) — no group currently uses this, it's
#     just supported.
#
# Neither relation is enforced by any code yet — there's no player-facing
# purchase flow. `purchasable`/`purchasableAfterStart` are catalog data for
# a future store to read, same idea.

categories:
  - slug: meta
    name: Meta
  - slug: general
    name: General
