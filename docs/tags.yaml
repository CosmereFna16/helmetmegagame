  # --- The apothecary -----------------------------------------------------
  # Every tonic costs ⬢ AND an ingredient named in its own description — a
  # corpse to bottle beside, a Graga cut open, the heart of a rainbow trout.
  # The ⬢ are deliberately cheap, between 2 and 4, because the ingredient is
  # the real price and getting hold of one is meant to be a scene rather than
  # a purchase. No code enforces the ingredient; a GM does, the same way every
  # other requirement block in this file works.
  #
  # `consumable` is set only where something is genuinely used up BY THE
  # DRINKER. A poison you administer, a flask you throw and a powder you work
  # into someone else's wound are all spent by a Move instead, so they carry
  # no consumesInto and the GM applies the result to whoever it happened to.

