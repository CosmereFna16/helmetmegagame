  # separate 4-point abilities (Seductive and Torturer) rather than granting
  # one of its own.
  - slug: giant
    name: Giant
    category: general
    group: general-traits
    description: "Head and shoulders above everyone in the room, and built to match. Doors, tunnels and crawlspaces were not made for you, and nobody who sees you forgets it."
    pointCost: 6
    visible: true
    purchasable: true
    purchasableAfterStart: false

  - slug: inscrutable
    name: Inscrutable
    category: general
    group: general-social
    description: "Nothing shows on you. Someone Seductive examining you learns no Desire; someone with a Torturer's eye finds no Worst Fear. They get a blank, and they know it is a blank."
    pointCost: 5
    purchasable: true
    purchasableAfterStart: true

  - slug: old
    name: Old
    category: general
    group: general-traits
    description: "Long past your prime. Your body is slower and less forgiving than it was, and everyone can see it."
    pointCost: -2
    purchasable: true
    purchasableAfterStart: false

