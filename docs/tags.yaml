  # Apex Form and Terrifying both want "any one of the three True Forms" as a
  # prerequisite, and `requiredTag` cannot say that — it takes a single slug,
  # satisfied by that tag's own chain, and the three forms are alternatives
  # rather than a chain. So the gate is written into the description and left
  # to the GM. Do NOT chain the forms to fake it: a chain prices cumulatively
  # and would let a character "upgrade" Serpent into Spider.
  - slug: apex-form
    name: Apex Form
    category: demoness
    group: demoness
    description: "Give in to the carnage. You permanently become a monstrously tall woman with hands like rakes. You hide in the dark, sprint impossibly quickly, and heal from eating people. Fire and silver stop the healing. You can no longer speak. Requires a True Form, and removes almost all of your other tags."
