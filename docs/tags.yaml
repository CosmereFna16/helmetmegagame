# Sole master for the Tag catalog. TagGroup catalog is a sibling file,
# docs/taggroups.yaml — see there for group/color fields.
#
# PRICING A TAG: the point scale is docs/systemdocs/TAGS.md §4a, and it is
# canonical. Price against the band, not against whatever the neighbouring
# entries in this file happen to cost. docs/tag-design.md restates the same
# scale for players, along with the YAML format and worked examples.
#
# NUMBERS IN A `description`: digits for anything a player counts, tracks, or
# computes with (a turn cost, a frequency limiter, a skill-tier shift, a die
# face or range, a headcount, a resource amount). Words only for idiom
# ("Almost no one matches you"), hyphenated compounds ("one-shot", "one-on-
# one"), or pure flavour with no mechanical weight ("six chambers"). A skill
# tier shift always reads "counts as N tiers higher/lower" — not "levels",
# not "rungs". A flat time cost always reads "Takes N turns."; a repeating
# one always reads "Once per day/turn" or "Once every N turns/days."
#
# This file is hand-edited and is the ONLY thing that writes the catalog.
# There is deliberately no automated sync from anywhere else — drafted
# entries get added here by hand, one at a time, so the fields that only
# ever live in this file (consumesInto, stackable, craftable, requirement)
# can't be clobbered by a bulk overwrite.
#
# Per-tag fields not covered elsewhere in this file:
#   durationTurns   - default turns-to-expire once granted, for tags that
#                     auto-expire (e.g. Drained: 3). Omit for tags that don't
#                     expire on their own.
#   visible         - who sees this tag on a 🔍 inspect. true | false | worn,
#                     default false. THE RULE, and it is catalog-wide: `true`
#                     means a stranger looking you over would notice — your
#                     body, your face, your gait, your clothes, anything large
#                     enough that you are visibly hauling it, and a reputation
#                     already public under your name (Disgraced, Wanted,
#                     Knighted). NEVER your appetites, beliefs, opinions,
#                     skills or secrets: Hot-Headed, Pacifist, Alcoholic,
#                     Eunuch, every Belief and every Skill are `false`, and a
#                     temper is a thing you find out about someone rather than
#                     a thing you see. `worn` is the concealable middle and
#                     requires `equippable` (the sync throws otherwise). When
#                     in doubt, check the neighbours — if a tag of identical
#                     severity two rows away disagrees with you, one of the two
#                     is wrong. Health carries a second rule on top of this
#                     one: a medic sees what they could treat whatever this
#                     says, so an internal illness can be `false` without
#                     becoming undiagnosable (TAGS.md §5c).
#   removable       - whether a player can strip this tag off themselves
#                     mid-game without a GM. Live: it fills the Remove Tag
#                     menu (web/lib/tagRequests.js#removableTags) and is
#                     re-checked server-side by removeTagRequest. Removing
#                     refunds resources, never Tag Points. Default false.
#   craftable       - whether this tag represents something a player can
#                     craft/make, vs. one that only ever arrives via role, GM
#                     grant, or automatic game logic. Live, and load-bearing:
#                     it is the WHOLE gate on the Add Tag menu
#                     (web/lib/tagRequests.js#addableTags), re-checked
#                     server-side by addTagRequest. Setting it true puts the
#                     tag in every player's crafting menu. Default false.
#   stackable       - whether a character can hold more than one at a time
#                     (meals, ammunition, anything a crafting Move makes in a
#                     batch). Default false. A stack is one CharacterTag row
#                     carrying a count, not N rows, so presence checks are
#                     unaffected. Fine to combine with durationTurns: each
#                     expiry sheds one unit and restarts the timer for the
#                     rest, so 3 of a 2-turn tag lose one every 2 turns.
#   consumable      - whether a player can use this tag up from their
#                     character sheet — eat the meal, unpack the crate.
#                     Default false. Consuming always takes exactly ONE
#                     unit, so a stack of meals feeds you several times.
#   consumesInto    - list of tag slugs this tag turns INTO when it is
#                     consumed (a meal becoming ate-meal; Starting Wares
#                     unpacking into goods). Repeat a slug to grant several
#                     of it — that only multiplies for a stackable tag, a
#                     non-stackable repeat collapses to one. Granted tags
#                     that have their own durationTurns start their clock at
#                     that moment, so chains work (meal -> ate-meal, which
#                     the expiry sweep then clears). If the character already
#                     holds a non-stackable granted tag, their existing one
#                     is left alone. Omit it for a consumable that simply
#                     gets used up.
#                     An entry may also be conditional, granted only to a
#                     character holding NONE of the listed tags. Nothing in
#                     the catalog uses this today; the shape is:
#                         consumesInto:
#                           - ate-meal
#                           - slug: night-vision
#                             unlessTags: [blind]
#                     Both halves are validated against this file, and the
#                     condition is applied identically by the grant itself and
#                     by the "Becomes:" preview a player sees first.
#   requirement:    - what it costs a character to add or remove this tag in
#                     play (GM adjudication reference, also shown to
#                     players; not automated/enforced by any code). One
#                     shared block covers whichever direction is
#                     narratively relevant to a given tag - e.g. crafting a
#                     sword only cares about the cost to add it, curing
#                     Arthritis only cares about the cost to remove it.
#     turnsCost     - turns of in-game time
#     resourceCost  - resource cost
#     skills        - list of skill tag slugs required; multiple accepted
#     gambit        - whether a Gambit roll is needed
#   expiresInto     - what this tag turns INTO when its durationTurns runs
#                     out, instead of simply being swept away. This is the
#                     untreated-wound chain: Infected festers, Festering goes
#                     Feverish AND Necrotic, Necrosis costs you a limb.
#                     A list whose entries are either a bare slug:
#                         expiresInto: [festering]
#                     several slugs, all granted at once:
#                         expiresInto: [feverish, necrosis]
#                     or an even random pick between slugs:
#                         expiresInto:
#                           - oneOf: [missing-leg, missing-arm]
#                     Three rules, all enforced by db/lib/syncTags.js before
#                     it writes anything: every slug must exist in this file;
#                     the tag must have durationTurns (or nothing would ever
#                     fire it); and a tag may not list ITSELF, since the
#                     sweep that follows the grant would delete the fresh row
#                     one statement later. A two-tag loop (migraine <->
#                     no-migraine) is fine and is how a recurring condition
#                     is written.
#                     Distinct from consumesInto above: that one is chosen by
#                     the player, this one happens on the clock whether they
#                     wanted it or not.
#
# THE CURE LADDER. Every tag in the `health` category is priced off one of
# eight rungs, and nothing in that category should invent its own numbers —
# pick the rung and copy the block. Full writeup in
# docs/systemdocs/TAGS.md §5c.
#
#   Tier 0  untreatable            no requirement block at all
#   Tier 1  very minor, first aid  1 ⬢,  0 turns, medical-basic
#   Tier 2  minor                  2 ⬢,  0 turns, medical-basic
#   Tier 3  moderately severe      2 ⬢,  1 turn,  medical-skilled
#   Tier 4  severe                 4 ⬢,  1 turn,  medical-skilled
#   Tier 5  very minor surgery     6 ⬢,  1 turn,  medical-skilled
#   Tier 6  severe surgery         8 ⬢,  1 turn,  medical-expert
#   Tier 7  complex surgery        8 ⬢,  1 turn,  medical-expert, gambit
#
# The top three rungs are the surgical ones, and they are where the ladder
# does its real work. A Serpent closes an arterial bleed and cuts away dead
# flesh without rolling; anything that means opening a chest or a belly is
# Esculap's, and a Serpent attempting it rolls. The last rung is the one even
# Esculap rolls for, which is why it shares tier 6's price — what separates
# them is the Gambit, not the bill.
#
# Tier 0 is a real choice, not a gap: something that realistically isn't
# treatable, runs its course quickly, and does no lasting harm (Vomiting, a
# Migraine, a Concussion) gets NO requirement block, which is exactly what
# makes the Heal request refuse to offer it. A player can always attempt a
# Gambit to treat anything above their tier, or anything with no listed cure
# — that is what Gambits are for, and the Medical document says so.
categories:
  - slug: meta
    name: Meta
  - slug: general
    name: General
  - slug: skills
    name: Skills
  - slug: status
    name: Status
  # Every affliction, injury and condition a medic might treat. Split out of
  # Status deliberately: Status is the needs/intoxication layer (Hungry,
  # Drained, Tipsy) and health is a system of its own, with its own groups
  # and its own pricing ladder. See docs/systemdocs/TAGS.md §5c.
  - slug: health
    name: Health
  - slug: items
    name: Items
  - slug: assets
    name: Assets
  # Hidden categories. Each has exactly one group in docs/taggroups.yaml
  # carrying a `requiredTag`, and that group gate is the only thing hiding
  # them — there is no per-category field. Until a character holds the
  # unlocking tag the category has no tab in any picker and its tags are
  # withheld from /api/tags entirely.
  - slug: demoness
    name: Demoness
  - slug: bacchus
    name: Bacchus

# TagGroup catalog (Traits, Social, Health, ...) now lives in
# docs/taggroups.yaml — split out so group colors can be freeform hex
# instead of a fixed token set. Tags below reference a group by its slug
# via `group:`, same as before.

tags:
  # --- Meta ---------------------------------------------------------------
  - slug: hungerless
    name: Hungerless
    category: meta
    description: "Never flagged hungry, even with insufficient resources."
    pointCost: 0
    purchasable: false

  - slug: turn-ping
    description: "You are pinged in Discord when the turn advances. Toggled from /character; carries no weight in play."
    name: Turn Ping
    category: meta
    pointCost: 0
    purchasable: false

  # --- Cult ---------------------------------------------------------------
  # The Cult of Bacchus's own progression, kept out of the hidden `bacchus`
  # category on purpose: `follower-of-bacchus` (General) is the gate that
  # OPENS that category, and these track how far the cult has got rather than
  # being powers it grants. They sit in the `meta-cult` group so /api/tags
  # withholds them from anyone who isn't already a Cultist — see the note on
  # that group in docs/taggroups.yaml.
  #
  # Ripening -> Bountiful is a replacing tier chain, so a cult holds at most
  # one rung at a time. There is no base rung: a young cult simply holds no
  # tier tag (the old Cult: Seedling granted nothing and was removed).
  # `follower-of-bacchus` is deliberately NOT part of the chain — a Cultist
  # keeps it while climbing, since it is what keeps the Bacchus category
  # unlocked.
  - slug: cult-leader
    name: Cult Leader
    category: meta
    group: meta-cult
    description: "You understand Bacchus's plan."
    pointCost: 0
    purchasable: false

  - slug: cult-ripening
    name: "Cult: Ripening"
    category: meta
    group: meta-cult
    description: "Your cult is maturing. Unlocks the Ripening tags."
    pointCost: 0
    purchasable: false
  - slug: cult-bountiful
    name: "Cult: Bountiful"
    category: meta
    group: meta-cult
    description: "Your cult is at its prime. Unlocks the Bountiful cultist tags. Fulfill your mission!"
    pointCost: 0
    parentTag: cult-ripening
    purchasable: false
    # A cult that reaches its prime can no longer hide: this is the tag whose
    # rung makes a bystander's 🔍 read "Cult: Bountiful".
    # Seedling and Ripening stay concealed.
    visible: true

  # --- General --------------------------------------------------------------

  # Slug kept deliberately: renaming means changing `name`, not `slug` (see
  # this file's header). This is the gate on the hidden Bacchus category.
  - slug: follower-of-bacchus
    name: Cultist
    category: general
    description: "We are free, so free! Unlocks the Bacchus tags."
    pointCost: 0
    purchasable: false
    # Two-clause lock (2026-08-31, Desires rework): closed to everything but
    # cult-bacchus at tier 1, but alcohol/drugs/food/romance stay open from
    # tier 2 up — the "replaces the old +5-per-Desire compensation" carve-out.
    desires:
      locks:
        - tiers: [1]
          exceptFamilies: [cult-bacchus]
        - tiers: [2, 3, 4, 5, 7]
          exceptFamilies: [cult-bacchus, alcohol, drugs, food, romance]

  - slug: demoness
    name: Demoness
    category: general
    description: "\"Pleasure is so painful — ah~! I don't care!\" You can Break souls ({tag:broken}), turning their owners into walking, empty shells, by making them fall in love with you — and then sealing it with a (voluntary) kiss. If people want more after that, that's your business, not mine."
    pointCost: 0
    purchasable: false
    desires:
      locks:
        - all: true
          exceptFamilies: [demoness]

  # Price is cosmetic (role-granted, not purchasable) — do not "fix" it. The
  # `all + food at tiers 1-2` intent from the design spec isn't expressible
  # in one clause (each clause carries exactly one of all|families|tiers, and
  # exceptFamilies only subtracts), so the tier-1 lock is data and the cheap-
  # food restriction below is a prose line, GM-adjudicated.
  - slug: nobility
    name: Nobility
    category: general
    group: general-personality
    description: "You are a person of noble breeding, accustomed to comfort in all aspects. You must eat a {tag:fine-meal} or better each day, or you wake up {tag:disappointed}. You can't take 1 point Desires, or any Desire related to something below your station."
    pointCost: -2
    requiredTag: courtier
    purchasable: false
    purchasableAfterStart: false
    removable: false
    visible: true
    desires:
      locks:
        - tiers: [1]

  - slug: ravenhearter
    name: Ravenhearter
    category: general
    description: "You live in Ravenheart."
    pointCost: 0
    purchasable: false
    visible: false

  - slug: mortus
    name: Mortus
    category: general
    description: "One of the Mortii. Tends to the dead and the Lifeweb."
    pointCost: 0
    purchasable: false
    visible: false

  - slug: courtier
    name: Courtier
    category: general
    group: general-traits
    description: "A member of the court."
    pointCost: 0
    purchasable: false

  # The Court — general-court is gated behind `courtier` at the group level,
  # same idiom as general-watch/general-brigand, so none of these need their
  # own requiredTag.
  - slug: knighted
    name: Knighted
    category: general
    group: general-court
    description: "You were knighted, and serve the Baron directly."
    pointCost: 7
    visible: true
    purchasable: true
    purchasableAfterStart: false

  - slug: disgraced
    name: Disgraced
    category: general
    group: general-court
    description: "Your name brings dishonor."
    pointCost: -3
    visible: true
    purchasable: true
    purchasableAfterStart: false

  - slug: old-blood
    name: Old Blood
    category: general
    group: general-court
    description: "Your family has been around a long time."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: false

  - slug: dancer
    name: Dancer
    category: general
    group: general-court
    description: "You are a fantastic dancer."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true

  - slug: soft-hands
    name: Soft Hands
    category: general
    group: general-court
    description: "You've never done a day's labor. It'll be harder to work."
    pointCost: -3
    purchasable: true
    purchasableAfterStart: false

  # Moved out of general-court (2026-08-31, Desires rework) — anyone can be
  # vain, not just the court.
  - slug: vain
    name: Vain
    category: general
    group: general-addictions
    description: "You are inwardly inconsolable if anyone outshines you. Your bottom Desire slot is locked to Desires about being admired."
    pointCost: -4
    exclusive: true
    purchasable: true
    purchasableAfterStart: false
    removable: false
    consumable: false
    conflictsWith: [depressed]
    desires:
      locks:
        - all: true
          exceptFamilies: [vanity]
          slot: bottom

  # NEW (2026-08-31, Desires rework). The one Addiction that closes tiers
  # 5 and 7 too — compensated by food being the largest family.
  - slug: glutton
    name: Glutton
    category: general
    group: general-addictions
    description: "Just one more sweet... Your bottom Desire slot is locked to Desires about food."
    pointCost: -4
    exclusive: true
    purchasable: true
    purchasableAfterStart: false
    removable: false
    consumable: false
    conflictsWith: [depressed]
    desires:
      locks:
        - all: true
          exceptFamilies: [food]
          slot: bottom

  # --- Personality: the positive half (general-personality) ---------------
  # NEW 2026-08-31 (Desires rework) as `general-interests`; MOVED into
  # `general-personality` 2026-09-01. Nothing here locks anything — these just
  # gate a Desire open. They now sit in the same group as the drawbacks that
  # close the catalog down, because the merge's whole point is that one tag is
  # allowed to do both (DESIRES.md §5). Superstitious/Desperate/Hypochondriac/
  # Combative/Corrupt/Fundamentalist above came in with the same sign flip.
  - slug: mad-doctor
    name: Mad Doctor
    category: general
    group: general-personality
    description: "Unlocks Desires about modifying the body."
    pointCost: 5
    requiredTag: medical-basic
    purchasable: true
    purchasableAfterStart: true

  - slug: esoteric
    name: Esoteric
    category: general
    group: general-personality
    description: "What could be worthwhile except the Truth? Unlocks Desires about esotericism."
    pointCost: 5
    purchasable: true
    purchasableAfterStart: true

  - slug: adventurer
    name: Adventurer
    category: general
    group: general-personality
    description: "Unlocks Desires about adventuring."
    pointCost: 5
    purchasable: true
    purchasableAfterStart: true

  - slug: cruel
    name: Cruel
    category: general
    group: general-personality
    description: "It's a call, a need. Unlocks Desires about cruelty."
    pointCost: 5
    purchasable: true
    purchasableAfterStart: true

  - slug: charitable
    name: Charitable
    category: general
    group: general-personality
    description: "Unlocks Desires about charity."
    pointCost: 4
    purchasable: true
    purchasableAfterStart: true

  # Supersedes the retired Bacchus "Death Wish" tag — lock-free by design
  # (F-18): the old one was Restriction-shaped, this one is just an Interest.
  # Holders of the retired death-wish are granted this free.
  - slug: death-wish-interest
    name: "Death Wish"
    category: general
    group: general-personality
    description: "You want to see how close you can get. Closer than that."
    pointCost: 5
    purchasable: true
    purchasableAfterStart: true

  - slug: schemer
    name: Schemer
    category: general
    group: general-personality
    description: "Unlocks Desires about scheming."
    pointCost: 5
    purchasable: true
    purchasableAfterStart: true

  - slug: windlander
    name: Windlander
    category: skills
    description: "You know the ways of the Windlands. You may move about freely there, and you are less affected by its dangerous weather."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true

  - slug: chaplain
    name: Chaplain
    category: general
    description: "Ordained to the Church. May take confession, read the rites over the dead, and remove people's negative mental traits."
    pointCost: 0
    purchasable: false

  - slug: pious
    name: Pious
    category: general
    group: general-traits
    description: "You cannot be forcibly converted."
    pointCost: 0
    purchasable: false

  - slug: insightful
    name: Insightful
    category: general
    group: general-traits
    description: "You read people well. You can use a Gambit to randomly discover 1–6 of a person's tags."
    pointCost: 7
    purchasable: true
    purchasableAfterStart: true

  # NEW (Claude) --------------------------------------------------------
  # The 5 and 6 bands were nearly empty, and the design doc names "giant" as
  # its own 6-point example.
  - slug: giant
    name: Giant
    category: general
    group: general-traits
    description: "You are a behemoth among humanity and struggle to fit into confined spaces. However, you could easily crush anyone."
    pointCost: 14
    visible: true
    purchasable: true
    purchasableAfterStart: false

  - slug: old
    name: Old
    category: general
    group: general-traits
    description: "Elderly. You're slower, fight slightly worse, and don't heal as well."
    pointCost: -5
    visible: true
    purchasable: true
    purchasableAfterStart: false

  - slug: frail
    name: Frail
    category: general
    group: general-traits
    description: "You are physically weak and fragile. Mustering strength to fight back is almost impossible."
    pointCost: -5
    visible: true
    purchasable: true
    purchasableAfterStart: false

  # The Alcohol & Drugs document has assigned itself to this tag by name since
  # before the tag existed — documents.yaml's `tags:` list is deliberately soft
  # and merely reported an unmatched entry. Nothing automates it: no drink in
  # this file grants it and no pass looks for it. A GM grants it when the
  # roleplay has earned it, which is what the document tells players outright.
  # Not items — you don't carry a ghost or a spell in a pocket. Both arrive by
  # consuming something (the Golden Arrow, the Codex Supprimata) and then they
  # are simply part of you: untradeable, unremovable, and not purchasable at
  # any price.
  - slug: holoparasite
    name: Holoparasite
    category: general
    group: general-traits
    description: "A reflection of your soul, with your choice of name. It can appear and disappear at will, and punch things hard and fast. Beware! Any damage it takes is reflected onto you."
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false
    removable: false
    tradeable: false

  - slug: time-stop
    name: Time Stop
    category: general
    group: general-traits
    description: "Once per day, you can stop time in a 10-foot radius around you. This lasts 10 seconds."
    pointCost: 0
    visible: false
    purchasable: false
    purchasableAfterStart: false
    removable: false
    tradeable: false

  - slug: tracking
    name: Tracking
    category: general
    group: general-traits
    description: "You're good at following footsteps and other signs, in the wild or in the city."
    pointCost: 5
    visible: false
    purchasable: true
    purchasableAfterStart: true

  - slug: literate
    name: Literate
    category: general
    group: general-traits
    description: "You can read and write, something most people in Ravenheart cannot do."
    pointCost: 5
    purchasable: true
    purchasableAfterStart: true

  - slug: light-sleeper
    name: Light Sleeper
    category: general
    group: general-traits
    description: "You wake up to noise readily, such as footsteps in the night."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: false

  # A drawback, so it GIVES a point back rather than costing one — same
  # posture as Frail and Old above.
  - slug: heavy-sleeper
    name: Heavy Sleeper
    category: general
    group: general-traits
    description: "Not a good thing to be in Ravenheart."
    pointCost: -2
    purchasable: true
    purchasableAfterStart: false

  - slug: depressed
    name: Depressed
    category: general
    group: general-personality
    description: "Nothing is worth wanting. Locks all Desires. Can be cured by a Chaplain."
    pointCost: -8
    purchasable: true
    # Curable + maximally valuable would be a point farm otherwise (R-1).
    purchasableAfterStart: false
    removable: false
    desires:
      locks:
        - all: true

  - slug: alcoholic
    name: Alcoholic
    category: general
    group: general-addictions
    description: "Drink comes first and there is no second. Your bottom Desire slot is locked to drinking Desires."
    pointCost: -4
    exclusive: true
    purchasable: true
    purchasableAfterStart: false
    removable: false
    consumable: false
    conflictsWith: [depressed, prudish]
    desires:
      locks:
        - all: true
          exceptFamilies: [alcohol]
          slot: bottom

  # `seductive` is an old slug kept as the stable match key; the tag is
  # displayed as Empathetic. It reads a Desire the slow way — a Gambit, after a
  # long conversation — so it is GM-adjudicated and NOT wired into
  # db/lib/inspectVision.js. Its Demoness namesake below is the one that puts a
  # Desire field on the 🔍 embed for free, and that gap is what the Demoness
  # is paying its extra point for. Deliberately not `visible` — being able to
  # read people is not something people should be able to read off you.
  - slug: seductive
    name: Empathetic
    category: general
    group: general-social
    description: "You can use a Gambit to figure out a person's last fulfilled Desire — failure on 1–3, success on 4–6. You must have spoken to them for a while during that turn."
    pointCost: 9
    purchasable: true
    purchasableAfterStart: true

  # The counter, and the only rule inspectVision.js reads off the SUBJECT
  # rather than the viewer: it shuts the Desire field for the Demoness
  # Seductive too, not just for the Empathetic Gambit above. Not `visible`,
  # for the same reason Empathetic isn't — and the 🔍 embed reports a closed
  # read as "Nothing you can read.", the same line an empty Desire gets, so
  # holding it never announces itself.
  - slug: inscrutable
    name: Inscrutable
    category: general
    group: general-social
    description: "You are unreadable, so act like it. People with the {tag:seductive} trait can't see what your Desires are."
    pointCost: 7
    purchasable: true
    purchasableAfterStart: true

  - slug: iron-constitution
    name: Iron Constitution
    category: general
    group: general-traits
