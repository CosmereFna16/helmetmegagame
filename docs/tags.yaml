    name: Hungerless
    category: meta
    description: "Never flagged hungry, even with insufficient resources."
    pointCost: 0
    purchasable: false

  - slug: romance-disabled
    name: Romance Disabled
    category: meta
    description: "No romance."
    pointCost: 0
    purchasable: false
