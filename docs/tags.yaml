    description: "You have a horse and you know how to ride it. Once per day, you may enter an adjacent zone without spending a turn, but you will be easily visible."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true

  - slug: bird
    name: Bird
    category: assets
    group: assets-companions
    description: "You have a highly-trained bird."
    pointCost: 2
    purchasable: true
    purchasableAfterStart: true

  - slug: manor
    name: Manor
    category: assets
    group: assets-property
    description: "A household of your own within the Fortress."
    pointCost: 3
    requiredTag: courtier
    purchasable: true
    purchasableAfterStart: true

  # NEW (Claude) --------------------------------------------------------
  # Assets was the thinnest category at eleven.
  - slug: workshop
    name: Workshop
    category: assets
    group: assets-property
    description: "A bench, a vice and somewhere to leave a job half-finished. Work that needs space and quiet happens here instead of on your knees in a corridor."
    pointCost: 2
    visible: true
    purchasable: true
    purchasableAfterStart: true

  - slug: cart
    name: Cart
