  # --- Between zones — each of these costs the Move ----------------------
  - [fortress/manors, forest/forest-north-road]
  - [forest/forest-crossroads, forest/farms]
  - [forest/forest-sparse-field, forest/farms]
  - [forest/forest-east-river, forest/farms]
  - [forest/forest-crossroads, caves/customs]
  - [forest/forest-culvert, hills/hills-ferry]
  - [caves/caves-stairhead, depths/depths-gallery]
  - [caves/caves-stairhead, depths/depths-braid]
  - [depths/depths-sea-mouth, hills/hills-scrub]
  - [hills/hills-black-pines, marshes/marshes-hardground]
  - [hills/hills-black-pines, marshes/marshes-reedcut]
  - [hills/hills-scrub, marshes/marshes-hardground]

  # The town's two gates. Neither is manned, so both record what a passer-by
  # would have seen rather than who it actually was.
  - pair: [forest/forest-north-road, town/north-gate]
    announce: concealed
    modular:
      roles: [cerberus, censor, baron, hand, headman]
      tags: [knighted, cerberon, cerberus-key]
      open: true
  - pair: [forest/forest-crossroads, town/south-gate]
    announce: concealed
    modular:
      roles: [cerberus, censor, baron, hand, headman]
      tags: [knighted, cerberon, cerberus-key]
      open: true

  # The Baron's elevator: the Undercroft's deeper passages come out in the
  # forest below the cliffs. Given as a starting tag to the Hand and the
  # Baron.
  #
  # Keyed, so whoever rides it is asked whether to leave it open behind them
  # for 24 hours — which is how anybody without the key gets to follow.
  - pair: [fortress/undercroft, forest/forest-cliffs]
    hidden: elevator-key
    keyed: true
    on_foot: true

  # The three climbs. All LOCKED rather than hidden — you can see a mountain
  # perfectly well from the road, and understand just as well that you cannot
  # get up it. All on foot: no horse goes over a pass.
  - pair: [fortress/road, hills/hills-descent]
    locked: mountaineering
    on_foot: true
  - pair: [fortress/servant-wing, hills/hills-mountain]
    locked: mountaineering
    on_foot: true
  - pair: [forest/forest-headwaters, hills/hills-mountain]
    locked: mountaineering
    on_foot: true

  # The four crawls. Hidden, so a player without Caving never learns they are
  # there at all, and on foot, because they are crawls.
  - pair: [forest/forest-sparse-field, caves/caves-junction]
    hidden: caving
    on_foot: true
  - pair: [caves/caves-junction, marshes/marshes-duckboards]
    hidden: caving
    on_foot: true
  - pair: [depths/depths-long-run, marshes/marshes-sink]
    hidden: caving
    on_foot: true

  # The culvert into the Underquarter's sewers. LOCKED rather than hidden —
  # a grating in a riverbank is not a secret — and keyed, so whoever unlocks it
  # is asked whether to leave it open behind them.
  - pair: [forest/forest-culvert, town/underquarter]
    locked: sewer-key
    keyed: true
    on_foot: true

# ===========================================================================
# RETIRED PLACES
#
# Windlands and the deeper two cave levels came off the map in the Bascinet 2
# geography rebuild. Their prose is kept here, and only here, because it is
# good and because a later map may want it back. Nothing below is parsed —
# it is a comment.
#
# --- Zone: Windlands -------------------------------------------------------
# Little monsters, puddles, and lizards, scorched by foul sunlight and
# buffeted by hurricane winds. Shadowy, unexplored openings in the mountains
# lead into the caves.
#
#   Warcamp
#     An arbitrary array of tents, shields, and banners rise against the
#     mountainside.
#
#     War Pavilion — Inside the enormous tent is a round table, with a
#       parchment map of Ravenheart and its surroundings strewn across it.
#     Common Grounds — The wide open area features a round sparring ground
#       with training weapons strewn around the perimeter. Nearby is the
#       well—don't fall in.
#     Healer's Tents — A handful of individual bunks under small tents
#       surround the larger healer's tent. Inside the main tent, a central
#       slab serves as an operating table, with very basic instruments and
#       herbal remedies in drawers around it.
#     Fields — Ranch animals — some distant descendants of the cow — mull
#       around. The crops grown here are measly and bitter due to the great
#       distance from the Lifeweb.
#     Mess Hall — There are tables lined up to form rows with stools situated
#       on either side. At the far end of the pavilion is a large pot, gently
#       bubbling over some coals.
#
#   Broken Spears Camp
#     The Broken Spears have claimed this part of the camp as their own.
#     Despite the signs of revelry — a hookah tent, flagons are scattered
#     across the tables, tentholes torn in from scuffles — this is clearly a
#     place of survivors, efficient and minimal.
#
#   Windriders Camp
#     The Windriders have established themselves here. Tents are placed in
#     orderly rows with equipment in convenient locations, ready to be
#     equipped at a moments notice. There are banners woven out of human hair.
#
#   Mountains
#     Great peaks which rise above the landscape, shielding the valley from
#     the worst of the winds. Traversing them will not be easy — the easiest
#     route would be around and through the river valley, into the Town.
#
# --- Cave level: Railroad --------------------------------------------------
# A powered train station looming over an inscrutable abyss. You could get on,
# but where would you go? There are openings in the subway tunnels leading
# into ancient, unused maintenance areas. Where the tunnels break into open
# air, you can indeed see the pits, deformed and warped into unnatural stone.
# There's reflective metal down there. Chrome? Ceramite?
#
#   Station
#     A powered train station looming over an inscrutable abyss. You could get
#     on, but where would you go? Openings in the subway tunnels lead into
#     ancient, unused maintenance areas; where they break into open air, the
#     pits show below, deformed and warped into unnatural stone.
#
# --- Cave level: Aberrant Pits ---------------------------------------------
# The start and end of all things. What madness brought you down here? The
# stone curves into strange, meandering passageways, but ceramite catches your
# torchlight. Monuments of chrome — cities within the deep.
#
#   Chrome City
#     The stone curves into strange, meandering passageways, but ceramite
#     catches your torchlight. Monuments of chrome rise ahead — a city within
#     the deep, and nobody to say who built it.
#
# --- Also retired ----------------------------------------------------------
# Town's Forest location, whose prose became the Forest ZONE's description
# above. The Depot spent a while as a Location of its own, split out of the
# Customs description's depot paragraph; it is back inside Customs, because two
# places at one cave mouth with no edge between them meant a migrant who
# cleared customs could not walk to the shop.
# ===========================================================================
