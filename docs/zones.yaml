# Source of truth for the game's Zones, their Locations and each Location's
# Rooms, hand-edited then pushed with `npm run db:sync-zones`
# (db/lib/syncZones.js). This sync is fully destructive in both directions:
# entries here are upserted into the DB and Discord by `id` slug, and any
# Zone/Location/Room NOT listed here gets its Discord objects deleted and its
# DB row removed — for a Zone that means a whole category, its #summary and
# its "Zone: {Name}" role; for a Location its channel; for a Room one thread.
# Removing an entry is a real delete — there's no undo short of re-adding it
# (which provisions brand-new Discord objects, since a removed/re-added entry
# loses its old Discord IDs).
#
# Zones, levels, locations and rooms are maps keyed by `id` (`town:`, not
# `- id: town`). See docs/tags.yaml's header for why, and db/lib/yamlEntries.js.
#
# A ZONE is a region: a Discord category, a #summary channel anyone in the
# zone reads, and a "Zone: {Name}" role. A LOCATION is where a character
# actually STANDS: one text channel under the zone's category. A Location
# wears NO role — the channel is opened to whoever is standing in it by a
# per-member permission overwrite, because 56 locations would otherwise have
# eaten 56 of the guild's 250 roles. A ROOM is a thread under its Location's
# channel — public (a public thread everyone in the Location sees) or private
# (a private thread whose members are exactly the characters holding one of
# its `access:` tag slugs; the bot adds and removes them as tags come and go).
# Every presence zone needs at least one Location, and a Location may have no
# Rooms.
#
# - id: a stable slug, used to match this entry to its DB row across syncs.
#   Zones, locations and rooms share ONE slug namespace. Renaming an entry
#   later means changing `name` here, NOT `id` — a changed `id` is treated as
#   a brand-new entry (old one pruned, new one provisioned from scratch)
#   instead of a rename. A Location's id is also its Discord channel name.
# - name: display name (Title Case). Only used as the Discord channel/
#   category/role name the FIRST time an entry is provisioned — renaming it
#   here later does not rename already-provisioned Discord objects. NEVER put
#   a ‡ in one: the channel doctor matches on these.
# - description: prose. A Location's is the -# subtext on its channel's
#   pinned anchor and the channel topic; a Room's is its thread's starter
#   message.
# - indoors (locations only): true for a place you walk INTO rather than
#   across. A cart or a mount is unequipped on arrival, with a DM, and cannot
#   be equipped while a character stands here — so its carry bonus is parked
#   at the door with it (docs/systemdocs/CARRY.md §3). The anchor message says
#   so in a -# line of its own, written by syncZones, so nobody has to be told
#   twice. Default false; a Room never carries it, since a Room is inside its
#   Location by definition.
# - attributes (locations only): a map of extra facts about the place, keyed
#   by the registry in db/lib/locationAttributes.js. Each one the Examine
#   button turns into a sentence. A key the registry does not know is a sync
#   PROBLEM, not a silent skip, because a typo would otherwise be a place that
#   never says what it is. `indoors` is deliberately NOT one of these — it is a
#   real column that mounts and carts act on — but Examine prints it alongside
#   them as though it were.
# - stash (rooms only): what is simply THERE in the room, like the Sanctuary
#   operating theatre's surgical instruments. Two shapes, both accepted:
#
#       stash: [surgical-equipment]          # the short one: each slug, x1
#
#       stash:                               # the long one, with quantities
#         resources: 24
#         items:
#           obol: 3
#           cleaning-powder: 1
#
#   Written as a FLOOR, never a reset. A stack already at or above the
#   authored quantity is left alone, and `resources` is written only while the
#   room still holds none — so re-syncing can neither undo a player carrying
#   the anvil off nor quietly duplicate it. Tags sync AFTER zones, so an
#   unknown slug is skipped with a warning rather than throwing.
# - access (rooms only): a list of Tag slugs from docs/tags.yaml. Non-empty
#   makes the room PRIVATE, admitting anyone holding ANY of the listed tags.
#   Slugs aren't checked against the tag catalog here (tags sync after
#   zones); a typo is a room nobody can enter, reported by the channel doctor.
#
# PROSE STYLE — every prose value in this file is a `>-` folded block
# scalar, one physical line per paragraph, no hard wrapping, UNLESS it has
# real paragraph breaks, in which case it takes `|-` instead, with ONE blank
# line between paragraphs. An unwritten value is literally `""`.
#
# The dormant `map:` block is gone. It described the retired /map plate's four
# rhombi, and the geography it described no longer exists.
#
# THE WILDERNESS IS NUMBERED ON PURPOSE. Most nodes outside the built-up
# places are named after their zone and a number — "Forest 7", "Depths 3" —
# with a description of their own. The traveller is meant to learn one stretch
# of woods from the next by walking them, not by reading a name. The `id`
# keeps the number from Bascinet's hand-drawn map rather than the public one,
# so the file and the drawing can always be lined up; the `# map node NN`
# comments say which is which.
#
# ---------------------------------------------------------------------------
# connections: the whole travel graph. ONE entry per edge — it is undirected,
# and stating it twice is an error the parser catches. A hop between two
# Locations of the SAME zone is free, on the cooldown set on /gm/dev
# (GameConfig.locationMoveCooldownSeconds). A hop whose pair crosses into
# ANOTHER zone costs the character's Move — once a turn, twice with a mount.
# A `kind: group` zone's own id may never appear here; only its levels'
# locations are places.
#
# Two forms. A bare pair is a plain open road, which is most of the map:
#
#   - [town/town-square, town/church]
#
# Anything else is a mapping. The keys compose, because one edge really is
# two things at once:
#
#   - pair: [fortress/gatehouse, fortress/road]
#     announce: true_name          # a MANNED gate. Posts the crosser's real
#                                  #   name into the destination zone's
#                                  #   #summary. /conceal does not help: there
#                                  #   is a watchman here reading papers.
#     announce: concealed          # an UNMANNED gate. Posts only what a
#                                  #   passer-by would have seen — "An old
#                                  #   woman has entered the Gate."
#     locked: <tag-slug>           # crossing needs the tag. LISTED, so a
#                                  #   player sees the door and learns what
#                                  #   opens it.
#     hidden: <tag-slug>           # crossing needs the tag AND the way is
#                                  #   absent from the travel list, so a
#                                  #   player without it never learns it is
#                                  #   there. Refuses in the same words a
#                                  #   nonexistent edge does, deliberately.
#     modular:                     # an Open/Close button on both endpoints'
#       roles: [watchman]          #   anchors. Impassable while shut. `roles`
#       tags: [watch-badge]        #   are Role slugs from docs/roles.yaml and
#       open: true                 #   `tags` are Tag slugs; holding any one is
#                                  #   authority to work it. `open` is what the
#                                  #   gate is BORN as — a re-sync never
#                                  #   reopens one somebody shut in play.
#     keyed: true                  # on crossing, the KEY-HOLDER is DM'd "Leave
#                                  #   it open for the next 24 hours?". Yes and
#                                  #   the way ignores its tag and shows in
#                                  #   everyone's travel list until the window
#                                  #   lapses — which is how somebody without
#                                  #   the key follows them through. Needs a
#                                  #   locked or hidden tag to hold open.
#
# `locked` and `hidden` are the same requirement with different visibility, so
# an entry may carry one or the other, never both. Role and Tag slugs are NOT
# validated here, because tags and roles sync AFTER zones (SYNC.md's working
# order) — the same trade the room `access:` list already makes. db:doctor
# checks them instead.
# ---------------------------------------------------------------------------
zones:
  town:
    name: Town
    kind: surface
    sort: 1
    description: >-
      Ants in the marshy chaff. The town is surrounded by an old wall of ancient ceramite, so old it looks exhumed from the ground, patched by wooden palisade. Decayed electric lights illuminate the narrow streets. Speakers blare the Baron's words. It is claustrophobic — salt-of-the-earth, virtuous, and degenerate types all in one disease-ridden congregation.
    locations:
      # Old location id "town" collides with this zone's own id (all slugs
      # share one namespace) — hence "town-square".
      town-square:
        name: Square
        description: >-
          An open clearing — you can actually see the sky, finally. There's a simple platform with gallows at the center. Since the inquisition's arrival, the gallows beams have come to serve the additional purpose of a crucifix. There's a stagnant pond, still and calm aside from the occasional rat seeking water. A solemn gargoyle perches on the central pillar, its eyes long dry since the waterworks broke down. Follow winding streets and alleyways to domiciles ranging from modest homes to opulent manors.
        rooms:
          courtyard:
            name: Courtyard
            description: >-
              A rectangular patch of salted earth. Spectator stands awaiting bloodshed surround it. Perfect place for a duel, competition or random bout of violence!
          market-row:
            name: Market Row
            description: >-
              Lines of stalls and tents perched against buildings. You can find all sorts of bargains here, if buying random crap is your kind of thing.
          smithery:
            name: Smithery
            description: >-
              The dull clanging ringing against your ears rises in intensity as you approach. Arms, armor and accoutrements are lined up behind the counter, waiting to be purchased.
          warehouse:
            name: Warehouse
            description: >-
              A long building storing food and other public goods.
            stash:
              resources: 4
              items:
                workshop-equipment: 1
      # Promoted out of the Square, where it was a room, because the map makes
      # it a place you walk to. Its prose is unchanged.
      old-cock-inn:
        name: The Old Cock Inn
        indoors: true
        description: >-
          The coziest part of Ravenheart, open all hours of the day. It draws people from all walks of life here with the promise of hot food and liquor. Alcohol heals the soul, and will surely help you win the bar fight that is no doubt brewing.
        rooms:
          cellar:
            name: Cellar
            description: >-
              A low roof; you almost hit your head. Shelves and kegs illuminated by wall candles set in a ram's horn.
            access: [cellar-key]
            stash:
              resources: 3
              items:
                alcohol: 1
      # Named "Gate" in play; the id is north-gate because the Gatehouse
      # already owns the slug "gate" for its own room.
      north-gate:
        name: Gate
        description: >-
          The northern way in, and the one the road actually uses. Two towers, a chain, and a brazier that is kept lit because the Baron pays for the wood. Nobody is posted here at night, which everybody knows. ‡
        rooms: {}
      church:
        name: Cathedral
        indoors: true
        description: >-
          Stained limestone erected modestly upon a tall wooded hill on the western edge of the town — still within the walls. Hundreds of candles light the ornate interior.
        rooms:
          bell-tower:
            name: Bell Tower
            description: >-
              A grand, bronze bell sits up here watching over the town, waiting for a tug from below to let it sound across the land. Some vagrant has painstakingly scraped their initials into it.
          confessionals:
            name: Confessionals
            description: >-
              Cramped and dark, the confession box was the church's primary source of information until the arrival of the inquisition and their more proactive methods. If the bishop is feeling generous, he may even take your confession free of charge.
          order-chambers:
            name: Order Chambers
            description: >-
              The heart of the Order. There's a small room off to the side: tool racks line the walls with cruel and unusual instruments. Cages are positioned in the corners, awaiting occupants. At the center sits a chair with straps. If you tell them what they want to hear, maybe your death will be painless.
            access: [order-key]
          pantry:
            name: Pantry
            description: >-
              Shelves of bread, oil and candle-stubs behind a door the Bishop keeps shut. What the Cathedral gives away it gives away from here, which is why it is locked. ‡
            access: [cathedral-key]
            stash:
              resources: 3
          scriptorium:
            name: Scriptorium
            description: >-
              It is a cavern: books and tables immaculately organized, but towards the back, the stench of old books hosting colonies of mold is overwhelming. Every surface is stacked with piles of long forgotten scrawlings of past generations. Holy seals bearing quotes of scripture are stamped haphazardly.
      sanctuary:
        name: Sanctuary
        indoors: true
        description: >-
          A squat but elegant place built into the ruins of an old fort. Immaculately clean, bathed by light. The Barons funded it with electrical and mechanical equipment, but not all of it works — the wooden contraptions are more reliable.
        rooms:
          ward:
            name: Ward
            description: >-
              A long, tiled room, on either side are small bedframes. Potted plants offer the patients a quiet hope.
          esculaps-office:
            name: Esculap's Office
            description: >-
              Furnished with wood, the office stands in stark contrast to the sanitized aesthetics of the rest of the Sanctuary. Shelves on the wall are lined with glassware and bottles containing hundreds of different reagents.
          operating-theater:
            name: Operating Theater
            description: >-
              A small room, windowless. A single surgery bed rests at the centre, surrounded by tables with all manner of instruments neatly arranged. An anaesthetic system is hooked up to the surgery bed, mercifully letting patients sleep through the operation. A freezer box sits in the corner awaiting generous organ donations.
            stash: [surgical-equipment]
          supply-storage:
            name: Supply Storage
            description: >-
              Neatly organized shelves, labeled, archived, illuminated by standardized electric lights. Possibly the most valuable place in Ravenheart.
            access: [sanctuary-key]
            stash:
              resources: 24
              items:
                obol: 3
                cleaning-powder: 1
                surgical-equipment: 2
          garden:
            name: Garden
            description: >-
              You can grow herbs here.
      underquarter:
        name: Underquarter
        description: >-
          Squat buildings, piled into discomfort.
        rooms:
          shacks:
            name: Shacks
            description: >-
              These crudely constructed dwellings — scrap metal, wood — were never designed to last, and yet here they remain. Very few have proper owners, even fewer have working locks. An endless cycle of vagrants staking claim to an empty shack, before being turfed off by another. There are old abandoned lots too, dozens of empty buildings without purpose.
          abandoned-theater:
            name: Abandoned Theater
            description: >-
              Once a bustling center of culture, this place now serves as a home for an ever-growing population of the destitute. A side room functions as a gambling den. Neon lights soak the interior, illuminating the felted gambling tables. There is a counter at the far end of the room with a bell waiting for patrons to ring it and have their worldly desires fulfilled.
          bathhouse:
            name: Bathhouse
            description: >-
              One of the newer parts of the town, the bath house offers a central communal bath. The water is off-color — it doesn't smell good. Alternatively, paid showers line the walls, providing fresh clean water in return for a coin inserted into a slot.
      the-hole:
        name: The Hole
        description: >-
          A subsidence in the middle of the poor quarter that nobody has filled in, because filling it in would mean admitting whose fault it is. Three streets drain into it. The buildings around the rim lean inward, propped against each other, and the people who live in them have made the slope into stairs. ‡
        rooms: {}
      south-gate:
        name: South Gate
        description: >-
          A postern, really — one arch, one bar, one man's width. It faces the woods and the cave road, which is why the respectable traffic uses the north gate and this one gets everything else. There has not been a watchman on it in living memory. ‡
        rooms: {}
      farms:
        name: Farms
        description: >-
          Squalid patches of mud outside the town walls. The ground sustains you, and to it you shall return. Strike the earth!
        yield: { farming: 1.0 }
        rooms: {}

  fortress:
    name: Fortress
    kind: surface
    sort: 2
    description: |-
      The fortress and its small surrounding estates rise nobly from the wooded hills, the keep itself visible behind the walls. They look down upon the town. A stone bridge fords the river.

      The Lifeweb emits primordial green fires.
    locations:
      gatehouse:
        name: Gatehouse
        description: |-
          Grass rises rebelliously around the manicured paths, illuminated by searchlight. Past the portcullis, old stone stairs rise towards the Keep, and further yet, to the Lifeweb tower. The Gatehouse itself has several watchtowers and a murder hole over the gate. A winch system controls the portcullis. There is a back gate behind the fortress leading into the forest, but it's equally guarded.

          There is a triple-barreled machinegun in the center of the yard, on a rotor. It seems to be off.
        rooms:
          gate:
            name: Gate
            description: >-
              Menacing iron, with several inset windows, built by a paranoid man. There are old logs to the side, piled and bound.
          yard:
            name: Yard
            description: >-
              The constant rains have raised vines across the fortress walls, which flower white and pink.
          stables:
            name: Stables
            description: >-
              A small stable. Most of the pens are empty. Those that aren't have old horses, lame and unable to bear the weight of a human.
      # Promoted out of the Gatehouse, where it was a room. On Bascinet's map
      # this is the node drawn as "Gardens". Its prose is unchanged.
      lifeweb:
        name: Lifeweb
        description: >-
          A tower of pure ceramite looms before you. Its peak crowned with vibrant flame. The Mortii's key unlocks the door.
        rooms: {}
      servant-wing:
        name: Servant Wing
        description: >-
          Where the fortress actually runs from: laundries, sculleries, a back stair that reaches every floor without passing a single door the nobility use. The people here know more about the Keep than anyone in it, and are paid partly in the understanding that they will not say so. ‡
        rooms:
          storehouse:
            name: Storehouse
            description: >-
              A larder and a cellar combined in one, holding the keep's goods.
            stash:
              resources: 3
              items:
                fine-meal: 1
      keep:
        name: Keep
        indoors: true
        description: |-
          Stone walls reinforced with ceramite, the color of terracotta and steel, draped with the Baron's fluttering heraldry. Old electric lamps of various colors illuminate the warm, comfortable interiors.

          The gates open into a hallway branching into the Keep's many rooms. Past gargoyle-studded columns, the throne room. Stairs lead downwards into the Undercroft and upwards into the Quarters.
        yield: { farming: 0.2 }
        rooms:
          throne-room:
            name: Throne Room
            description: |-
              Intimately small, with an ornately carved wooden throne. The floor is uniformly tiled with ceramite bricks aside from a patch directly in front of the throne. Benches form concentric circles near the entrance. There's an elevated arcade to the left, and a hearth to the right.

              There's a trapdoor in the center. You can hear something rumbling in the darkness.
          great-hall:
            name: Great Hall
            description: >-
              The roof vaults over rows of banqueted tables. There's a balcony; the view plunges downwards into the forest.
          council-room:
            name: Council Room
            description: >-
              A wide table. There's a holographic map of Ravenheart and a button for the intercom.
          swimming-pool:
            name: Swimming Pool
            description: >-
              An extravagant design. Its novelty has worn off, and now it's a place where the nobility fall in and drown. You swear you can see something shiny at the bottom.
          library:
            name: Library
            description: >-
              Rows upon rows of bookcases, most of which lie empty. Various offices of members of the court branch off from here.
          noble-chambers:
            name: Noble Chambers
            description: >-
              The Baron's room opens into a large, ornately decorated bedroom with a stunningly comfortable bed at the center. A wardrobe built into the wall contains all manner of fine attire for both the Baron and Baroness. Just adjacent are the Heir and Successors rooms, both significantly smaller, and decorated to their occupants' preferences.
          the-charon:
            name: The Charon
            description: >-
              A sealed gate. The Baron's key opens this.
            access: [the-barons-key]
          reliquary-chapel:
            name: Reliquary Chapel
            description: >-
              The Silver Cross of Ravenheart is locked away here, accessible by the Incarn's key. Courtiers come here to pray.
            access: [incarns-key]
          barons-study:
            name: "Baron's Study"
            description: >-
              Scrolls, books, and the elegant skeleton of a cave beast. A balcony looks out onto Ravenheart.
            access: [the-barons-key]
            stash:
              items:
                armory-key: 1
                elevator-key: 1
      garrison:
        name: Garrison
        description: >-
          The garrison tower and its offshoot buildings surround the training yard. A home for those who walk the cobbles at night.
        rooms:
          captains-office:
            name: Captain's Office
            description: >-
              On the second floor of the tower, the captain's office is a spacious room. A small portrait of the captain's beloved Baron is perched on the wall. A window looks out over the training ground below, perhaps you should let in some air — it smells like alcohol…
          barracks:
            name: Barracks
            description: >-
              Rows of bunks stand at attention. All but a handful are orderly and unused, might be a sign it's time to find some new recruits.
          mess-hall:
            name: Mess Hall
            description: >-
              The Watch's few goods are stored here. There are tables, a bar, and a window looking into the courtyard.
            stash:
              resources: 2
              items:
                alcohol: 1
          armory:
            name: Armory
            description: >-
              There's a statue of the good Baron Casimir II. Halberds, shields mounted on the walls, and a single electric chandelier hanging from the rafters.
            access: [armory-key]
            stash:
              items:
                halberd: 2
                broadsword: 1
                gladius: 2
                mace: 3
                dagger: 2
                spear: 3
                buckler: 4
                shield: 3
                longbow: 2
                breastplate: 2
                simple-helm: 6
                mail-coif: 3
                mail-shirt: 4
                padded-armor: 5
                padded-cap: 3
          dungeons:
            name: Dungeons
            description: >-
              Rows of cells behind iron bars, each with a lock only accessible by members of the garrison. Connects to the Undercroft.
          training-yard:
            name: Training Yard
            description: >-
              In the garrison's central courtyard, surrounded by elevated platforms, a patch of packed earth serves as a sparring ground for recruits and veterans alike. There is a box of wooden training weapons.
          kennels:
            name: Kennels
            description: >-
              Good and mean dogs both, ready to hunt unruly peasants. Their cages are locked and only accessible by members of the garrison.
      undercroft:
        name: Undercroft
        indoors: true
        description: >-
          Pillars uphold the keep from collapsing onto the barrels of wine and antiquities. There are deeper passages.
        rooms:
          sauna:
            name: Sauna
            description: >-
              A bath and a sauna. The Baron's preferred way to wash. The water is kept at a comfortably warm temperature, and is actually changed, unlike the public bathhouse.
          cistern:
            name: Cistern
            description: >-
              Dark, connected rooms with ornate pillars, full of knee-high water. A starry tile mosaic is visible beneath the water.
          tombs:
            name: Tombs
            description: >-
              The Baron's progenitors bear faces of varying humanity.
          bricked-up-door:
            name: Bricked-up Door
            description: >-
              Where does this go…? It wouldn't be easy to open this passageway.
          ancient-shrine:
            name: Ancient Shrine
            description: >-
              A shrine to Thoth, the Old God of art, magnificence, and inspiration. How has this not been destroyed yet?
      # map node 11
      road:
        name: Road
        description: >-
          The approach, running from the gatehouse down between the estates. Metalled, drained, and swept — the only stretch of road in the barony that is any of those things. Riding up it is a declaration. Walking up it is a request. ‡
        rooms: {}
      manors:
        name: Manors
        description: >-
          The lesser houses, strung along the ridge where the air is better and the smell of the town does not reach. Each has a wall, a gate, and a family that would rather you used them. Between them, orchards nobody picks. ‡
        yield: { farming: 0.6 }
        rooms: {}

  forest:
    name: Forest
    kind: surface
    sort: 3
    description: >-
      Streams part mossy boulders under the green shadows of spruce and beech. The rustling of leaves in the wind is occasionally interjected by the sounds of things moving in the undergrowth. There are marshes, creeks, bountiful visages. The trees thin on their approach to the mountains.
    locations:
      # map node 1
      forest-1:
        name: Forest 1
        description: >-
          The river comes out of the rock here, cold enough to ache. Beyond it the trees give up and the land goes to scree. Nobody has any reason to be this far west, which is its own kind of reason. ‡
        yield: { hunting: 0.5, farming: 0.3, fishing: 0.7 }
        rooms: {}
      # map node 2
      forest-2:
        name: Forest 2
        description: >-
          The ground rises toward the fortress cliffs, and the spruce grow crooked out of them. Somewhere above, water runs through stone that was cut, not worn. There is an old service door in the hillside, and it has a keyhole. ‡
        yield: { hunting: 0.5, farming: 0.3 }
        rooms: {}
      # map node 3
      forest-3:
        name: Forest 3
        description: >-
          Four ways meet under a beech old enough to have a name nobody remembers. The undergrowth is trodden flat in a ring around it. People stop here. Not all of them go on. ‡
        yield: { hunting: 0.5, farming: 0.3, fishing: 0.7 }
        rooms: {}
      # map node 4
      forest-4:
        name: Forest 4
        description: >-
          The road proper, rutted by cart wheels and kept clear by the Baron's men. It runs downhill toward the town's north gate and uphill toward the manors. Walking it means being seen. ‡
        yield: { hunting: 0.5, farming: 0.5, fishing: 0.7 }
        rooms: {}
      # map node 5
      forest-5:
        name: Forest 5
        description: >-
          A bog that has been swallowing this stretch of path for a century. Boards have been laid across the worst of it and then laid again on top of the rotted ones. Do not step where the moss looks freshest. ‡
        yield: { hunting: 0.7, farming: 0.3 }
        rooms: {}
      # map node 6
      forest-6:
        name: Forest 6
        description: >-
          Charcoal burners worked here once. The clearings are circles of black earth where nothing has grown back, and the stacked kilns have collapsed into shapes that look, at dusk, like people sitting. ‡
        yield: { hunting: 0.5, farming: 0.3, fishing: 0.7 }
        rooms: {}
      # map node 7
      forest-7:
        name: Forest 7
        description: >-
          Deadfall from a storm nobody alive remembers, piled two men high and going soft. Threading it takes an hour. Going around takes three. Things live in it. ‡
        yield: { hunting: 0.5, farming: 0.3 }
        rooms: {}
      # map node 8
      forest-8:
        name: Forest 8
        description: >-
          Where every southern path knots together: the town's south gate above, the farms east, the cave mouth below. There is a shrine at the junction and somebody keeps it swept, though no one will admit to it. ‡
        yield: { hunting: 0.5, farming: 0.5 }
        rooms: {}
      # map node 9
      forest-9:
        name: Forest 9
        description: >-
          Terraced ground the farmers gave up on, sliding slowly downhill. The old irrigation channels still run, and they run somewhere. Cargo comes up out of the ground near here and nobody asks whose. ‡
        yield: { hunting: 0.5, farming: 0.5 }
        rooms: {}
      # map node 10
      forest-10:
        name: Forest 10
        description: >-
          The eastern bank, where the river turns and the water goes quiet and deep. There is a culvert in the bank, grated once. The grate is gone. ‡
        yield: { hunting: 0.5, farming: 0.3, fishing: 0.7 }
        rooms: {}
      # map node 36
      forest-36:
        name: Forest 11
        description: >-
          Coppiced woodland, cut on a cycle so old it looks natural until you notice every trunk is the same age. The farms begin where the stools end. ‡
        yield: { hunting: 0.5, farming: 0.3, fishing: 0.7 }
        rooms: {}

  east-forests:
    # Renamed to the Black Hills. The `id` deliberately does NOT move: changing
    # it would prune every location under it, and the slugs are what tie each
    # node back to the numbers on Bascinet's drawing.
    name: Black Hills
    kind: surface
    sort: 4
    description: >-
      Older woodland across the river, where the barony's writ thins out and then stops. The trees stand further apart than they have any right to and the ground between them is too clear. People who go in come back with stories that do not agree with each other. ‡
    locations:
      mountain:
        name: Mountain
        indoors: true
        description: >-
          The pass over the peak, and the only way across the range on foot. Cut steps where the rock allows and a fixed rope where it does not, both maintained by nobody in particular. From the top you can see the fortress on one side and the western woods on the other, which is the only place in the barony where both are true at once. ‡
        rooms: {}

      # map node 12
      east-forests-12:
        name: Black Hills 1
        description: >-
          Where the mountain road finally comes down out of the rock. The trees here are wrong — taller, further apart, quieter — and the ground between them is clear in a way no forest manages by itself. ‡
        yield: { hunting: 0.8 }
        rooms: {}
      # map node 13
      east-forests-13:
        name: Black Hills 2
        description: >-
          The river again, wider and slower, with the far bank invisible in the haze. A ferry rope is still strung across it. There is no ferry. ‡
        yield: { hunting: 0.8 }
        rooms: {}
      # map node 25
      east-forests-25:
        name: Black Hills 3
        description: >-
          Hunters' country. Trails braid and rejoin, marked by cuts in the bark at shoulder height, and the marks are not in any alphabet the town uses. ‡
        yield: { hunting: 0.8 }
        rooms: {}
      # map node 26. Renamed off the numbered series because the brigands live
      # here now — a place people talk about needs a name people can say.
      east-forests-26:
        name: Ravine
        description: >-
          The high ground, where you can see the whole eastern spread and understand for the first time how much of it there is. The hills split here, a dry cut too steep to walk into and too deep to see the bottom of. Roots come through the wall of it. Somebody has been up and down this more than once, and has been careful about where they put their feet. ‡
        yield: { hunting: 0.8 }
        rooms:
          ravine-camp:
            name: Ravine Camp
            description: >-
              Roots hang over the ravine ledge, further obscuring the hidden camp. There's meats drying on a rack, a couple of fires, and some stolen crates.
            access: [hills-camp]
            stash:
              resources: 4
              items:
                spear: 2
                buckler: 2
                work-knife: 3
                mace: 1
                shortbow: 1
                padded-armor: 1
                padded-cap: 2
                brigandine: 1
                skinned-cave-rat: 1
      # map node 27
      east-forests-27:
        name: Black Hills 5
        description: >-
          A crossroads of deer paths in a stand of black pine, so dense that noon reads as evening. Sound does not carry. Neither do shouts. ‡
        yield: { hunting: 1.3, fishing: 0.8 }
        rooms: {}
      # map node 28
      east-forests-28:
        name: Black Hills 6
        description: >-
          Ruins under moss: footings, a doorstep, the stub of a chimney, all laid out in a grid too regular for a village. Whatever stood here was planned by somebody with a straight edge. ‡
        yield: { hunting: 0.8 }
        rooms: {}
      # map node 29
      east-forests-29:
        name: Black Hills 7
        description: >-
          A dead end that does not look like one until you are in it — a bowl of ground ringed by rock, floored in fern. Excellent for hiding. Terrible for leaving. ‡
        yield: { hunting: 0.8 }
        rooms: {}
      # map node 30
      east-forests-30:
        name: Black Hills 8
        description: >-
          The eastern edge, where the forest thins into scrub and the ground starts its long fall toward the marsh. The air changes here. You can taste it before you see it. ‡
        yield: { hunting: 1.1 }
        rooms: {}

  marshes:
    name: Marshes
    kind: surface
    sort: 5
    description: >-
      Standing water from horizon to horizon, threaded by channels somebody dug and reeds nobody planted. The ground here is a rumour. What lives on it has built out of what the water gives up, and what the water gives up is not from around here. ‡
    locations:
      village:
        name: Village
        description: >-
          Houses on stilts, joined by walkways, with boats tied under every doorstep. They pay the Baron nothing and he sends nobody to collect it. The people are courteous, incurious about you, and extremely curious about what you brought. ‡
        rooms: {}
      factory:
        name: Factory
        indoors: true
        description: >-
          A hall of rusted frames standing in six inches of water, roofed where the roof has held. Something in it still turns — you can feel it through the boards before you hear it. The village will not say who keeps it running, only that it has always been running. ‡
        rooms: {}
      # map node 31
      marshes-31:
        name: Marshes 1
        description: >-
          Firm ground, barely — a tongue of gravel reaching into the wet, which is why every road in the marsh eventually comes here. Cart ruts fill with brown water and hold their shape for weeks. ‡
        yield: { hunting: 1.0, fishing: 1.0 }
        rooms: {}
      # map node 32
      marshes-32:
        name: Marshes 2
        description: >-
          Reed beds over your head, cut through by a channel somebody dug straight. Straight is not natural here. Follow it and you are following somebody's intention. ‡
        yield: { hunting: 1.0, fishing: 1.0 }
        rooms: {}
      # map node 33
      marshes-33:
        name: Marshes 3
        description: >-
          Where the ground gives up pretending. Duckboards run from hummock to hummock, and under them the water is black and warm and moves against the current. ‡
        yield: { hunting: 1.0, fishing: 1.0 }
        rooms: {}
      # map node 34
      marshes-34:
        name: Marshes 4
        description: >-
          Drowned pasture. Fence posts stand in three feet of water in lines that go on past where you can see, and the animals they were built for have been gone a long time. ‡
        yield: { hunting: 1.0, fishing: 1.0 }
        rooms: {}
      # map node 35
      marshes-35:
        name: Marshes 5
        description: >-
          The southern sink, where everything the marsh carries finally stops. There is a smell. There is also a stairwell, going down, with water lapping at the fourth step. ‡
        yield: { hunting: 1.0, fishing: 1.0 }
        rooms: {}

  # --- Underground (group) ---
  # Category + GM seat only, NOT a standable place: no #summary, no "Zone:
  # Underground" access role, and it never appears in connections. Its
  # `levels:` map is flattened by the sync into two real zones (caves /
  # depths), each shaped like a surface zone minus `kind`; their Location
  # channels parent to this one category.
  #
  # The kinds are kept rather than promoting Caves and Depths to surface
  # zones because the Caving Die only rolls on a CAVE_LEVEL arrival
  # (docs/systemdocs/CAVING.md), and a CAVE_LEVEL needs a CAVE_GROUP parent.
  # Sharing a parent also means they share one GM seat, which is what the
  # Caves seat already did across three levels.
  underground:
    name: Underground
    kind: group
    sort: 6
    description: >-
      The mouth to the other world.
    levels:
      caves:
        name: Caves
        sort: 1
        description: >-
          Wet, dimly-lit caves. The main paths have been smoothed down by centuries of traffic, but side paths and natural holes descend into darkness.
        locations:
          customs:
            name: Customs
            indoors: true
            description: >-
              The sentry beholds migrants and mercenaries as they talk around the fire. Besides the shuttle pad, there is a ledger room and a bunkhouse. The creatures of the caves seem drawn to the light — there is an automated small-caliber mounted on the outside wall to account for that. It's off. ‡
            rooms: {}
          depot:
            name: Depot
            indoors: true
            attributes:
              depot: true
            description: >-
              The merchant's depot: crates of a foreign design scattered around a decayed metal frame, light flowing forth, powered by their own basic generator. Everything imported into Ravenheart comes through this room, and the ledger that says so is the most valuable object in the caves. ‡
            rooms:
              landing-pad:
                name: Landing Pad
                access: [depot-keycard]
                description: >-
                  A scorched circle of plating under a hatch in the rock, wide enough to set a shuttle down on and not one inch wider. Most days it holds nothing but the smell of burnt fuel. On the days it does hold something, the crates are stacked where they fell. ‡
              cargo-bay:
                name: Cargo Bay
                description: >-
                  Shelves on either side, stacked high with crates.
                stash:
                  resources: 4
                  items:
                    obol: 2
                    cargo-crate: 1
          # map node 14
          caves-14:
            name: Caves 1
            indoors: true
            description: >-
              The first proper dark. The floor is smooth from centuries of boots and the walls are close enough to touch on both sides, which is a comfort until you think about it. ‡
            yield: { hunting: 0.4 }
            rooms: {}
          # map node 15
          caves-15:
            name: Caves 2
            indoors: true
            description: >-
              A junction chamber with too many exits. Cold air comes from one of them and warm air from another, and the difference is the only navigation you have. Somebody has scratched arrows. They disagree. ‡
            yield: { hunting: 0.4 }
            rooms: {}
          # map node 16
          caves-16:
            name: Caves 3
            indoors: true
            description: >-
              The old freight run — a level, worked passage, wide enough for two carts abreast, cut by people with better tools than anyone has now. It goes somewhere. It always went somewhere. ‡
            yield: { hunting: 0.4 }
            rooms: {}
          # map node 17
          caves-17:
            name: Caves 4
            indoors: true
            description: >-
              The stair head, where the smoothed paths end and the descending ones begin. Everything below this point is colder. There is a rope handrail, and it is not old. ‡
            yield: { hunting: 0.4 }
            rooms: {}
      depths:
        name: Depths
        sort: 2
        description: >-
          Below the worked passages, where the stone stops behaving. The walls are cut and the floors are level, and neither was done by anybody who left a name. Cold, and getting colder, and the cold is coming from somewhere. ‡
        locations:
          # map node 18
          depths-18:
            name: Depths 1
            indoors: true
            description: >-
              A dead end, and a wrong one. The passage simply stops at a face of worked stone with no seam, no door, and no reason. People come here to look at it and then leave quickly. ‡
            yield: { hunting: 0.6 }
            rooms: {}
          # map node 19
          depths-19:
            name: Depths 2
            indoors: true
            description: >-
              Water to the ankle, and it is moving, which means it is going somewhere, which means there is a somewhere. The sound is enormous in the dark. ‡
            yield: { hunting: 1.8 }
            rooms: {}
          # map node 20
          depths-20:
            name: Depths 3
            indoors: true
            description: >-
              A gallery so wide your light does not reach the far wall. The floor is flat and swept. Nothing down here sweeps. ‡
            yield: { hunting: 0.6 }
            rooms: {}
          # map node 21
          depths-21:
            name: Depths 4
            indoors: true
            description: >-
              The junction under the stair, where the routes from above finally braid together. Every party that comes down passes through. Not every party passes back. ‡
            yield: { hunting: 0.6 }
            rooms: {}
          # map node 22
          depths-22:
            name: Depths 5
            indoors: true
            description: >-
              The long eastern run, mile after mile of the same worked passage, and then a place where the wall has been broken through from the other side. ‡
            yield: { hunting: 0.6 }
            rooms: {}
          # map node 23
          depths-23:
            name: Depths 6
            indoors: true
            description: >-
              Where the deep passage rises again and the air turns salt. There is light ahead that is not yours, and it is not warm. ‡
            yield: { hunting: 1.6 }
            rooms: {}
          # map node 24
          depths-24:
            name: Depths 7
            indoors: true
            description: >-
              The eastern mouth, opening onto scree above the sea. The way out is here, if you count a two-hundred-foot climb as a way out. ‡
            yield: { hunting: 0.6 }
            rooms: {}

